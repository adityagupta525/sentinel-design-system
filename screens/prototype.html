<script type="text/babel" data-presets="react">
/* Both panels start on the same line. The log's header carries a 32pt Restart pill and the control
   panel's does not, so the label alone sat higher — one set of edges, per the review order. */
const panelHead = { display: 'flex', alignItems: 'center', gap: 10, minHeight: 32 };
const panelLabel = { font: 'var(--type-caption-font)', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.04em', color: 'var(--color-bronze-deep)' };
const panelCard = { borderRadius: 'var(--radius-16)', background: 'var(--color-surface)', padding: '10px 14px', boxShadow: 'var(--shadow-card-soft)' };

/* THE FOUR QUESTIONS A CHAT UI HAS TO ANSWER BY DEFAULT, made visible beside the phone rather than
   asserted in a document: where am I, what can I do, what happens next, and how do I go back. Every row
   is produced by `affordances()` from the live state, so this panel cannot claim a control the screen
   does not have. */
function ControlPanel({ state }) {
  const a = affordances(state);
  const Row = ({ k, v }) => (
    <div style={{ display: 'grid', gridTemplateColumns: '78px 1fr', gap: 'var(--space-8)', padding: '5px 0' }}>
      <span style={{ ...screenMuted, color: 'var(--color-muted)' }}>{k}</span>
      <span style={{ ...screenMuted, color: 'var(--color-ink)' }}>{v}</span>
    </div>
  );
  const List = ({ items }) => (
    <ul style={{ margin: 0, padding: '2px 0 2px 16px', display: 'flex', flexDirection: 'column', gap: 4 }}>
      {items.map((x, i) => <li key={i} style={{ ...screenMuted, color: 'var(--color-ink)' }}>{x}</li>)}
    </ul>
  );
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      <div style={panelHead}><span style={panelLabel}>Where you are</span></div>
      <div style={panelCard}>
        <Row k="Surface" v={a.where} /><Row k="Journey" v={a.journey} /><Row k="Step" v={a.step} />
      </div>
      <span style={panelLabel}>What you can do next</span>
      <div style={panelCard}><List items={a.next} /></div>
      <span style={panelLabel}>How you go back</span>
      <div style={panelCard}><List items={a.back} /></div>
    </div>
  );
}

function EventPanel({ events, onRestart }) {
  const row = { display: 'grid', gridTemplateColumns: '44px 1fr', gap: 'var(--space-8)', padding: '7px 0', borderBottom: '0.5px solid var(--color-line-soft)' };
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      <div style={panelHead}>
        <span style={panelLabel}>What moved, and when</span>
        <span style={{ ...screenMuted, marginLeft: 'auto' }}>{reduced() ? 'Reduced motion (from the OS)' : 'Full motion'}</span>
        <Pill label="Restart" size="sm" onClick={onRestart} />
      </div>
      <div style={{ ...panelCard, padding: '4px 14px', minHeight: 120, maxHeight: 520, overflowY: 'auto' }}>
        {events.length === 0 && <p style={{ ...screenMuted, padding: '10px 0' }}>Nothing yet. Tap a row on Home, or type a sentence — the router decides which journey it enters.</p>}
        {events.map((e, i) => (
          <div key={i} style={{ ...row, borderBottom: i < events.length - 1 ? row.borderBottom : 'none' }}>
            <span style={{ ...screenMuted, fontVariantNumeric: 'tabular-nums', color: 'var(--color-muted)' }}>{e.t.toFixed(1)}s</span>
            <span style={{ ...screenMuted, color: 'var(--color-ink)' }}>{e.what}{e.motion && <span style={{ color: 'var(--color-muted)' }}> — {e.motion}</span>}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

const TRY = [
  ['Why did Sharma’s portfolio drift this quarter?', 'Journey B, all the way to placed'],
  ['Start Meera’s risk profile', 'Journey A — the rail, sixteen steps'],
  ['Build a proposal for Mr. Amit Aggrawal', 'Journey D — the rail again, four steps, and a document'],
  ['Rebalance Sharma', 'Journey E — one question, three rules, and only one of them costed'],
  ['Review portfolio', 'Journey F — one question, and a finding that is a missing figure'],
  ['Flexi cap funds on my shelf', 'Journey C — the shortlist'],
  ['What have I placed this month?', 'The ledger'],
  ['Sell all of Sharma’s Quant Small Cap', 'An instruction that would act — previewed, never run'],
  ['File Meera’s ITR for this year', 'In the domain, out of scope'],
  ['sharma ka wala thing', 'Not understood — and nothing guessed at'],
  ['What can I ask?', 'The standing answer'],
];

function App() {
  const [events, setEvents] = React.useState([]);
  const [runId, setRunId] = React.useState(0);
  const [state, setState] = React.useState({ screen: 'home', journey: null, phase: 'trace', artifact: 'filling' });
  const t0 = React.useRef(performance.now());
  const onEvent = (what, motion) => setEvents((ev) => [...ev, { t: (performance.now() - t0.current) / 1000, what, motion }]);
  const restart = () => { t0.current = performance.now(); setEvents([]); setRunId((r) => r + 1); setState({ screen: 'home', journey: null, phase: 'trace', artifact: 'filling' }); };
  return (
    <ScreenShell
      journey="Every journey" n="7" name="The app, end to end"
      job="One phone and one composer. Type or tap a sentence and the router decides which of the six buckets it lands in, and therefore which journey opens — Sharma's drift all the way to placed, Meera's risk profile on its own surface, the fund shortlist, the ledger, and the four refusals. The panel on the right is not documentation: every row in it is produced from the live state by one function, so it cannot name a control the screen does not have."
      without="has seven screens that each work and no proof that they are one product — and the questions a chat UI must answer by default (where am I, what can I do, what next, how do I go back) are answered per screen instead of once."
    >
      <Section title="1 · Run it" sub="Start on Home. Tap a client row, or type one of the sentences below. Every transition is a system keyframe on a system token; this page decides the order and nothing else.">
        <div style={{ display: 'flex', gap: 28, flexWrap: 'wrap', alignItems: 'flex-start' }}>
          <StateBus.Provider value={setState}>
            <State label="live"><Proto key={runId} onEvent={onEvent} /></State>
          </StateBus.Provider>
          <div style={{ width: 300 }}><ControlPanel state={state} /></div>
          <div style={{ width: 420 }}><EventPanel events={events} onRestart={restart} /></div>
        </div>
      </Section>

      <Section title="2 · The router, and what it really is" sub="Patterns over the sentence, in this order — not a model. Every screen in this repository is downstream of which bucket it picks, so it is written out rather than described.">
        <Table head={['Type this', 'Bucket', 'Why', 'What opens']} rows={TRY.map(([t, opens]) => {
          const r = route(t);
          return [<span style={{ fontVariantNumeric: 'tabular-nums' }}>{t}</span>, r.id, r.why, opens];
        })} />
        <Note title="The order is a decision, not an accident">
          An ACT instruction is tested before the fund search, because <em>&ldquo;sell all of Sharma&rsquo;s Quant
          Small Cap&rdquo;</em> contains a fund name, and matching it as a search would turn an instruction into a
          browse — the most expensive misread in the set. <strong>Bucket 4 is last and is the default:</strong> when
          nothing matches, the product says it did not follow, offers three things it can do, and starts nothing.
          It never picks the closest journey and runs it.
        </Note>
      </Section>

      <Section title="3 · The four questions, answered once" sub="A chat UI has no menu bar to answer them with, so it answers them in the turn — and this page shows the answers being produced rather than claimed.">
        <Table head={['The question', 'Where the product answers it', 'How this page proves it']} rows={[
          ['Where am I?', 'The app bar names the thread; the rail pins its own progress', 'The Surface / Journey / Step rows, read from the live state'],
          ['What can I do?', 'Chips inside the turn that offered them — never pinned above the composer', '“What you can do next” is generated by affordances(), so a stale row is impossible'],
          ['What happens next?', 'The trace names the steps; the confirm sheet states what will be sent before it is', 'Approve → in flight → placed, all three visible in one run'],
          ['How do I go back?', 'The last prompt is editable everywhere it is valid; the rail reopens at an edited answer; Home is a back transition', '“How you go back” lists them, and ScreenStack direction="back" makes leaving look like leaving'],
        ]} />
      </Section>

      <Section title="4 · What it does not do, said plainly">
        <Note title="Where it stops">
          The router is <strong>regular expressions</strong>, so a sentence it has no pattern for lands in bucket 4 —
          which is the honest outcome, but it is not language understanding and this page does not imply it is.{' '}
          <strong>Nothing leaves the page:</strong> no order is placed, the CSV writes no file, the share sheet is
          described rather than opened, and the RTA that the in-flight state waits on does not exist. Journey A runs
          its sixteen steps; journeys B and C run to the end of what is built. Sharma&rsquo;s remaining thirteen
          holdings are still not in the book, so &ldquo;Show the 18 holdings&rdquo; opens the chart&rsquo;s own table
          and the screen says why inventing them would be worse than not having them.
        </Note>
        <Note title="What this page cost the system, and what it repaid">
          <code>ScreenStack</code> was hand-built on the Journey B prototype with a note that it would be promoted the
          moment a second live page needed it. This is that page, so it is now a system component with a contract and
          a spec page — including <code>direction=&quot;back&quot;</code>, which invents no keyframe: the two the system
          already has, reversed and swapped. Three renderers were lifted out of their pages for the same reason — the
          ledger table, the fund shortlist and the whole live rail — so this prototype and their spec pages draw ONE
          copy of each and cannot drift apart.
        </Note>
      </Section>
    </ScreenShell>
  );
}

mountScreen(<App />);
</script></body></html>
