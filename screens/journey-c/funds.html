<!-- @dsCard group="Screens" viewport="1400x3200" name="Journey C · the funds" subtitle="A parsed query the advisor can edit, the shortlist as a table, a fund's page in place — and the two things this product does not know yet, said out loud" -->
<!-- @gutter min="16" fullBleed="ScreenBackdrop, StatusSpacer, TopBar, Dock, HomeIndicator, scrim, sheet" truncation="allowed" -->
<!-- truncation="allowed" is for ONE thing: DataTable's sticky Fund column is 148pt and a fund name is longer. That is the component's documented behaviour — a sticky column keeps the table readable sideways — and the row expands in place to show the name in full. -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Journey C · the funds — Sentinel screens</title><link rel="stylesheet" href="../../design-system/styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../design-system/_ds_bundle.js"></script>
<script type="module">import * as s from 'https://cdn.jsdelivr.net/npm/d3-scale@4/+esm';import * as h from 'https://cdn.jsdelivr.net/npm/d3-shape@3/+esm';window.d3=Object.assign({},window.d3||{},s,h);window.dispatchEvent(new Event('d3ready'));</script>
<script>window.__screenRequires = ['AnswerChip','ArtifactCard','Badge','ChartLine','ChipRow','Composer','DarkButton','DataTable','Dock','ExplainerSheet','FileUpload','HomeIndicator','InfoCard','InfoDot','MessageActions','OverlapView','PhoneFrame','Pill','Provenance','RangePills','ScreenBackdrop','SentinelBlock','SentinelText','StatTile','StatusSpacer','StepTrace','TopBar','UserBubble'];</script>
<script type="text/babel" src="../screen-kit.jsx"></script>
<script type="text/babel" src="../journey-b/thread.jsx"></script>
<script type="text/babel" src="../data/book.jsx"></script>
<script type="text/babel" src="./funds.jsx"></script>
<style>body{margin:0;background:var(--color-desk);font-family:var(--font-ui)}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
/* thread.jsx gives the shell, AskTurn and the real paperclip; funds.jsx owns the data. */
const { Composer, SentinelBlock, SentinelText, ArtifactCard, DataTable, OverlapView, Pill, ChipRow, AnswerChip, ExplainerSheet, InfoDot } = window.SentinelDesignSystem_0682a2;

const Ask = ({ onAttach }) => <Composer value="" onChange={() => {}} placeholder="Ask Sentinel" onSend={() => {}} onAttach={onAttach} />;
/* A REAL controlled composer for the live scene. A frozen specimen can pass value="" with a no-op
   onChange; a screen that claims you can refine a search by typing cannot. */
const LiveAsk = ({ value, onChange, onSend, onAttach }) =>
  <Composer value={value} onChange={onChange} placeholder="Add, drop, or say “only…”" onSend={onSend} onAttach={onAttach} />;
/* The shortlist artifact and its empty state now live in ./funds.jsx, shared with the prototype. */

/* THE PARSED QUERY, EDITABLE. Sentinel says what it read the sentence as, and every part of it is a chip
   the advisor can drop — so a wrong parse costs one tap, not a retyped question. */
/* The answer to a TYPED refinement. It is not the first turn again: repeating "I read that as a fund
   search" after every sentence is the repeated data this product has been pulled up on twice. It says
   what CHANGED, shows the chips as they now are, and gives the new count. */
function RefineTurn({ said, query, shelf, onToggle, onShelf, results }) {
  return (
    <SentinelBlock continued>
      <SentinelText text={said} />
      <div style={{ marginTop: 'var(--space-12)' }}>
        <ChipRow>
          {query.filter((q) => q.on).map((q) => (
            <Pill key={q.label} label={q.label} size="sm" tone="filter" removable onClick={() => onToggle && onToggle(q.label)} />
          ))}
          <Pill label={shelf ? 'On your shelf ✓' : '+ On your shelf'} size="sm" tone={shelf ? 'primary' : 'outline'} onClick={onShelf} />
        </ChipRow>
      </div>
      <div style={{ marginTop: 'var(--space-10)' }}>
        <span style={{ font: 'var(--type-row-font)', color: results === 0 ? 'var(--color-status-over-fg)' : 'var(--color-ink-soft)', fontVariantNumeric: 'tabular-nums' }}>
          {results === 0 ? 'Nothing matches all of those now. Drop one and I will widen it.' : results === 1 ? '1 fund matches now.' : `${results} funds match now.`}
        </span>
      </div>
    </SentinelBlock>
  );
}

/* THE COUNT LIVES WITH THE CHIPS, not only on the button. Reviewed against how shopping and recipe
   apps handle a parsed query (Thrive Market, Yazio, Best Buy, Google Drive — Mobbin, 19 Sep 2026): in
   every one of them the number of results sits beside the filters and MOVES as a filter goes, and the
   commit button carries it too. Ours had it only on the CTA, so dropping a chip changed the shortlist
   silently and the advisor had to read the button to find out what they had done.
   `fundsFor` produces both this number and the table's rows, so they cannot disagree. */
function QueryTurn({ query, onToggle, shelf, onShelf, onOpen, results, continued = false }) {
  const n = results;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--stack)' }}>
      <SentinelBlock continued={continued}>
        <SentinelText text="I read that as a fund search. This is what I am filtering on — drop anything I got wrong, or just tell me." />
        <div style={{ marginTop: 'var(--space-12)' }}>
          <ChipRow>
            {query.filter((q) => q.on).map((q) => (
              <Pill key={q.label} label={q.label} size="sm" tone="filter" removable onClick={() => onToggle && onToggle(q.label)} />
            ))}
            <Pill label={shelf ? 'On your shelf ✓' : '+ On your shelf'} size="sm" tone={shelf ? 'primary' : 'outline'} onClick={onShelf} />
          </ChipRow>
        </div>
        <div style={{ marginTop: 'var(--space-10)' }}>
          <span style={{ font: 'var(--type-row-font)', color: n === 0 ? 'var(--color-status-over-fg)' : 'var(--color-ink-soft)', fontVariantNumeric: 'tabular-nums' }}>
            {n === 0 ? 'Nothing matches all of those.' : n === 1 ? '1 fund matches.' : `${n} funds match.`}
          </span>
        </div>
      </SentinelBlock>
      {onOpen && n > 0 && <AnswerChip label={`Show the ${n} funds`} variant="primary" onClick={onOpen} />}
    </div>
  );
}


function Scene({ children, anchor = 'bottom' }) {
  const att = useAttachment();
  return (
    <Thread anchor={anchor} revision={!!att.file} composer={<Ask onAttach={att.onAttach} />}>
      <AskTurn text={FUND_ASK} costNote="Sending this replaces the search below it." />
      {children}
      <AttachedTurn file={att.file} caption="Here is the factsheet." onRemove={att.clear} />
    </Thread>
  );
}

/* Live: drop a filter and the table changes under it; open a fund and its page expands in the row. */
function LiveScene() {
  const [query, setQuery] = React.useState(FUND_QUERY);
  const [shelf, setShelf] = React.useState(true);
  const [opened, setOpened] = React.useState(false);
  const [sheet, setSheet] = React.useState(null);
  const [draft, setDraft] = React.useState('');
  /* Every typed refinement, in order, so the thread reads as a conversation rather than as a filter
     panel that quietly rewrote itself. Each one is a turn: what was said, and what Sentinel did. */
  const [turns, setTurns] = React.useState([]);
  const att = useAttachment();
  const funds = fundsFor(query, shelf);

  const say = (text) => {
    if (!text.trim()) return;
    const r = refine(text, query);
    setDraft('');
    if (r.kind === 'shelf') setShelf(r.on);
    else setQuery((q) => applyRefine(r, q));
    setTurns((t) => [...t, { text, r }]);
  };

  return (
    <div style={{ position: 'relative', height: '100%', width: '100%' }}>
      <Thread anchor="newest" revision={`${query.map((q) => q.label + q.on).join()}-${shelf}-${opened}-${turns.length}-${!!att.file}`}
        composer={<LiveAsk value={draft} onChange={setDraft} onSend={() => say(draft)} onAttach={att.onAttach} />}>
        <AskTurn text={FUND_ASK} costNote="Sending this replaces the search below it." />
        <QueryTurn query={query} shelf={shelf} onShelf={() => setShelf((v) => !v)}
          onToggle={(label) => setQuery((q) => q.map((x) => (x.label === label ? { ...x, on: false } : x)))}
          onOpen={opened ? undefined : () => setOpened(true)} results={funds.length} />
        {opened && <FundResults funds={funds} />}
        {/* A typed refinement is the advisor's own turn, on their side, then Sentinel's answer —
            never a silent rewrite of the chips above. */}
        {turns.map((t, i) => (
          <React.Fragment key={i}>
            <AskTurn text={t.text} editable={false} actions={false} />
            {t.r.kind === 'miss'
              ? <SentinelBlock>
                  <SentinelText text={REFINE_MISS.body} />
                  <div style={{ marginTop: 'var(--space-12)' }}>
                    <ChipRow>{REFINE_MISS.chips.map((c) => <AnswerChip key={c} label={c} onClick={() => say(c)} />)}</ChipRow>
                  </div>
                </SentinelBlock>
              : <RefineTurn said={refineSaid(t.r)} query={query} shelf={shelf}
                  onShelf={() => setShelf((v) => !v)}
                  onToggle={(label) => setQuery((q) => q.map((x) => (x.label === label ? { ...x, on: false } : x)))}
                  results={funds.length} />}
          </React.Fragment>
        ))}
        <AttachedTurn file={att.file} caption="Here is the factsheet." onRemove={att.clear} />
      </Thread>
      <ExplainerSheet open={!!sheet} title={(sheet || {}).title || ''} body={(sheet || {}).body || []} onClose={() => setSheet(null)} />
    </div>
  );
}

const MOTION = [
  ['The query turn arrives', <span><code>ds-rise</code>: fade + 8px</span>, '240ms', 'Fades in place'],
  ['A filter chip is dropped', 'the chip leaves, the table re-renders under it', 'immediate', 'Unchanged — there is no animation to drop'],
  ['The results artifact', <span><code>ds-artifact</code>: fade + scale 0.96 → 1</span>, '300ms', 'Fade only'],
  ['A row expands', 'the fund page opens in place; the rows below it move down', '240ms', 'Height changes with no transition'],
  ['The table nudges once', <span><code>ds-table-nudge</code> — only when a column is off-screen</span>, '640ms', 'The fade carries the same fact'],
];

const PROVENANCE = [
  ['The seven funds, their houses and categories', 'The scheme record', 'The table, and the fund page when a row is opened'],
  ['On shelf / off shelf', "Your firm's compliance shelf", 'A Badge with the word in it — colour never signals alone'],
  ['“Meera Nair · Sunita Nair”', "Your own book — which of your clients already hold this fund", 'The Held by column, and the count on the fund page'],
  ['Return, TER, fund size', <span><code>book.jsx</code>&rsquo;s <code>PERF</code> fixture, which says in its own header that the returns are <strong>invented</strong> and the TER and AUM bands are plausible rather than sourced</span>, 'The figure at display size, the period named in words, and a provenance line that says “illustrative figures for design, not a scheme record”'],
  ['The overlap between two funds', <span><strong>Nothing.</strong> No holdings feed, so the cell is an em dash and the footnote says why — never a 0, because a zero and a missing value are different facts</span>, 'The overlap view'],
];

mountScreen(
  <ScreenShell
    journey="Journey C · the funds" n="Thread · funds" name="Choosing a fund, and what we cannot yet say about one"
    job="The third router bucket. A sentence becomes a parsed query the advisor can edit, the shortlist arrives as an artifact in the thread, and a fund's own page opens inside its row. Two of the things an advisor wants here have no source yet, and the screens say so instead of drawing them."
    without="cannot choose a fund inside Sentinel, or tell a client why two funds they were shown are the same fund."
  >
    <Section title="1 · The sentence, read back as something you can edit" sub="A parsed query is only defensible if it is visible and editable. Every part of it is a chip; dropping one costs a tap instead of a retyped question.">
      <StateRow>
        <State label="live · drop a filter, open a fund" note="Drop “Flexi cap” and the table widens under you; turn off “On your shelf” and the off-shelf fund appears with its badge. Tap a row and the fund's page opens IN PLACE — DataTable's own rule, never a modal. The paperclip is real here too: attach a factsheet and it lands at the end of the thread on your side.">
          <LiveScene />
        </State>
        <State label="the query, before the results" note="Three chips and a toggle. “On your shelf” is the advisor's own constraint rather than something Sentinel inferred, which is why it reads as a plus rather than an ✕ until it is on.">
          <Scene><QueryTurn query={FUND_QUERY} shelf results={2} onOpen={() => {}} /></Scene>
        </State>
      </StateRow>
    </Section>

    <Section title="2 · The shortlist, and a fund's own page" sub="The results are an artifact in the thread — there is no explorer screen, because there is no canvas. A row opens where it sits.">
      <StateRow>
        <State label="the table" note="Fund, category, shelf and — the most useful column this product actually has — who of your clients already holds it. The Fund column is sticky so the table stays readable when it scrolls sideways; that is also why a long name truncates there, and why opening the row shows it in full.">
          <Scene><FundResults funds={FUND_LIST.filter((f) => f.bucket === 'Equity')} /></Scene>
        </State>
        <State label="a fund, opened in its row" note="Name, house, category, the compliance shelf as a badge with its word, and now the figure: 21.4% at display size with THREE-YEAR CAGR spelled out beside it, because “27.6%” read to a client as last year&rsquo;s return is a lie a layout told. The ranges are 1Y · 3Y · 5Y and no more — RangePills&rsquo; default offers 1M · 3M · ALL, and a period nobody has a figure for is the one thing this card was locked to avoid. The provenance says what the numbers are: illustrative, for design, not a scheme record.">
          <Scene><FundResults funds={FUND_LIST.filter((f) => f.cat === 'Flexi cap')} openRow={0} /></Scene>
        </State>
        <State label="nothing matches" tone="under" note="Every table in this product is empty on someone's first day or one filter away, so DataTable REQUIRES an emptyState. It names what to do — drop a filter — rather than saying “No data”.">
          <Scene><FundResults funds={[]} /></Scene>
        </State>
      </StateRow>
    </Section>

    <Section title="3 · “Are these two the same fund?” — the question this journey exists for, and the one it cannot answer yet">
      <StateRow>
        <State label="the overlap, unavailable" tone="over" note="Two flexi caps, the basis stated as a removable chip, and the cell is an EM DASH. OverlapView's contract is blunt about why: “never pass 0 for a pair you could not compute — a zero and a missing value are different facts, and printing 0% states something untrue about the client's money.” The footnote names what is missing: a holdings feed for either fund.">
          <Scene><OverlapView funds={OVERLAP_FUNDS} properties={OVERLAP_PROPERTIES} cells={OVERLAP_CELLS} footnote={OVERLAP_FOOTNOTE} onToggleProperty={() => {}} onAddFund={() => {}} /></Scene>
        </State>
      </StateRow>
      <Note title="What this journey needs, in one list, so it can be supplied rather than guessed">
        Everything above is real: the funds, their houses, their categories, the compliance shelf, and which of
        the advisor's clients hold each one. <strong>Three things have no source and none of them is drawn:</strong>
        fund performance (so `InfoCard` renders locked and `RangePills` never offers a range over a number nobody
        owns), TER and AUM, and a holdings feed (so the overlap is an em dash). These are not design gaps —
        the components for all three exist and are correct. They are <strong>data decisions for the owner</strong>,
        and the screens are built so that supplying them fills the cards in rather than redesigning them.
      </Note>
      <Note title="The plan said a bottom sheet; the system had already ruled otherwise">
        <code>SCREENS-PLAN.md</code> listed the fund one-pager as "a bottom sheet". <code>DataTable</code>'s own
        contract says a row "becomes expandable IN PLACE — never a modal. The chevron lives in the sticky column and
        the detail pushes the rows below it down, so the row you opened does not move under your thumb." The system
        wins, and the fund page opens in its row. Same reasoning as the canvas removal, one level down.
      </Note>
    </Section>

    <Section title="4 · The fund as an artifact — the headline the references got right" sub="Across ~320 industry screens the best single idea was Groww's “If ₹10k Invested”. It is not a CAGR; it is what ₹10,000 BECAME — the sentence an advisor says out loud to a client. A percentage has to be translated first.">
      <StateRow>
        <State label="peek" note="96pt, the card ArtifactCard already has. Their version of this chart is a 300pt full-bleed header; in a thread the card has to leave room for the sentence that asked for it. Two lines, and the benchmark is named in TEXT beside its figure — never carried by a line colour alone.">
          <Scene anchor="bottom"><FundCard id="ppfas-flexi" state="peek" onToggle={() => {}} /></Scene>
        </State>
        <State label="expanded, in place" note="₹28,268 against the Nifty 500's ₹21,738 — the gap said in words. The period is spelled out, because “23.1%” read to a client as last year's return is a lie a layout told. Then the four facts, and the caveat above them.">
          <Scene anchor="bottom"><FundCard id="ppfas-flexi" state="expanded" onToggle={() => {}} onMenu={() => {}} /></Scene>
        </State>
        <State label="an index fund, trailing its index" tone="under" note="UTI Nifty 50 ends BEHIND the index — by roughly its 0.17% expense ratio. That is the one relationship a reader would notice if the fixture got it wrong, and it is why every series is generated against its stated CAGR rather than drawn by hand.">
          <Scene anchor="bottom"><FundCard id="uti-nifty" state="expanded" onToggle={() => {}} /></Scene>
        </State>
      </StateRow>
      <StateRow>
        <State label="the four chips are their four tabs" note="Overview · Holdings · Performance · Peer Analysis are four PAGES behind one header in every reference. Here each is a question, each answer is its own turn, and scrolling back through the thread IS going back through the tabs. Nothing is pinned — the chips sit in the turn that offered them.">
          <Scene anchor="bottom">
            <FundCard id="quant-small" state="peek" onToggle={() => {}} />
            <ChipRow>{FUND_CHIPS.map((c) => <AnswerChip key={c} label={c} onClick={() => {}} />)}</ChipRow>
          </Scene>
        </State>
        <State label="a debt fund, where the line is nearly flat" note="The chart says “debt” by being almost straight. Volatility in the fixture is by CATEGORY — small cap swings hardest, debt almost not at all — because a debt fund drawn with equity's shape would be the chart lying about the asset class.">
          <Scene anchor="bottom"><FundCard id="icici-corp" state="expanded" onToggle={() => {}} /></Scene>
        </State>
      </StateRow>
    </Section>

    <Section title="5 · Motion, and what each one does under reduced motion">
      <MotionTable rows={MOTION} />
    </Section>

    <Section title="6 · Provenance">
      <ProvenanceTable rows={PROVENANCE} />
    </Section>
  </ScreenShell>
);
</script></body></html>
