<script type="text/babel" data-presets="react">
/* thread.jsx gives the shell, AskTurn and the real paperclip; funds.jsx owns the data. */
const { Composer, SentinelBlock, SentinelText, SentinelTurn, ArtifactCard, DataTable, OverlapView, Pill, ChipRow, AnswerChip, ExplainerSheet, InfoDot } = window.SentinelDesignSystem_0682a2;

/* A REAL controlled composer for the live scene. A frozen specimen can pass value="" with a no-op
   onChange; a screen that claims you can refine a search by typing cannot. */
const LiveAsk = ({ value, onChange, onSend, onAttach }) =>
  <Composer value={value} onChange={onChange} placeholder="Add, drop, or say “only…”" onSend={onSend} onAttach={onAttach} />;
/* The shortlist artifact and its empty state now live in ./funds.jsx, shared with the prototype. */

/* THE PARSED QUERY, EDITABLE. Sentinel says what it read the sentence as, and every part of it is a chip
   the advisor can drop — so a wrong parse costs one tap, not a retyped question. */
/* The answer to a TYPED refinement. It is not the first turn again: repeating "I read that as a fund
   search" after every sentence is the repeated data this product has been pulled up on twice. It says
   what CHANGED, shows the chips as they now are, and gives the new count. */
function RefineTurn({ said, query, shelf, onToggle, onShelf, results }) {
  return (
    <SentinelBlock continued>
      <SentinelText text={said} />
      <div style={{ marginTop: 'var(--space-12)' }}>
        <ChipRow>
          {query.filter((q) => q.on).map((q) => (
            <Pill key={q.label} label={q.label} size="sm" tone="filter" removable onClick={() => onToggle && onToggle(q.label)} />
          ))}
          <Pill label={shelf ? 'On your shelf ✓' : '+ On your shelf'} size="sm" tone={shelf ? 'primary' : 'outline'} onClick={onShelf} />
        </ChipRow>
      </div>
      <div style={{ marginTop: 'var(--space-10)' }}>
        <span style={{ font: 'var(--type-row-font)', color: results === 0 ? 'var(--color-status-over-fg)' : 'var(--color-ink-soft)', fontVariantNumeric: 'tabular-nums' }}>
          {results === 0 ? 'Nothing matches all of those now. Drop one and I will widen it.' : results === 1 ? '1 fund matches now.' : `${results} funds match now.`}
        </span>
      </div>
    </SentinelBlock>
  );
}

/* THE COUNT LIVES WITH THE CHIPS, not only on the button. Reviewed against how shopping and recipe
   apps handle a parsed query (Thrive Market, Yazio, Best Buy, Google Drive — Mobbin, 19 Sep 2026): in
   every one of them the number of results sits beside the filters and MOVES as a filter goes, and the
   commit button carries it too. Ours had it only on the CTA, so dropping a chip changed the shortlist
   silently and the advisor had to read the button to find out what they had done.
   `fundsFor` produces both this number and the table's rows, so they cannot disagree. */
function QueryTurn({ query, onToggle, shelf, onShelf, onOpen, results, continued = false }) {
  const n = results;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--stack)' }}>
      <SentinelBlock continued={continued}>
        <SentinelText text="I read that as a fund search. This is what I am filtering on — drop anything I got wrong, or just tell me." />
        <div style={{ marginTop: 'var(--space-12)' }}>
          <ChipRow>
            {query.filter((q) => q.on).map((q) => (
              <Pill key={q.label} label={q.label} size="sm" tone="filter" removable onClick={() => onToggle && onToggle(q.label)} />
            ))}
            <Pill label={shelf ? 'On your shelf ✓' : '+ On your shelf'} size="sm" tone={shelf ? 'primary' : 'outline'} onClick={onShelf} />
          </ChipRow>
        </div>
        <div style={{ marginTop: 'var(--space-10)' }}>
          <span style={{ font: 'var(--type-row-font)', color: n === 0 ? 'var(--color-status-over-fg)' : 'var(--color-ink-soft)', fontVariantNumeric: 'tabular-nums' }}>
            {n === 0 ? 'Nothing matches all of those.' : n === 1 ? '1 fund matches.' : `${n} funds match.`}
          </span>
        </div>
      </SentinelBlock>
      {onOpen && n > 0 && <AnswerChip label={`Show the ${n} funds`} variant="primary" onClick={onOpen} />}
    </div>
  );
}


function Scene({ children, anchor = 'bottom', ask = FUND_ASK }) {
  const att = useAttachment();
  return (
    <Thread anchor={anchor} revision={!!att.file} composer={<FrozenAsk onAttach={att.onAttach} />}>
      <AskTurn text={ask} costNote="Sending this replaces the search below it." />
      {children}
      <AttachedTurn file={att.file} caption="Here is the factsheet." onRemove={att.clear} />
    </Thread>
  );
}

/* A TYPED COMMAND, FROZEN — and it calls the same refine() the live scene calls, so a specimen here
   can never show an answer the parser does not actually produce. The frozen page is a claim about the
   product; a hand-written sentence under a command would be a claim nothing checks. */
const CMD_VIEWS = ['sort', 'period', 'compare', 'miss', 'ambiguous'];
const SORT_QUERY = [{ label: 'Equity', on: true }, { label: 'Direct plan', on: true }];
function CmdScene({ text, query = FUND_QUERY, period = 'r5', ask = FUND_ASK }) {
  const r = refine(text, query);
  const q2 = CMD_VIEWS.indexOf(r.kind) >= 0 ? query : applyRefine(r, query);
  const shown = r.kind === 'period' ? r.period : period;
  const list = sortFunds(fundsFor(q2, true), r.kind === 'sort' ? r.sort : null, shown);
  return (
    <Scene anchor={3} ask={ask}>
      <FundResults funds={list} period={shown} />
      <AskTurn text={text} editable={false} actions={false} />
      {r.kind === 'miss'
        ? <SentinelTurn say={REFINE_MISS.body} chips={<ChipRow>{REFINE_MISS.chips.map((c) => <AnswerChip key={c} label={c} />)}</ChipRow>} />
        : r.kind === 'ambiguous'
        ? <SentinelTurn say={refineAmbiguous(r).body} chips={<ChipRow>{refineAmbiguous(r).chips.map((c) => <AnswerChip key={c} label={c} />)}</ChipRow>} />
        : r.kind === 'sort' || r.kind === 'period'
        ? <SentinelTurn say={refineSaid(r, shown, list)} />
        : r.kind === 'compare'
        ? <FundCompare ids={r.ids} />
        : <RefineTurn said={refineSaid(r, shown)} query={q2} shelf results={list.length} />}
    </Scene>
  );
}

/* Live: drop a filter and the table changes under it; open a fund and its page expands in the row. */
function LiveScene() {
  const [query, setQuery] = React.useState(FUND_QUERY);
  const [shelf, setShelf] = React.useState(true);
  const [opened, setOpened] = React.useState(false);
  const [sheet, setSheet] = React.useState(null);
  const [draft, setDraft] = React.useState('');
  /* SORT AND PERIOD ARE VIEWS, NOT FILTERS — they never change which funds match, only how the list is
     ordered and which return every figure is read at. Held apart from `query` for exactly that reason:
     a sort that showed up as a filter chip would make the count look negotiable. */
  const [sort, setSort] = React.useState(null);
  const [period, setPeriod] = React.useState('r5');
  const [compare, setCompare] = React.useState(null);
  /* Every typed refinement, in order, so the thread reads as a conversation rather than as a filter
     panel that quietly rewrote itself. Each one is a turn: what was said, and what Sentinel did. */
  const [turns, setTurns] = React.useState([]);
  const att = useAttachment();
  const funds = sortFunds(fundsFor(query, shelf), sort, period);

  const say = (text) => {
    if (!text.trim()) return;
    const r = refine(text, query);
    setDraft('');
    if (r.kind === 'shelf') setShelf(r.on);
    else if (r.kind === 'sort') setSort(r.sort);
    else if (r.kind === 'period') setPeriod(r.period);
    else if (r.kind === 'compare') { setCompare(r.ids); setOpened(true); }
    else if (r.kind !== 'miss' && r.kind !== 'ambiguous') setQuery((q) => applyRefine(r, q));
    setTurns((t) => [...t, { text, r }]);
  };

  return (
    <div style={{ position: 'relative', height: '100%', width: '100%' }}>
      <Thread anchor="newest" revision={`${query.map((q) => q.label + q.on).join()}-${shelf}-${opened}-${turns.length}-${sort ? sort.key : ''}-${period}-${!!att.file}`}
        composer={<LiveAsk value={draft} onChange={setDraft} onSend={() => say(draft)} onAttach={att.onAttach} />}>
        <AskTurn text={FUND_ASK} costNote="Sending this replaces the search below it." />
        <QueryTurn query={query} shelf={shelf} onShelf={() => setShelf((v) => !v)}
          onToggle={(label) => setQuery((q) => q.map((x) => (x.label === label ? { ...x, on: false } : x)))}
          onOpen={opened ? undefined : () => setOpened(true)} results={funds.length} />
        {opened && <FundResults funds={funds} period={period} />}
        {/* A typed refinement is the advisor's own turn, on their side, then Sentinel's answer —
            never a silent rewrite of the chips above. */}
        {turns.map((t, i) => (
          <React.Fragment key={i}>
            <AskTurn text={t.text} editable={false} actions={false} />
            {t.r.kind === 'miss'
              ? <SentinelTurn say={REFINE_MISS.body}
                  chips={<ChipRow>{REFINE_MISS.chips.map((c) => <AnswerChip key={c} label={c} onClick={() => say(c)} />)}</ChipRow>} />
              /* TWO FUNDS WITH THE SAME WORD IN THEM IS NOT A CHOICE SENTINEL GETS TO MAKE. It names
                 them and asks — the same answer the WHO step gives for two clients called Nair. */
              : t.r.kind === 'ambiguous'
              ? <SentinelTurn say={refineAmbiguous(t.r).body}
                  chips={<ChipRow>{refineAmbiguous(t.r).chips.map((c) => <AnswerChip key={c} label={c} onClick={() => say(`add ${c}`)} />)}</ChipRow>} />
              /* A sort or a period changes the VIEW, so the turn says what changed and does not redraw
                 the filter chips — they did not move, and redrawing them would imply they had. */
              : t.r.kind === 'sort' || t.r.kind === 'period'
              ? <SentinelTurn say={refineSaid(t.r, period, funds)} />
              : t.r.kind === 'compare'
              ? <FundCompare ids={t.r.ids} />
              : <RefineTurn said={refineSaid(t.r, period)} query={query} shelf={shelf}
                  onShelf={() => setShelf((v) => !v)}
                  onToggle={(label) => setQuery((q) => q.map((x) => (x.label === label ? { ...x, on: false } : x)))}
                  results={funds.length} />}
          </React.Fragment>
        ))}
        <AttachedTurn file={att.file} caption="Here is the factsheet." onRemove={att.clear} />
      </Thread>
      <ExplainerSheet open={!!sheet} title={(sheet || {}).title || ''} body={(sheet || {}).body || []} onClose={() => setSheet(null)} />
    </div>
  );
}

const MOTION = [
  ['The query turn arrives', <span><code>ds-rise</code>: fade + 8px</span>, '240ms', 'Fades in place'],
  ['A filter chip is dropped', 'the chip leaves, the table re-renders under it', 'immediate', 'Unchanged — there is no animation to drop'],
  ['The results artifact', <span><code>ds-artifact</code>: fade + scale 0.96 → 1</span>, '300ms', 'Fade only'],
  ['A row expands', 'the fund page opens in place; the rows below it move down', '240ms', 'Height changes with no transition'],

];

const PROVENANCE = [
  ['The seven funds, their houses and categories', 'The scheme record', 'The table, and the fund page when a row is opened'],
  ['On shelf / off shelf', "Your firm's compliance shelf", 'A Badge with the word in it — colour never signals alone'],
  ['“Meera Nair · Sunita Nair”', "Your own book — which of your clients already hold this fund", 'The Held by column, and the count on the fund page'],
  ['Return, TER, fund size', <span><code>book.jsx</code>&rsquo;s <code>PERF</code> fixture, which says in its own header that the returns are <strong>invented</strong> and the TER and AUM bands are plausible rather than sourced</span>, 'The figure at display size, the period named in words, and a provenance line that says “illustrative figures for design, not a scheme record”'],

];

mountScreen(
  <ScreenShell
    journey="Journey C · the funds" n="Thread · funds" name="Choosing a fund, and what we cannot yet say about one"
    job="The third router bucket. A sentence becomes a parsed query the advisor can edit, the shortlist arrives as an artifact in the thread, and a fund's own page opens inside its row. Two of the things an advisor wants here have no source yet, and the screens say so instead of drawing them."
    without="cannot choose a fund inside Sentinel, or tell a client why two funds they were shown are the same fund."
  >
    <Section title="1 · The sentence, read back as something you can edit" sub="A parsed query is only defensible if it is visible and editable. Every part of it is a chip; dropping one costs a tap instead of a retyped question.">
      <StateRow>
        <State label="live · drop a filter, open a fund" note="Drop “Flexi cap” and the table widens under you; turn off “On your shelf” and the off-shelf fund appears with its badge. Tap a row and the fund's page opens IN PLACE — DataTable's own rule, never a modal. The paperclip is real here too: attach a factsheet and it lands at the end of the thread on your side.">
          <LiveScene />
        </State>
        <State label="the query, before the results" note="Three chips and a toggle. “On your shelf” is the advisor's own constraint rather than something Sentinel inferred, which is why it reads as a plus rather than an ✕ until it is on.">
          <Scene><QueryTurn query={FUND_QUERY} shelf results={2} onOpen={() => {}} /></Scene>
        </State>
      </StateRow>
    </Section>

    <Section title="2 · The shortlist, and a fund's own page" sub="The results are an artifact in the thread — there is no explorer screen, because there is no canvas. A row opens where it sits.">
      <StateRow>
        <State label="the table" note="Fund, category, shelf and — the most useful column this product actually has — who of your clients already holds it. The Fund column is sticky so the table stays readable when it scrolls sideways; that is also why a long name truncates there, and why opening the row shows it in full.">
          <Scene><FundResults funds={FUND_LIST.filter((f) => f.bucket === 'Equity')} /></Scene>
        </State>
        <State label="a fund, opened in its row" note="Name, house, category, the compliance shelf as a badge with its word, and now the figure: 21.4% at display size with THREE-YEAR CAGR spelled out beside it, because “27.6%” read to a client as last year&rsquo;s return is a lie a layout told. The ranges are 1Y · 3Y · 5Y and no more — RangePills&rsquo; default offers 1M · 3M · ALL, and a period nobody has a figure for is the one thing this card was locked to avoid. The provenance says what the numbers are: illustrative, for design, not a scheme record.">
          <Scene><FundResults funds={FUND_LIST.filter((f) => f.cat === 'Flexi cap')} openRow={0} /></Scene>
        </State>
        <State label="nothing matches" tone="under" note="Every table in this product is empty on someone's first day or one filter away, so DataTable REQUIRES an emptyState. It names what to do — drop a filter — rather than saying “No data”.">
          <Scene><FundResults funds={[]} /></Scene>
        </State>
      </StateRow>
    </Section>

    <Section title="3 · “Are these two the same fund?” — the question this journey exists for, and the one it cannot answer yet">
      <StateRow>
        <State label="the overlap, unavailable" tone="over" note="Two flexi caps, the basis stated as a removable chip, and the cell is an EM DASH. OverlapView's contract is blunt about why: “never pass 0 for a pair you could not compute — a zero and a missing value are different facts, and printing 0% states something untrue about the client's money.” The footnote names what is missing: a holdings feed for either fund.">
          <Scene><OverlapView funds={OVERLAP_FUNDS} properties={OVERLAP_PROPERTIES} cells={OVERLAP_CELLS} footnote={OVERLAP_FOOTNOTE} onToggleProperty={() => {}} onAddFund={() => {}} /></Scene>
        </State>
      </StateRow>
      <Note title="What this journey needs, in one list, so it can be supplied rather than guessed">
        Everything above is real: the funds, their houses, their categories, the compliance shelf, and which of
        the advisor's clients hold each one. <strong>Three things have no source and none of them is drawn:</strong>
        fund performance (so `InfoCard` renders locked and `RangePills` never offers a range over a number nobody
        owns), TER and AUM, and a holdings feed (so the overlap is an em dash). These are not design gaps —
        the components for all three exist and are correct. They are <strong>data decisions for the owner</strong>,

      </Note>
      <Note title="The plan said a bottom sheet; the system had already ruled otherwise">

        </State>
      </StateRow>
      <StateRow>
        <State label="add to a proposal — the hand-off" note="A proposal, a rebalance and a review are all about SOMEBODY, and the fund explorer is the one surface in the product that does not already know who. So every hand-off goes through the same question, and it is the WHO step that answers it — the verbs do not each invent a client picker. The sentence is built from the verb rather than written three times.">
          <Scene anchor="bottom">
            <FundHandoff verb="propose" fundId="ppfas-flexi" />
            <WhoPicker journey="propose" />
          </Scene>
        </State>
        <State label="attach to a rebalance" note="Same shape, different consequence, and the sentence says which: a rebalance moves real money in somebody's folios. Journey E then sizes the switch against their mandate — and says plainly when it cannot cost it, which is the state that journey was built around.">
          <Scene anchor="bottom">
            <FundHandoff verb="rebal" fundId="quant-small" />
            <WhoPicker journey="rebal" />
          </Scene>
        </State>
      </StateRow>
    </Section>

    <Section title="6 · Holdings — one question per turn" sub="The references stack five devices on one Holdings tab: a toggle, a size bar, a sector list with month pills, a top-ten list, a concentration table. In a 375-wide thread that is five answers, so it is five turns, and the advisor asks for each one. Every chip is also a sentence — typing “by sector” opens the same turn the chip does.">
      <StateRow>
        <State label="H1 · the shape" note="The cap split is a ChartBar, not an AllocationCard — and the system decided that, not the plan. AllocationCard's three hues are asset classes; large, mid and small are all equity, and three hues for three sizes of the same thing is colour encoding identity (rule 1). One colour, rank by length, every value labelled. The sentence names where the weight sits and the one sector that dominates.">
          <Scene anchor={3}><FundInfo id="ppfas-flexi" /><HoldingsShape id="ppfas-flexi" /></Scene>
        </State>
        <State label="H2 · by sector, over three months" note="RangePills count matches the data — three months, three pills (F-46). Six bars, one hue. The sentence is the move that matters: the biggest sector's three-month change in points, and whichever sector moved most.">
          <Scene anchor={3}><FundInfo id="ppfas-flexi" /><HoldingsSectors id="ppfas-flexi" /></Scene>
        </State>
      </StateRow>
      <StateRow>
        <State label="H3 · the top ten, and what moved" note="DataTable with the sticky name column; `bar` draws the weight behind the figure in one hue. The tail is ONE row — “93 more, none above 1%” — the rule the review applies to Meera's twenty-nine tiny funds. A 103-row list is a list that hides the finding.">
          <Scene anchor={3}><FundInfo id="ppfas-flexi" /><HoldingsTop id="ppfas-flexi" /></Scene>
        </State>
        <State label="H4 · how concentrated" note="Four FigureRows, each with its quiet half. No ceiling of the product's applies INSIDE a fund — the 25% caps are written against a client's book — so the turn states the numbers and claims nothing about them.">
          <Scene anchor={3}><FundInfo id="ppfas-flexi" /><HoldingsConcentration id="ppfas-flexi" /></Scene>
        </State>
      </StateRow>
      <StateRow>
        <State label="H5 · overlap — the em dashes become numbers" note="OverlapView was built for this question in v9 and has rendered “—” ever since, because nothing here knew what any fund held. The number is computed from the names two top tens actually share, and the sentence names them. Two flexi caps under different houses: about half.">
          <Scene anchor={3}><FundInfo id="ppfas-flexi" /><HoldingsOverlap id="ppfas-flexi" otherId="hdfc-flexi" /></Scene>
        </State>
        <State label="H5 · asked without a second fund" note="Overlap needs two. Without the second it asks — with the same List.search picker Compare uses, so an advisor meets one way of picking a fund, not two.">
          <Scene anchor={3}><FundInfo id="ppfas-flexi" /><HoldingsOverlap id="ppfas-flexi" /></Scene>
        </State>
        <State label="a debt fund, no equity to split" tone="under" note="The shape turn does not draw a cap bar it has no data for. It says what the fund is — debt instruments, all of it debt and cash — and the sector chip still works, because a bond fund has issuers by sector.">
          <Scene anchor={3}><FundInfo id="icici-corp" /><HoldingsShape id="icici-corp" /></Scene>
        </State>
      </StateRow>
    </Section>

    <Section title="7 · The commands — what an advisor can type at a shortlist, and what each one is allowed to change" sub="Chips cover the common moves; a command covers the one an advisor has in mind. The line that decides the design: a FILTER changes which funds match and arrives as a removable chip, a VIEW changes only the order or the period every figure is read at and never touches the chips. A view that showed up as a filter chip would make the count look negotiable.">
      <StateRow>
        <State label="“under 0.7% TER” — a filter" note="A number out of a sentence becomes a chip the advisor can drop, exactly like the parsed words above it. One TER pill at a time: “under 0.7” then “under 0.5” is a correction, not two filters. The count moves, and the turn states it.">
          <CmdScene text="under 0.7% TER" />
        </State>
        <State label="“sort by cost” — a view" note="The same four funds in a different order — Motilal Oswal moves from fourth to second on 0.66 against HDFC Flexi Cap's 0.74. No chip appears and the count does not move, because nothing was filtered. Three keys are understood — cost, size, return — and the turn names the one it used in words, never an arrow on a column. A shortlist of two, where cheapest-first happens to be the order already, would have been a specimen that proves nothing.">
          <CmdScene text="sort by cost" ask="Show me equity funds on my shelf" query={SORT_QUERY} />
        </State>
      </StateRow>
      <StateRow>
        <State label="“show 3Y” — a view" note="Every return in the table and in each row's fund page is read at three years from here. The period is not a filter either: the same funds, read differently.">
          <CmdScene text="show 3Y" />
        </State>
        <State label="“add Motilal Oswal” — a fund by name" note="A named fund joins the list whatever the filters say, and its chip says so with a +. The advisor asked for THAT fund; silently dropping it because it fails a filter they set two turns ago would be the shortlist rewriting itself.">
          <CmdScene text="add Motilal Oswal" />
        </State>
      </StateRow>
      <StateRow>
        <State label="“add HDFC” — three funds carry that word" tone="under" note="It names all three and asks. This is namedClient's ruling applied to funds: an ambiguous name binds nobody. Guessing the house an advisor meant is the one mistake that is invisible until a client reads the proposal.">
          <CmdScene text="add HDFC" />
        </State>
        <State label="“make it purple” — a miss" tone="under" note="The refusal names the three things a command can do to a shortlist and leaves it exactly where it was. Every refusal in this product keeps that shape: what it cannot do, then what it can.">
          <CmdScene text="make it purple" />
        </State>
      </StateRow>
    </Section>

    <Section title="8 · The other three asks — against its category · what changed · who holds it" sub="Four questions sit under every fund card. “What is it holding?” became five turns this morning; these are the other three, and they finish §2 of the plan. Each is one question, one turn, one finding in the sentence and the evidence under it.">
      <StateRow>
        <State label="Against its category · 5Y" note="Three marks, one scale. The plan asked for three Dumbbells; the component gave two, and the component was right — a Dumbbell is a PAIR, a hollow dot for what a thing is measured against and a filled one for what it is. Two rows share one domain, the fund's dot is in both, and the two gaps are comparable because the track is the same. The domain is niceDomain over the three values, not zero: at 5Y the fund is 23.1 and the index 16.8, which on a 0–100 track is four pixels.">
          <Scene anchor={3}><FundInfo id="ppfas-flexi" /><CategoryTurn id="ppfas-flexi" /></Scene>
        </State>
        <State label="Against its category · a fund that changed hands" tone="under" note="HDFC Flexi Cap's three-year number is 22.8% and S. Iyer has run it for 2.2 years. The turn says so. A record is one person's work only if one person did it, and MANAGERS knows when they started — arithmetic cannot produce that sentence, so it is the one line here that is not arithmetic.">
          <Scene anchor={3}><FundInfo id="hdfc-flexi" /><CategoryTurn id="hdfc-flexi" defaultPeriod="r3" /></Scene>
        </State>
      </StateRow>
      <StateRow>
        <State label="What changed recently" note="The references render this as green and red pills — the weakest execution of the strongest idea in the set. Rule 2: bad news is text, never a fill, and a pill that encodes its verdict in colour has to be read twice. Sentences say it once; the three FigureRows under them carry each month's return with the benchmark's in the quiet half, so nothing in the words is taken on trust.">
          <Scene anchor={3}><FundInfo id="ppfas-flexi" /><ChangedTurn id="ppfas-flexi" /></Scene>
        </State>
        <State label="Who of my clients hold it" note="The honest half is the part nobody asks for: holdersOf counts a client with a SIP running into a fund and no position yet, and the count on the fund card has always folded the two together. The rows separate them. Each weight is read against THAT client's own book, and a position over a ceiling names which ceiling — LIMITS carries two different rules that both read 25.">
          <Scene anchor={3}><FundInfo id="ppfas-flexi" /><HoldersTurn id="ppfas-flexi" /></Scene>
        </State>
      </StateRow>
      <StateRow>
        <State label="Who holds it · one client, over a ceiling" tone="under" note="Quant Small Cap is 31% of Sharma's book against a 25% single-fund ceiling. The badge states it and the sentence names the client, the number and the rule — three things, because “over a ceiling” alone is not something an advisor can act on.">
          <Scene anchor={3}><FundInfo id="quant-small" /><HoldersTurn id="quant-small" /></Scene>
        </State>
        <State label="Who holds it · nobody does" tone="under" note="The empty case is a sentence, not an empty card. Sentinel says plainly that none of the advisor's clients hold it and offers the next question — a fund nobody holds is a perfectly good fund to be looking at.">
          <Scene anchor={3}><FundInfo id="sbi-corp" /><HoldersTurn id="sbi-corp" /></Scene>
        </State>
      </StateRow>
    </Section>

    <Section title="9 · Motion, and what each one does under reduced motion">
      <MotionTable rows={MOTION} />
    </Section>

    <Section title="10 · Provenance">
      <ProvenanceTable rows={PROVENANCE} />
    </Section>
  </ScreenShell>
