<!-- The home-screen icon: the system's own sparkle, on the system's own ink, at the system's own
     bronze. Nothing is invented here — the path is IconSparkle's verbatim, and the two colours are
     --color-ink and --color-bronze read from tokens/colors.css. It is a placeholder in the sense
     that nobody has designed an app icon yet; it is not a placeholder in the sense of being off the
     system. Replace it when there is a real one and re-run `npm run build:app`. -->
