<!-- THE APP, ON A PHONE (21 Sep 2026). `prototype.html` is the same product with its documentation
     around it — a control panel, an event log, the router table. This page is the product and nothing
     else, for a link someone opens on a real phone.

     It does NOT re-lay-out the product. Every component in this system is built at 375pt and that is
     a settled decision, so the app renders at exactly 375x812 and the frame is SCALED to the device
     rather than reflowed. A 393x852 phone scales it to 1.048 and fills; a 360x800 phone to 0.96. No
     component sees a width it was not designed for, and nothing is restyled to make this work. -->

</head><body><script data-ds-file-guard>if (location.protocol === 'file:') {
  document.addEventListener('DOMContentLoaded', function () {

    var bar = document.createElement('div');
    bar.setAttribute('style', 'position:fixed;left:0;right:0;top:0;z-index:2147483647;background:#251f1b;color:#fff;padding:10px 14px;' + S);

    document.body.appendChild(bar);

<script>
/* The scale is computed from `window.innerHeight`, not `visualViewport`, and that is the whole
   trick: on iOS the visual viewport shrinks when the keyboard opens, and scaling to that would
   shrink the entire app every time someone typed. `innerHeight` does not move for the keyboard. */
(function () {
  var fit = function () {
    var s = Math.min(window.innerWidth / 375, window.innerHeight / 812);
    document.documentElement.style.setProperty('--ds-fit', String(s));
  };
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 80); });
})();
</script>
<script type="text/babel" data-presets="react">
/* No documentation shell, no PhoneFrame: PhoneFrame is a 44px-radius device on a desk, with a bezel
   shadow and a ring, and on an actual phone that is a picture of a phone inside a phone. The stage
   below is the same 375x812 box with none of the furniture. */
function AppRoot() {
  return <div className="ds-stage"><Proto onEvent={function () {}} /></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<AppRoot />);
</script></body></html>
