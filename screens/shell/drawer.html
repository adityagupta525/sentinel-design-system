<!DOCTYPE html><html><head><meta charset="utf-8"><title>Shell · Drawer — Sentinel screens</title><link rel="stylesheet" href="../../design-system/styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../design-system/_ds_bundle.js"></script>
<script>window.__screenRequires = ['List','Pressable','Composer','Dock','IconSparkle','IconPlus','PhoneFrame','StandingDisclosure'];</script>
<script type="text/babel" src="../screen-kit.jsx"></script>
<script type="text/babel" src="../journey-b/home.jsx"></script>
<style>body{margin:0;background:var(--color-desk);font-family:var(--font-ui)}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
/* home.jsx is loaded above and already declares Composer (and Dock, TopBar, …) at top level. Both
   files compile into the same scope, so re-declaring any of them here is a SyntaxError that leaves
   the page blank. Only the names this file adds are destructured. */
const { List, Pressable, IconSparkle, IconPlus } = window.SentinelDesignSystem_0682a2;

const SAVED = [
  { title: "Meera Nair's risk profile", meta: '12 questions' },
  { title: '₹25 L proposal', meta: '6 funds' },
  { title: 'What Meera holds', meta: '43 funds' },
  { title: "Sharma's rebalance", meta: '2 moves' },
];
/* Two lines, not one. Measured first: in a 300pt drawer a row is 244pt of content, and
   "Mr. Amit Aggrawal — proposal draft" needs 226pt for its title alone — it rendered at 153 and lost a
   third of itself to the ellipsis. A recent thread carries two facts, who and what, and ListRow
   already has a shape for exactly that: title, subtitle, meta. The row goes 56 to 72 and nothing is
   cut. Shortening the copy instead would have hidden the problem at the next long name. */
const RECENT = [
  { title: 'R. Sharma', subtitle: 'Portfolio drift', meta: '2h ago' },
  { title: 'Mr. Amit Aggrawal', subtitle: 'Proposal draft', meta: 'Yesterday' },
  { title: 'HDFC Diwali offer', subtitle: 'AMC circular', meta: '16 Sep' },
  { title: 'Meera Nair', subtitle: 'Q3 review', meta: '15 Sep' },
];
const initials = (n) => n.replace(/^Mr\.\s*/, '').split(' ').map((w) => w[0]).join('').slice(0, 2);
const client = (name) => ({ title: name, leading: 'avatar', leadingContent: initials(name), trailing: 'chevron' });
const CLIENTS = ['Meera Nair', 'Mr. Amit Aggrawal', 'Sunita Nair', 'R. Sharma'].map(client);
const CLIENTS_LONG = ['Ramasubramanian Venkataraghavan', 'Mr. Amit Aggrawal', 'Sunita Nair'].map(client);

/* The appearance control. There is ONE theme: no token in tokens/*.css carries a dark value and no
   component reads a colour scheme. So this states the cap rather than hiding it — OverlapView's rule,
   in its own words: "the cap is STATED when reached, never enforced by a disabled button with no
   explanation."
   The treatment is RangePills' documented `locked` + `lockedNote`, copied rather than invented: the
   row renders inert, the selected option keeps --color-selected with a bronze ring, the rest keep
   --color-chip with a line ring, and one caption underneath says why. Nothing new was designed here.
   It lives in screens/ and not in design-system/ because the system cannot specify it yet — a spec
   page for a two-state control that can only ever render one state is the page this repo deletes.
   Contradiction 58 carries the trigger that promotes it. */
function AppearanceLock({ value = 'Light', options = ['Light', 'Dark'] }) {
  return (
    <div>
      <div role="group" aria-label="Appearance" style={{ display: 'flex', gap: 'var(--space-6)' }}>
        {options.map((o) => {
          const on = o === value;
          return (
            <Pressable key={o} disabled pressed={on} label={`Appearance: ${o}`}
              style={{ display: 'inline-flex', height: 'var(--h-filter-chip)', flexShrink: 0, alignItems: 'center', justifyContent: 'center', padding: '0 var(--space-12)', borderRadius: 'var(--radius-full)', background: on ? 'var(--color-selected)' : 'var(--color-chip)', boxShadow: on ? '0 0 0 var(--border-1) var(--color-bronze)' : '0 0 0 var(--border-1) var(--color-line)' }}>
              <span style={{ font: 'var(--type-label-font)', letterSpacing: 'var(--tracking-pill)', color: on ? 'var(--color-ink)' : 'var(--color-bronze-deep)' }}>{o}</span>
            </Pressable>
          );
        })}
      </div>
      <p style={{ margin: 'var(--space-6) 0 0', font: 'var(--type-caption-font)', color: 'var(--color-muted)' }}>
        One theme so far. Dark arrives when the token layer does.
      </p>
    </div>
  );
}

function Drawer({ saved = SAVED, recent = RECENT, clients = CLIENTS, loading = false, recentFailed = false }) {
  const [value, setValue] = React.useState('');
  const row = { variant: 'nav', trailing: 'chevron' };
  return (
    <>
      {/* The scrim. Modal layers only, and the drawer's is 25% — sheets are 40%. Full-bleed, so the
          gutter guard exempts it by geometry. */}
      <div aria-hidden="true" style={{ position: 'absolute', inset: 0, zIndex: 20, background: 'var(--scrim)', opacity: 0.25 }} />
      {/* data-gutter="edge": the panel is flush to the phone's left edge on purpose — that is what a
          drawer is. The guard cannot tell that from a card that overran, so the element declares it,
          and everything inside it is still held to both gutters. */}
      <div role="dialog" aria-modal="true" aria-label="Menu" data-gutter="edge"
           style={{ position: 'absolute', insetBlock: 0, left: 0, zIndex: 30, display: 'flex', width: 300, flexDirection: 'column', boxSizing: 'border-box', background: 'var(--color-canvas)', boxShadow: 'var(--shadow-drawer)' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '52px 20px 8px' }}>
          <span style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-8)' }}>
            <IconSparkle />
            <span style={{ fontFamily: 'var(--font-ui)', fontWeight: 'var(--weight-bold)', fontSize: 'var(--text-16)', color: 'var(--color-ink)' }}>Sentinel</span>
          </span>
          <Pressable onClick={() => {}} label="New chat"
            style={{ display: 'flex', width: 36, height: 36, alignItems: 'center', justifyContent: 'center', borderRadius: 'var(--radius-full)', background: 'var(--color-surface)', boxShadow: '0 0 0 var(--border-1) var(--color-line)' }}>
            <IconPlus />
          </Pressable>
        </div>

        <div className="noscroll" style={{ flex: 1, overflowY: 'auto', padding: '8px var(--gutter) 0', display: 'flex', flexDirection: 'column', gap: 'var(--space-14)' }}>
          <List header="Jump back in" items={saved.map((r) => ({ ...r, onPress: () => {} }))} rowProps={row} loading={loading}
                emptyState={{ title: 'Nothing saved yet', body: 'Work you start shows up here so you can pick it up tomorrow.' }} />

          {recentFailed ? (
            <div>
              <div style={{ padding: '0 0 6px' }}><span style={{ font: 'var(--type-eyebrow-font)', letterSpacing: 'var(--tracking-eyebrow)', textTransform: 'uppercase', color: 'var(--color-muted)' }}>Recent</span></div>
              <p style={{ margin: 0, fontFamily: 'var(--font-ui)', fontWeight: 'var(--weight-regular)', fontSize: 'var(--text-12)', lineHeight: 'var(--leading-17)', color: 'var(--color-muted)' }}>
                I could not load your recent threads just now. Everything else here still works.
              </p>
            </div>
          ) : (
            <List header="Recent" items={recent.map((r) => ({ ...r, onPress: () => {} }))} rowProps={row} loading={loading}
                  emptyState={{ title: 'No threads yet', body: 'Every question you ask is kept here.' }} />
          )}

          <List header="Clients" items={clients.map((r) => ({ ...r, onPress: () => {} }))} rowProps={{ variant: 'nav' }} loading={loading}
                emptyState={{ title: 'No clients on file', body: 'Your book appears here once it is connected.' }} />

          <p style={{ margin: 0, fontFamily: 'var(--font-ui)', fontWeight: 'var(--weight-regular)', fontSize: 'var(--text-11)', lineHeight: 'var(--leading-15)', color: 'var(--color-muted)' }}>
            Demo data · no real client portfolios are shown
          </p>
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-12)', padding: '12px var(--gutter) 8px' }}>
          <Pressable onClick={() => {}} label="Back to home"
            style={{ display: 'flex', minHeight: 'var(--h-row-lg)', width: '100%', alignItems: 'center', gap: 'var(--space-8)', borderRadius: 'var(--radius-12)', padding: '0 var(--space-12)', boxSizing: 'border-box', background: 'var(--color-surface)', boxShadow: '0 0 0 var(--border-1) var(--color-line)' }}>
            <span style={{ fontFamily: 'var(--font-ui)', fontWeight: 'var(--weight-medium)', fontSize: 'var(--text-13)', color: 'var(--color-ink)' }}>‹ Back to home</span>
          </Pressable>
          <AppearanceLock />
        </div>

        {/* Rule 3. readme.md:68 names the drawer among the surfaces that carry the composer, and only
            the confirm sheet is exempt. It was not on the brief for this screen; it is here because
            the rule says so, and taking it out is a decision for the owner, not for me. */}
        <div style={{ padding: '0 var(--gutter) 20px' }}>
          <Composer value={value} onChange={setValue} placeholder="Ask Sentinel" onSend={() => {}} />
        </div>
      </div>
    </>
  );
}

const Scene = (props) => (
  <div style={{ position: 'relative', height: '100%', width: '100%' }}>
    <Home hour={15} time="3:04" />
    <Drawer {...props} />
  </div>
);

const MOTION = [
  ['Drawer in', 'transform: translateX(−100%) → 0', '320ms', 'Fades in place at x=0 — it arrives, it does not travel'],
  ['Scrim in', <span>opacity 0 → 0.25 on <code>--scrim</code></span>, '250ms', 'Unchanged — already opacity only'],
  ['Row press', <span>background to <code>--tint-bronze-06</code></span>, '150ms', 'Unchanged — a colour change is not motion'],
  ['List skeleton', 'shimmer', 'loop', <span>Holds still — <code>List</code> does this itself</span>],
];

const PROVENANCE = [
  ['12 questions · 6 funds · 43 funds · 2 moves', 'The advisor’s own saved work, counted', 'The row’s meta, right-aligned, muted'],
  ['2h ago · Yesterday · 16 Sep · 15 Sep', 'When each thread was last touched. Day-first, short month, per rule 4', 'The row’s meta'],
  ['The client rows', 'The advisor’s book. Initials are derived from the name, never a photograph', 'A bronze-20% disc — the system ships no avatars'],
];

mountScreen(
  <ScreenShell
    journey="App shell" n="Drawer" name="The menu"
    job="Everything that is history: saved work, recent threads and the client book. It opens from the hamburger on every screen, over a 25% scrim, and it is where Home's “Jump back in” went."
    without="cannot get back to yesterday's work, and cannot reach a client without typing their name."
  >
    <Section title="1 · The screen" sub="300pt wide over a 25% scrim. The layer behind is the real Home, rendered from the same home.jsx the Home page uses — not a copy.">
      <StateRow>
        <State label="typical" note="Three sections, each a List: saved work, recent threads, the book. Rows are ListRow at 56 — the height settled when this list left Home, bought with the required empty state, the skeleton, the footer row and the chevron contract.">
          <Scene />
        </State>
        <State label="first run" tone="under" note="All three empty, and each says its own sentence rather than “No data”. List requires an emptyState, which is why none of these could have been forgotten.">
          <Scene saved={[]} recent={[]} clients={[]} />
        </State>
      </StateRow>
    </Section>

    <Section title="2 · Arriving, and failing" sub="Unlike Home, the drawer IS its history — so here a skeleton is honest and a failure has to be said.">
      <StateRow>
        <State label="loading" tone="under" note="Three lists, three arrival times. The skeleton is right here and wrong on Home: on Home the section is additive and may turn out empty; here it is the content, and the drawer is never anything else.">
          <Scene loading />
        </State>
        <State label="one section failed" tone="over" note="Recent could not load; saved work and the book still did. It fails per section and never blanks the drawer — the new-chat button, Back to home and the composer all survive, so the advisor is never trapped in a menu that has nothing in it.">
          <Scene recentFailed />
        </State>
        <State label="long client name" tone="under" note="A 300pt drawer is 268 of usable width and a row is 244 of content. ListRow truncates rather than wrapping, because the row is a fixed height. A name this long is the case where that is still the right answer — the avatar and the position in the book identify it, and the full name is one tap away.">
          <Scene clients={CLIENTS_LONG} />
        </State>
      </StateRow>
    </Section>

    <Section title="3 · Light and dark" sub="There is one theme. This is how the screen says so without lying and without a dead button.">
      <div style={{ display: 'flex', gap: 24, alignItems: 'flex-start', flexWrap: 'wrap' }}>
        <div style={{ width: 268, borderRadius: 'var(--radius-16)', background: 'var(--color-surface)', padding: 16, boxShadow: 'var(--shadow-card-soft)' }}>
          <AppearanceLock />
        </div>
        <Note title="Why it looks like this">
          Both options are shown, neither can be chosen, and one line says why. That is
          <code> RangePills</code>&rsquo;s documented <code>locked</code> / <code>lockedNote</code> treatment, copied
          rather than invented: inert row, selected keeps <code>--color-selected</code> and a bronze ring, the rest
          keep <code>--color-chip</code> and a line ring, caption underneath. It follows
          <code> OverlapView</code>&rsquo;s rule in the system&rsquo;s own words — <em>the cap is stated when
          reached, never enforced by a disabled button with no explanation</em>.
        </Note>
        <Note title="Why it is not a design-system component">
          No token in <code>tokens/*.css</code> carries a dark value and no component reads a colour scheme, so the
          system cannot specify this control today: a spec page for a two-state toggle that can only render one
          state is the page this repository deletes. <code>StickyCTA</code> was removed ten commits ago for
          exactly that shape of mistake. It lives in <code>screens/</code> with a dated trigger in
          <code> contradictions.md</code> (row 58) that promotes it the day dark tokens land.
        </Note>
      </div>
    </Section>

    <Section title="4 · What measuring the 300pt drawer changed" sub="The brief said to measure rather than guess. This is what it found.">
      <Note title="The drawer's own gutter is 16 — the same as the phone's">
        Measured inside the panel: the section cards sit at <strong>left 16, right 16, 268 wide</strong>, and a
        row is <strong>244</strong> of content after the card&rsquo;s own 12. So the drawer does not get a
        narrower gutter for being a narrower surface. The gutter guard sees this correctly because the panel
        declares <code>data-gutter="edge"</code> and becomes the frame for everything inside it.
      </Note>
      <Note title="And one row was losing a third of its label">
        &ldquo;Mr. Amit Aggrawal &mdash; proposal draft&rdquo; needed <strong>226pt</strong> of title and had
        <strong>153</strong>. It rendered as an ellipsis eating the topic. The fix was not shorter copy, which
        only moves the problem to the next long name: a recent thread carries two facts, who and what, and
        <code> ListRow</code> already has a shape for that. Recent rows are now title, subtitle and meta at 72pt,
        and nothing is cut.
      </Note>
    </Section>

    <Section title="5 · Two things the brief did not say, and one it did not answer">
      <Note title="The composer is here, and it was not on the list">
        <code>readme.md:68</code> names the drawer among the surfaces that carry the composer, and rule 3 has
        exactly one documented exception — the confirm sheet. The brief for this screen listed the sections and
        the two controls at the bottom and did not mention it. It is here because the rule says so. Taking it
        out is a decision for the owner, not for me.
      </Note>
      <Note title="Still open — a 512-client book behind a four-row list">
        The product&rsquo;s own copy says a 512-client book. This screen shows four names and has no search.
        <code> SearchField</code> is in the system and unused. That is gap G6 in <code>SCREENS-PLAN.md</code>, and
        it is not fixed here because the brief did not ask for it and adding a search box changes what the drawer
        is.
      </Note>
    </Section>

    <Section title="6 · Motion, and what each one does under reduced motion">
      <MotionTable rows={MOTION} />
    </Section>

    <Section title="7 · Provenance">
      <ProvenanceTable rows={PROVENANCE} />
    </Section>
  </ScreenShell>
);
</script></body></html>
