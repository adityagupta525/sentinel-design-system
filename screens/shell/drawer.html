<!-- @dsCard group="Screens" viewport="1400x2700" name="Shell · Drawer" subtitle="The menu: saved work, recent threads, the client book — and the one place an unbuilt theme is allowed to appear" -->
<!-- @gutter min="16" fullBleed="ScreenBackdrop, StatusSpacer, TopBar, GreetingDivider, Dock, HomeIndicator, scrim" truncation="allowed" -->
<!-- truncation="allowed" is for ONE state, the long client name: ListRow truncates a 232px name in a 172px box by design, and the page says so beside the phone. Every other state on this page truncates nothing. -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Shell · Drawer — Sentinel screens</title><link rel="stylesheet" href="../../design-system/styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../design-system/_ds_bundle.js"></script>
<script>window.__screenRequires = ['Drawer','SegmentedRow','Pressable','PhoneFrame'];</script>
<script type="text/babel" src="../screen-kit.jsx"></script>
<script type="text/babel" src="../journey-b/home.jsx"></script>
<style>body{margin:0;background:var(--color-desk);font-family:var(--font-ui)}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
/* home.jsx is loaded above and already declares Composer (and Dock, TopBar, …) at top level. Both
   files compile into the same scope, so re-declaring any of them here is a SyntaxError that leaves
   the page blank. Only the names this file adds are destructured. */
/* Everything the screen draws is the system's. Drawer and SegmentedRow were hand-built here on 18 Sep
   and PROMOTED the same day on the owner's ruling that a screen never hand-builds what it needs —
   they now live in design-system/components with contracts and spec pages, and this page only
   composes them. home.jsx is loaded above and owns the shared destructure; only new names here. */
const { Drawer, SegmentedRow, Pressable } = window.SentinelDesignSystem_0682a2;

const SAVED = [
  { title: "Meera Nair's risk profile", meta: '12 questions' },
  { title: '₹25 L proposal', meta: '6 funds' },
  { title: 'What Meera holds', meta: '43 funds' },
  { title: "Sharma's rebalance", meta: '2 moves' },
  { title: "Sunita Nair's Q2 review", meta: '31 funds' },
];
/* One line, both facts: the client is the TITLE, the topic is the META. Measured on 18 Sep: the two in
   one string needed 226pt where a 300pt drawer gives 153; two lines fixed that at 72pt a row and made
   the drawer long; this is the third try and the one that is both. The timestamp was dropped on
   purpose — three facts do not fit 244pt, and the topic is the one that picks the right thread. */
const RECENT = [['R. Sharma','Portfolio drift'],['Mr. Amit Aggrawal','Proposal draft'],['HDFC Diwali offer','AMC circular'],['Meera Nair','Q3 review'],
  ['Sunita Nair','Exit load'],['Meera Nair','SIP change'],['R. Sharma','Mandate note'],['HDFC AMC','NFO circular'],['Mr. Amit Aggrawal','KYC']].map(([t, m]) => ({ title: t, meta: m }));
const initials = (n) => n.replace(/^Mr\.\s*/, '').split(' ').map((w) => w[0]).join('').slice(0, 2);
const client = (name) => ({ title: name, leading: 'avatar', leadingContent: initials(name), trailing: 'chevron' });
const CLIENTS = ['Meera Nair', 'Mr. Amit Aggrawal', 'Sunita Nair', 'R. Sharma', 'Kavita Rao', 'Anil Menon', 'Priya Deshpande', 'Vikram Shah', 'Lakshmi Iyer', 'Rohan Gupta'].map(client);
const CLIENTS_LONG = ['Ramasubramanian Venkataraghavan', 'Mr. Amit Aggrawal', 'Sunita Nair'].map(client);

const Footer = () => (
  <React.Fragment>
    <Pressable onClick={() => {}} label="Back to home" style={{ display: 'flex', minHeight: 'var(--h-row-lg)', width: '100%', alignItems: 'center', boxSizing: 'border-box' }}>
      <span style={{ fontFamily: 'var(--font-ui)', fontWeight: 'var(--weight-semibold)', fontSize: 'var(--text-13)', color: 'var(--color-bronze-deep)' }}>‹ Back to home</span>
    </Pressable>
    <SegmentedRow label="Appearance" options={['Light', 'Dark']} value="Light" locked lockedNote="One theme so far. Dark arrives with its tokens." />
  </React.Fragment>
);
/* For the spec page's frozen states the drawer is rendered open. The product never does this — the
   contract says mount closed, open with an action — so the "live" state below opens it the real way. */
const Menu = ({ scrolled, ...p }) => <Drawer open onClose={() => {}} saved={SAVED} recent={RECENT} clients={CLIENTS} footer={<Footer />} {...p} />;

const Scene = (props) => (
  <div style={{ position: 'relative', height: '100%', width: '100%' }}>
    <Home hour={15} time="3:04" />
    <Menu {...props} />
  </div>
);
/* The one state that opens the real way: mounted closed, the hamburger opens it. This is the state a
   keyboard is checked against — Escape closes, Tab wraps, focus returns to the hamburger. */
function LiveScene() {
  const [open, setOpen] = React.useState(false);
  return (
    <div style={{ position: 'relative', height: '100%', width: '100%' }}>
      <Home hour={15} time="3:04" onMenu={() => setOpen(true)} />
      <Drawer open={open} onClose={() => setOpen(false)} onNew={() => setOpen(false)} saved={SAVED} recent={RECENT} clients={CLIENTS} footer={<Footer />} />
    </div>
  );
}

const MOTION = [
  ['Drawer in', 'transform: translateX(−100%) → 0', '320ms', 'Fades in place at x=0 — it arrives, it does not travel'],
  ['Scrim in', <span>opacity 0 → 0.25 on <code>--scrim</code></span>, '250ms', 'Unchanged — already opacity only'],
  ['Row press', <span>background to <code>--tint-bronze-06</code></span>, '150ms', 'Unchanged — a colour change is not motion'],
  ['List skeleton', 'shimmer', 'loop', <span>Holds still — <code>List</code> does this itself</span>],
];

const PROVENANCE = [
  ['12 questions · 6 funds · 43 funds · 2 moves', 'The advisor’s own saved work, counted', 'The row’s meta, right-aligned, muted'],
  ['2h ago · Yesterday · 16 Sep · 15 Sep', 'When each thread was last touched. Day-first, short month, per rule 4', 'The row’s meta'],
  ['The client rows', 'The advisor’s book. Initials are derived from the name, never a photograph', 'A bronze-20% disc — the system ships no avatars'],
];

mountScreen(
  <ScreenShell
    journey="App shell" n="Drawer" name="The menu"
    job="Everything that is history: saved work, recent threads and the client book. It opens from the hamburger on every screen, over a 25% scrim, and it is where Home's “Jump back in” went."
    without="cannot get back to yesterday's work, and cannot reach a client without typing their name."
  >
    <Section title="1 · The screen" sub="300pt wide over a 25% scrim. The layer behind is the real Home, rendered from the same home.jsx the Home page uses — not a copy.">
      <StateRow>
        <State label="typical · at the top" note="Three sections, each a List, each capped with a “See all” row: 3 saved, 7 recent, 8 clients. Rows are ListRow at 56 — the height settled when this list left Home, bought with the required empty state, the skeleton, the footer row and the chevron contract.">
          <Scene />
        </State>
        <State label="live · opens the real way" note="Mounted CLOSED, opened by the hamburger — the way the product does it and the only way the dialog contract arms: focus moves in, Escape closes, Tab wraps, focus returns to the hamburger. Tap the menu icon. The frozen phones on this page are specimens; this one is the screen.">
          <LiveScene />
        </State>
        <State label="first run" tone="under" note="All three empty, and each says its own sentence rather than “No data”. List requires an emptyState, which is why none of these could have been forgotten.">
          <Scene saved={[]} recent={[]} clients={[]} />
        </State>
      </StateRow>
    </Section>

    <Section title="2 · Arriving, and failing" sub="Unlike Home, the drawer IS its history — so here a skeleton is honest and a failure has to be said.">
      <StateRow>
        <State label="loading" tone="under" note="Three lists, three arrival times. The skeleton is right here and wrong on Home: on Home the section is additive and may turn out empty; here it is the content, and the drawer is never anything else.">
          <Scene loading />
        </State>
        <State label="one section failed" tone="over" note="Recent could not load; saved work and the book still did. It fails per section and never blanks the drawer — the new-chat button, Back to home and the composer all survive, so the advisor is never trapped in a menu that has nothing in it.">
          <Scene failed={{ recent: true }} />
        </State>
        <State label="long client name" tone="under" note="A 300pt drawer is 268 of usable width and a row is 244 of content. ListRow truncates rather than wrapping, because the row is a fixed height. A name this long is the case where that is still the right answer — the avatar and the position in the book identify it, and the full name is one tap away.">
          <Scene clients={CLIENTS_LONG} />
        </State>
      </StateRow>
    </Section>

    <Section title="3 · Light and dark" sub="There is one theme. This is how the screen says so without lying and without a dead button.">
      <div style={{ display: 'flex', gap: 24, alignItems: 'flex-start', flexWrap: 'wrap' }}>
        <div style={{ width: 268, borderRadius: 'var(--radius-16)', background: 'var(--color-surface)', padding: 16, boxShadow: 'var(--shadow-card-soft)' }}>
          <SegmentedRow label="Appearance" options={['Light', 'Dark']} value="Light" locked lockedNote="One theme so far. Dark arrives with its tokens." />
        </div>
        <Note title="Why it looks like this">
          Both options are shown, neither can be chosen, and one line says why. That is
          <code> RangePills</code>&rsquo;s documented <code>locked</code> / <code>lockedNote</code> treatment, copied
          rather than invented: inert row, selected keeps <code>--color-selected</code> and a bronze ring, the rest
          keep <code>--color-chip</code> and a line ring, caption underneath. It follows
          <code> OverlapView</code>&rsquo;s rule in the system&rsquo;s own words — <em>the cap is stated when
          reached, never enforced by a disabled button with no explanation</em>.
        </Note>
        <Note title="What is and is not in the design system now">
          The control IS a system component — <code>SegmentedRow</code>, with a contract and a spec page — because
          what is generic is &ldquo;one of a set, and a locked state that says why&rdquo;, and that can be specified
          today. What is still NOT in the system is a dark theme: no token carries a dark value, so the row is
          <code>locked</code> and says so. Contradiction 58 records the extraction as done and keeps one trigger
          open: re-pointing <code>RangePills</code> at the shared row, with a screenshot hash proving the no-op.
        </Note>
      </div>
    </Section>

    <Section title="4 · What measuring the 300pt drawer changed" sub="The brief said to measure rather than guess. This is what it found.">
      <Note title="The drawer's own gutter is 16 — the same as the phone's">
        Measured inside the panel: the section cards sit at <strong>left 16, right 16, 268 wide</strong>, and a
        row is <strong>244</strong> of content after the card&rsquo;s own 12. So the drawer does not get a
        narrower gutter for being a narrower surface. The gutter guard sees this correctly because the panel
        declares <code>data-gutter="edge"</code> and becomes the frame for everything inside it.
      </Note>
      <Note title="The caps were in the system and I had not applied them">
        The first cut rendered 4 / 4 / 4 uncapped, and the client book ended up below the fold with nothing
        saying it was there. <code>List.jsx:8</code> already states the answer: <em>&ldquo;One scroll: a List
        never scrolls independently inside a scrolling surface. Cap it and give it a footer row instead — that
        is why the drawer&rsquo;s sections are capped at 3 / 7 / 8 with See all.&rdquo;</em> Applied, with a
        &ldquo;See all&rdquo; row that appears only when the cap actually bit.
      </Note>
      <Note title="A recent row took three tries, and the third is the compact one">
        <strong>One:</strong> client and topic in a single title — &ldquo;Mr. Amit Aggrawal &mdash; proposal
        draft&rdquo; — needed <strong>226pt</strong> and had <strong>153</strong>, so an ellipsis ate the topic.
        <strong>Two:</strong> title, subtitle and meta on two lines fixed the truncation and made every recent
        row <strong>72pt</strong>; seven of those is 504pt of drawer.
        <strong>Three:</strong> the client is the title and the topic is the meta, back to <strong>56pt</strong>,
        nothing cut. The timestamp was dropped to make room, deliberately: three facts do not fit 244pt, and the
        topic is the one that picks the right thread — two threads about Sharma are told apart by
        &ldquo;drift&rdquo; and &ldquo;mandate note&rdquo;, never by the clock. Recency is carried by the order
        of the list, which is what &ldquo;Recent&rdquo; means.
      </Note>
    </Section>

    <Section title="5 · Two things the brief did not say, and one it did not answer">
      <Note title="The composer is NOT here — the owner's ruling, and the argument for it">
        Rule 3 protects one thing: <em>the advisor can always just ask</em>. The drawer is the one surface where
        asking was never taken away. It is a navigation overlay; the thread and its composer sit one tap behind
        the scrim, and a second composer here competes with the list that is the whole point of the menu. That is
        the same shape as the confirm-sheet exception, which <code>readme.md</code> calls <em>&ldquo;a third path
        that does not exist&rdquo;</em>.
        <br /><br />
        <strong>But <code>readme.md:68</code> still names the drawer among the surfaces that carry the
        composer</strong>, so the specification and this screen disagree until that line is amended. Logged as
        contradiction 59. The four rules are the product&rsquo;s law and their wording is the owner&rsquo;s, so
        it is not edited here.
      </Note>
      <Note title="Still open — a 512-client book behind an eight-row list">
        The product&rsquo;s own copy says a 512-client book. This screen shows the first eight and a
        &ldquo;See all&rdquo; row, and it has no search. <code>SearchField</code> is in the system and unused.
        That is gap G6 in <code>SCREENS-PLAN.md</code>, and it is not fixed here because the brief did not ask
        for it and adding a search box changes what the drawer is. The cap makes the list honest; it does not
        make 512 names reachable.
      </Note>
    </Section>

    <Section title="6 · Motion, and what each one does under reduced motion">
      <MotionTable rows={MOTION} />
    </Section>

    <Section title="7 · Provenance">
      <ProvenanceTable rows={PROVENANCE} />
    </Section>
  </ScreenShell>
);
</script></body></html>
