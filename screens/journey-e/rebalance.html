<script>window.__screenRequires = ['AnswerChip','AttachmentTurn','Badge','ChartBar','ChipRow','Composer','ConfirmSheet','DarkButton','DataTable','Dock','DownloadAction','DrawnCheck','Dumbbell','ExplainerSheet','Eyebrow','FigureRow','FileUpload','HomeIndicator','MessageActions','MoveCard','ParseNote','PhoneFrame','Pill','ProgressRail','Provenance','QAPair','ResultActions','ResultCard','ResultPrimary','ScreenBackdrop','SentinelBlock','SentinelText','SentinelThinking','SentinelTurn','StandingDisclosure','StatusSpacer','StepTrace','Surface','TopBar','UserBubble','UserTurn'];</script>

<script type="text/babel" data-presets="react">
const { ConfirmSheet, SentinelText, MoveCard } = window.SentinelDesignSystem_0682a2;

/* The rail's `Step` and `Targets` were deleted on 20 Sep 2026 with the sequence they served. The three
   targets are REB_DIALS now — chips under a recommendation rather than a gate in front of one — and
   TargetRow lives on in rebalance.jsx for whatever needs to draw one. */
function ResultScene({ state = 'draft', savedAt, sentAt, children, anchor = 'bottom' }) {
  const att = useAttachment();
  return (
    <Thread anchor={anchor} revision={`${state}-${!!att.file}`} composer={<FrozenAsk onAttach={att.onAttach} />}>
      <UserTurn text={REB_ASK} costNote="Sending this replaces the plan below it." />
      <RebalanceResult state={state} savedAt={savedAt} sentAt={sentAt}
        onSave={() => {}} onDownload={() => new Promise((r) => setTimeout(r, 700))} onPrimary={() => {}} />
      {children}
      <AttachmentTurn file={att.file} caption="Here is his Q3 statement." onRemove={att.clear} />
    </Thread>
  );
}

/* The paperclip is real on every screen in this product, including the ones that are here to show what
   happened after a confirm. A Composer without onAttach is a drawing of a control, and the preview gate
   fails a screen that ships one. */
function AfterScene({ children }) {
  const att = useAttachment();
  return (
    <Thread anchor="bottom" revision={!!att.file} composer={<FrozenAsk onAttach={att.onAttach} />}>
      <UserTurn text={REB_ASK} />
      {children}
      <AttachmentTurn file={att.file} caption="Here is his Q3 statement." onRemove={att.clear} />
    </Thread>
  );
}

/* The answer-first sequence is a THREAD, not a rail — Sentinel can answer "rebalance Sharma", so there
   is nothing to ask before it does. `anchor` takes the turn the state is about, the way Journey C's
   holdings scenes do. */
function Scene({ children, anchor = 'bottom' }) {
  const att = useAttachment();
  return (
    <Thread anchor={anchor} revision={!!att.file} composer={<FrozenAsk onAttach={att.onAttach} />}>
      <UserTurn text={REB_ASK} costNote="Sending this replaces everything below it." />
      {children}
      <AttachmentTurn file={att.file} caption="Here is his Q3 statement." onRemove={att.clear} />
    </Thread>
  );
}

function LiveRebalance() {
  const [sheet, setSheet] = React.useState(false);
  const [picked, setPicked] = React.useState(null);
  const [uncosted, setUncosted] = React.useState(null);
  /* A real picker, not a prop that satisfies the gate. onAttach={() => {}} passes the DEAD PAPERCLIP
     check and drops the file, which is the same lie the check was written to catch. */
  const att = useAttachment();
  return (
    <div style={{ position: 'relative', height: '100%', width: '100%' }}>
      {picked
        ? <Thread anchor="bottom" revision={!!att.file} composer={<FrozenAsk onAttach={att.onAttach} />}>
            <UserTurn text={REB_ASK} costNote="Sending this replaces the plan below it." />
            <RebalanceResult onSave={() => {}} onDownload={() => new Promise((r) => setTimeout(r, 700))} onPrimary={() => setSheet(true)} />
            <AttachmentTurn file={att.file} caption="Here is his Q3 statement." onRemove={att.clear} />
          </Thread>
        : <Thread anchor={uncosted ? 'bottom' : 2} revision={`${uncosted ? uncosted.id : 'none'}-${!!att.file}`} composer={<FrozenAsk onAttach={att.onAttach} />}>
            <UserTurn text={REB_ASK} costNote="Sending this replaces everything below it." />
            <RebalanceAnswer
              onApprove={uncosted ? undefined : () => setPicked(REBALANCE_TARGETS.find((t) => t.costRs != null))}
              onDial={(d) => { const t = REBALANCE_TARGETS.find((x) => x.id === d.id); if (t) setUncosted(t); }} />
            {uncosted && <UncostedTurn target={uncosted} onChip={(l) => { if (/can cost/.test(l)) setUncosted(null); }} />}
            <AttachmentTurn file={att.file} caption="Here is his Q3 statement." onRemove={att.clear} />
          </Thread>}
      <ConfirmSheet open={sheet} title="Approve · R. Sharma" disclosure={CONFIRM_DISCLOSURE} rows={CONFIRM_ROWS}
        commitLabel="Approve both moves" onCommit={() => setSheet(false)} onClose={() => setSheet(false)}>
        {MOVES.map((m) => <MoveCard key={m.n} n={m.n} title={m.title} body={m.body} />)}
      </ConfirmSheet>
    </div>
  );
}

function App() {
  return (
    <ScreenShell
      journey="Journey E · Sharma's rebalance, cold" n="9" name="The rebalance"
      job="Journey B rebalances Sharma after explaining why he drifted. This one starts with the advisor typing “rebalance Sharma” and nothing in front of them — so Sentinel asks the one question that makes it an instruction: how far. Three answers, three different rules, and only one of them has a cost."
      without="has a rebalance that only exists as the end of a drift explanation — and no answer at all when an advisor asks for one directly."
    >
      <Section title="1 · The answer first, then the dials" sub="Ruled 20 Sep 2026. The version this replaces opened with a QUESTION — how far — and three rule-named targets, each with a headline, a rule, a paragraph of why, a cost or a refusal and a chip: three parallel options and ~180 words before a single move was shown. The rules were right and the sequence was not. Journey B's version of the same rebalance is understood in one line, because it leads with the answer. So: diagnose, propose, cost, then offer the dials — and the three rules survive as those dials, which is where an alternative belongs.">
        <StateRow>
          <State label="R1 · where he is" note="The CAP split, not Equity/Debt/Cash — both of this product's 25% ceilings are written against caps the three-row card never showed, which is the research's own complaint in an MFD's words. One hue: ChartBar offers `tone='status'` for the bar that crossed a limit and it is used on no screen, so a danger-coloured FILL would be a first here and rule 2 reserves that colour for text. The bar ranks by length; the sentence names the fund, the figure and both ceilings.">
            <Scene anchor={2}><RebalWhere /></Scene>
          </State>
          <State label="R2 · what I would do, R3 · what it costs" note="One body with Journey B, so the figure on this card and the figure on that one can never disagree. The cost is no longer a total an advisor cannot take apart: exit load, short-term tax, long-term tax, each carrying the rule that produced it, and the SIP redirect saying plainly that it costs nothing because nothing is sold.">
            <Scene anchor={3}><RebalWhere /><RebalPlan /></Scene>
          </State>
        </StateRow>
        <StateRow>
          <State label="R4 · the dials" note="The two rules Sentinel could not cost, the destination, and the question behind the recommendation. Each re-runs the plan as its own turn rather than replacing this one. One dark CTA, and it is the approve — SentinelTurn's `cta` can only hold one.">
            <Scene anchor={4}><RebalWhere /><RebalPlan /><RebalDials /></Scene>
          </State>
          <State label="the whole arrival" note="Three blocks, ONE ✦ Sentinel — it is one thing Sentinel said. The advisor has not spoken between them, so a second signature would be the name said twice for one answer (18 Sep).">
            <Scene anchor={2}><RebalanceAnswer /></Scene>
          </State>
        </StateRow>
        <StateRow>
          <State label="R5 · a dial Sentinel cannot cost" tone="under" note="Unchanged in substance, and it is the journey's whole argument rather than a state of it: the two other rules have no purchase dates on folio 9142/28, so Sentinel sizes them, refuses a figure, and offers the nearest real thing. No confirm sheet opens on a move nobody can cost.">
            <Scene anchor={4}><RebalanceAnswer /><UncostedTurn target={REBALANCE_TARGETS[0]} /></Scene>
          </State>
          <State label="entered carrying a fund" note="“Attach to a rebalance” on the fund explorer lands here with the fund already chosen, and it becomes the DESTINATION — the half the three targets never carried. Off the shelf is refused in the first sentence, not at the confirm, because this moves money under the advisor's own ARN.">
            <Scene anchor={2}><RebCarried fundId="icici-corp" /><RebalanceAnswer /></Scene>
          </State>
        </StateRow>
      </Section>

      <Section title="2 · The plan, as an artifact" sub="The same two moves and the same simulation Journey B shows — ONE body, drawn in moves.jsx. There it is a message in a conversation; here it is an artifact the advisor asked for cold and may save.">
        <StateRow>
          <State label="draft" note="ResultCard journey='rebalance', so the plan carries its provenance, a Save and a Download — and exactly ONE approve, which is ResultPrimary reading “Approve both moves” from the count. Journey B's MovesActions is the other frame's single approve. Never both on one screen.">
            <ResultScene />
          </State>
          <State label="saved" note="draft → saved on Save. The badge is a date, not a tick: saved means the plan exists, not that anything has been placed.">
            <ResultScene state="saved" savedAt="19 Sep" />
          </State>
          <State label="the confirm" note="The same sheet, the same disclosure and the same three compliance rows as Journey B, because it is the same money. Reaching it from a different door must not change what the advisor is asked to take responsibility for.">
            <div style={{ position: 'relative', height: '100%', width: '100%' }}>
              <ResultScene state="saved" savedAt="19 Sep" />
              <ConfirmSheet open title="Approve · R. Sharma" disclosure={CONFIRM_DISCLOSURE} rows={CONFIRM_ROWS}
                commitLabel="Approve both moves" onCommit={() => {}} onClose={() => {}}>
                {MOVES.map((m) => <MoveCard key={m.n} n={m.n} title={m.title} body={m.body} />)}
              </ConfirmSheet>
            </div>
          </State>
        </StateRow>
      </Section>

      <Section title="3 · After the confirm, it is Journey B" sub="In flight, placed, partial and sent-with-no-answer are R2's four states and they are not rebuilt here. A second copy of “what happened” is a second place for the honest wording to rot.">
        <StateRow>
          <State label="in flight" note="Sent, nothing back. It says WHEN it went and that the advisor need not wait — the research asked to be told, not to be fast.">
            <AfterScene><ExecutionTurn state="flight" /></AfterScene>
          </State>
          <State label="placed" note="A drawn check, the references, and what has and has not left Sentinel. Compare Journey D's, which says the opposite because a proposal places nothing.">
            <AfterScene><SuccessTurn /></AfterScene>
          </State>
          <State label="live · run it" note="Pick a target. The costed one opens the plan; either uncosted one gets sized, refused a figure, and offered the two real ways forward. The confirm sheet cannot be reached from an uncosted move at all — that is the point of the journey, not a state of it.">
            <LiveRebalance />
          </State>
        </StateRow>
      </Section>

      <Section title="4 · Where the numbers come from">
        <ProvenanceTable rows={[
          ['Equity 71% vs 60%', <span><code>sharma.allocation</code> and <code>sharma.mandate</code></span>, '11 points over, stated in the first sentence'],
          ['₹1,56,530', <span>11 points of <code>portfolio.valueRs</code> ₹14,23,000</span>, '“To the mandate” — moves this much'],
          ['₹85,380', <span>6 points; 65 is the edge of <code>LIMITS.driftBand</code> ±5</span>, '“Inside the band”'],
          ['₹1,85,000 → equity 58', <span><code>sharma.rebalance</code>, the move Journey B already costs</span>, '“Clear the fund ceiling”'],
          ['31% → 18%', <span><code>holdings[0]</code> ₹4,41,130 less ₹1,85,000, of ₹14,23,000</span>, 'Why the ceiling sized the move'],
          ['₹11,200', <span><code>sharma.rebalance.costRs</code></span>, 'The one cost the book carries'],
          ['No cost for the other two', <span><code>rebalance.costParts</code> is a placeholder — the split needs purchase dates on folio 9142/28</span>, 'Stated as missing, with the folio named'],
        ]} />
        <Note title="Two ceilings, both 25, and they are not the same rule">
          <code>LIMITS.singleFund</code> caps one scheme at 25% of the book. <code>LIMITS.smallCapSleeve</code> caps
          small cap overall at 25%. Quant Small Cap is 31% and it is <em>the whole of his small-cap sleeve</em>, so
          that single holding is over both at once. The book records the pair as contradiction 32 precisely so nobody
          collapses them into one rule; this screen is the first place a client&rsquo;s numbers make them look
          identical, and the explainer says why they are not.
        </Note>
        <Note title="What this screen does not do">
          <strong>Nothing is placed.</strong> No order leaves the page and the PDF writes no file. The two uncosted
          targets are sized and never costed, on purpose: this repository has no purchase dates for folio 9142/28 and
          <strong> the confirm sheet cannot be opened from either of them</strong>. That is the design, not a gap to
          fill later &mdash; a product that lets an advisor approve an uncosted switch has made the number optional,
          and the number is the whole job.
        </Note>
      </Section>
    </ScreenShell>
  );
}

mountScreen(<App />);
</script></body></html>
