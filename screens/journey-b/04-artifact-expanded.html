<script type="text/babel" data-presets="react">
/* thread.jsx and answer.jsx compile into this same scope — Thread, AnswerTurn, AnswerChips and the
   DRIFT_* data are already globals here. Only the names this file adds are destructured. */
const { Composer, UserBubble, ProgressTrace, DarkButton } = window.SentinelDesignSystem_0682a2;

const Trace = () => <ProgressTrace steps={DRIFT_STEPS} reasoning={DRIFT_REASONING} autoplay={false} initialActive={4} seconds={4} initialCollapsed />;
/* The placeholder is the context-keyed one: an expanded artifact makes the composer "Ask about this",
   and it returns to "Ask Sentinel" on collapse (readme.md:210). Rule 3 — it is still there. */
const Ask = ({ about = true }) => <Composer value="" onChange={() => {}} placeholder={about ? 'Ask about this' : 'Ask Sentinel'} onSend={() => {}} />;

/* anchor=2 puts the artifact turn at the top of the thread, which is the caller-owned scroll
   ArtifactCard's contract requires on expand: "bring the card's header just under the app bar". */
function Scene({ view = 'chart', top = false }) {
  /* The anchor is the CARD, not the turn it sits in: the contract says the card's HEADER goes just under
     the app bar, and the card sits 291pt inside its own turn (measured). `top` shows the same screen from
     the beginning of the thread instead. */
  const card = React.useRef(null);
  return (
    <Thread anchor={top ? 0 : card} chips={<AnswerChips />} cta={<DarkButton label="Rebalance to his mandate" onClick={() => {}} />} composer={<Ask />}>
      <UserBubble text={DRIFT_ASK} />
      <Trace />
      <AnswerTurn artifact="expanded" view={view} cardRef={card} />
    </Thread>
  );
}

/* Live, so the two scrolls can be checked rather than described: expand brings the header under the
   app bar, collapse returns to where the card was, and the placeholder follows the state. */
function LiveScene() {
  const [state, setState] = React.useState('expanded');
  const [view, setView] = React.useState('chart');
  const scroller = React.useRef(null);
  const card = React.useRef(null);
  const saved = React.useRef(null);   // null until an expand actually recorded a position
  const toggle = () => {
    const el = scroller.current, c = card.current;
    if (state === 'peek') {
      if (el && c) saved.current = el.scrollTop;
      setState('expanded');
      requestAnimationFrame(() => { if (el && c) el.scrollTo({ top: el.scrollTop + (c.getBoundingClientRect().top - el.getBoundingClientRect().top), behavior: 'smooth' }); });
    } else {
      setState('peek'); setView('chart');
      requestAnimationFrame(() => requestAnimationFrame(() => { if (el && saved.current != null) el.scrollTo({ top: saved.current, behavior: 'smooth' }); }));
    }
  };
  return (
    <Thread scrollRef={scroller} anchor={card} chips={<AnswerChips onHoldings={() => setView((v) => (v === 'table' ? 'chart' : 'table'))} />}
      cta={<DarkButton label="Rebalance to his mandate" onClick={() => {}} />} composer={<Ask about={state === 'expanded'} />}>
      <UserBubble text={DRIFT_ASK} />
      <Trace />
      <AnswerTurn artifact={state} view={view} run cardRef={card} onToggle={toggle} onMenu={() => setView((v) => (v === 'table' ? 'chart' : 'table'))} />
    </Thread>
  );
}

const MOTION = [
  ['Expand', 'the card takes its content’s natural height; the chevron rotates 180°', '320ms', 'Height changes with no transition; the chevron flips'],
  ['Thread scroll on expand', 'the card’s header travels to just under the app bar', 'smooth', <span>Instant — <code>scroll-behavior: auto</code> under the reduced-motion block</span>],
  ['Bars draw', 'scaleX from the left, 200ms apart', '200ms each', 'Drawn at full length — the bar is never frozen at zero'],
  ['62 → 71 counts up', <span><code>useCountUp</code> over <code>--dur-count</code></span>, '600ms', 'The final number, rendered once'],
  ['Collapse', 'back to the 96pt cap; the thread returns to the card’s old position', '320ms', 'Both immediate'],
  ['Chart ⇄ table', 'the card’s content is replaced in place; the height follows', 'immediate', 'Unchanged — there is no animation to drop'],
];

const PROVENANCE = [
  ['Target 60%', 'The mandate on file', 'The chart’s first row, above the hairline'],
  ['Today 71%', 'His Q3 statement', 'The chart’s last row, counted up to, at display size'],
  ['+6.1 · +2.0 · +0.9', <span>The archive’s own <em>illustration</em> of the headline — <code>Chat.tsx:42</code> marks the split “[draft] … illustrative demo figures”. The headline (62 → 71, two-thirds is the rally) is the product’s</span>, 'Direct-labelled at each bar’s value, and again as rows in the table view'],
  ['“this one was a decision of yours”', 'The July top-up is his own instruction, not the market', <span>De-emphasis grey with a hairline outline — never a second hue (rule 1)</span>],
  ['Everything', 'His Q3 statement and the mandate on file', '“As of 30 Sep · from his Q3 statement and mandate on file”, under the chart'],
];

mountScreen(
  <ScreenShell
    journey="Journey B · Sharma’s drift" n="Screen 4 of 7" name="The artifact, expanded"
    job="The same card, opened. It takes its content’s natural height and the thread carries the scroll — there is no canvas, so there is nowhere to go back from. The composer stays, and asks about this."
    without="reads a finding they cannot check: the three contributions, what each was, and which one was their own decision."
  >
    <Section title="1 · Opened in place" sub="The eyebrow and title move into the card’s own header, the ⋯ appears beside them, and the footer’s Expand becomes Collapse. Nothing else on the screen moves.">
      <StateRow>
        <State label="typical" note="Plot 180 and a 14pt axis band, inside the ≤208 budget. Target 60 above the hairline, three contributions, today 71 at display size. The middle bar is grey with a hairline because it was his own instruction — de-emphasis, never a second hue. The thread is scrolled so the card’s header sits under the app bar: that scroll belongs to the screen, not the card, and it is what the contract asks for on expand.">
          <Scene />
        </State>
        <State label="live · expand, collapse, and the ⋯" note="Tap Collapse and the card returns to its 96pt peek and the thread scrolls back to where the card was; tap Expand and the header comes back under the app bar. The ⋯ swaps the chart for its table and back. Watch the composer: “Ask about this” while it is open, “Ask Sentinel” when it is not.">
          <LiveScene />
        </State>
      </StateRow>
    </Section>

    <Section title="2 · The table view every chart owes" sub="From the card’s ⋯. The system’s own words: no value in this product is ever reachable only by touching a coloured shape.">
      <StateRow>
        <State label="table view" note="The same three numbers, the same order, as rows — with the line each bar carries under it kept as the second line of the cell, so nothing is lost by reading this instead of looking at that. The footer states the total the chart draws as a chain: target 60, today 71, +9.0 points in all.">
          <Scene view="table" />
        </State>
        <State label="the whole thread, from the top" tone="under" note="The same screen scrolled to the beginning instead of to the card. The question, the closed trace, the answer, the allocation, then the expanded artifact — one scroller, top to bottom. Nothing inside the card scrolls: that is the rule that replaced the canvas, and it is the one way expand-in-place stops feeling right.">
          <Scene top />
        </State>
      </StateRow>
    </Section>

    <Section title="3 · What this screen deliberately does not draw">
      <Note title="“Show the 18 holdings” has no data, and inventing it would be the worst thing on this page">
        The chip is in the archive (<code>Chat.tsx:363</code>) and it opened the canvas, which no longer exists.
        Its real destination is a table of Sharma&rsquo;s eighteen funds &mdash; and the archive holds no holdings for
        him. The eight-row holdings table in <code>journeys.tsx:396</code> is <strong>Meera&rsquo;s</strong>, from the
        review journey, and 43 funds rather than 18. Filling this card with her rows under his name is exactly the
        kind of figure an advisor would read to a client, so it is not drawn. Today the chip toggles the table view
        above; the holdings artifact waits for his holdings. Logged as a gap in <code>SCREENS-PLAN.md</code>.
      </Note>
      <Note title="No nested scroll, and the two scrolls that make that work">
        An expanded card takes its natural height &mdash; measured here at <strong>475pt</strong> in a 462pt thread,
        so it is taller than the viewport and the THREAD scrolls, never the card. Two behaviours belong to the screen
        and are wired in the live phone above and in the prototype: on expand, bring the card&rsquo;s header just under
        the app bar, so the advisor starts at the top of what they opened; on collapse, return to the card&rsquo;s
        position, so they are not stranded three screens down in older turns.
      </Note>
      <Note title="No shared-element transition, and no back arrow">
        The card expands where it is. There is no flight from a card into a page, because the page it used to fly to
        was deleted in v5 &mdash; and a screen that &ldquo;smart animates&rdquo; a card into a page has invented
        something this system does not have. For the same reason there is no <em>&lsquo; Back to chat</em>: the thread
        never left.
      </Note>
    </Section>

    <Section title="4 · Motion, and what each one does under reduced motion">
      <MotionTable rows={MOTION} />
    </Section>

    <Section title="5 · Provenance">
      <ProvenanceTable rows={PROVENANCE} />
    </Section>
  </ScreenShell>
);
</script></body></html>
