<!DOCTYPE html><html><head><meta charset="utf-8"><title>Journey B · 01 Home — Sentinel screens</title><link rel="stylesheet" href="../../design-system/styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../design-system/_ds_bundle.js"></script>
<script>window.__screenRequires = ['ScreenBackdrop','StatusSpacer','TopBar','GreetingDivider','SuggestionRow','List','Dock','Composer','Pill','ChipRow','HomeIndicator','PhoneFrame'];</script>
<script type="text/babel" src="../screen-kit.jsx"></script>
<style>body{margin:0;background:var(--color-desk);font-family:var(--font-ui)}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
const { ScreenBackdrop, StatusSpacer, TopBar, GreetingDivider, SuggestionRow, List, Dock, Composer,
        Pill, ChipRow, HomeIndicator } = window.SentinelDesignSystem_0682a2;

/* Content is the product's, taken from docs/screens-source/src/screens/Home.tsx and journeys.tsx.
   Nothing here is invented: every label and every count is one the archive already carried. */
const SUGGESTIONS = [
  'Show me Diwali offer from HDFC AMC',
  'Build a proposal for Mr. Amit Aggrawal',
  "Why did Sharma's portfolio drift this quarter?",
];
const CHIPS = ['Review a portfolio', 'Proposal', 'Fund explorer'];
const SAVED = [
  { title: "Meera's risk profile", meta: '12 questions' },
  { title: '₹25 L proposal',       meta: '6 funds' },
  { title: 'What Meera holds',     meta: '43 funds' },
  { title: "Sharma's rebalance",   meta: '2 moves' },
];
const SAVED_LONG = [
  { title: 'Mr. Amit Aggrawal — moderate mandate proposal', meta: '6 funds' },
  ...SAVED.slice(1),
];

/* The greeting is a band, not a constant. The archive hardcodes "Good afternoon"; a screen that ships
   that is wrong for sixteen hours of the day. */
function greetingFor(hour) {
  return hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
}

/* ONE component, six states. Each state is a different `saved` prop, never a different tree — a state
   drawn by hand is a state that can drift from the one the product will actually render. */
function Home({ saved = 'ready', hour = 15, advisor = 'Ashish', rows = SAVED, footer }) {
  const [value, setValue] = React.useState('');
  const card = { width: '100%', borderRadius: 'var(--radius-16)', background: 'var(--color-surface)', padding: '0 var(--space-12)', boxShadow: 'var(--shadow-card-soft)' };
  return (
    <div style={{ position: 'relative', display: 'flex', height: '100%', width: '100%', flexDirection: 'column' }}>
      <ScreenBackdrop />
      <StatusSpacer />
      <TopBar title="Sentinel" onMenu={() => {}} onNew={() => setValue('')} />

      <div style={{ position: 'relative', zIndex: 1, paddingTop: 'var(--space-4)' }}>
        <GreetingDivider>{greetingFor(hour)}, {advisor}</GreetingDivider>
      </div>

      {/* The three capability rows. These are what Sentinel can do, so they do not depend on history
          and they are present in every state including the first run. */}
      <div style={{ position: 'relative', zIndex: 1, padding: '24px var(--gutter) 0' }}>
        <div style={card}>
          {SUGGESTIONS.map((s, i) => <SuggestionRow key={s} label={s} last={i === SUGGESTIONS.length - 1} onClick={() => {}} />)}
        </div>
      </div>

      {/* "Jump back in" is history, so it is the part that has an empty, a loading and an error.
          It is rendered ONLY when there is something to render: the eyebrow is a promise, and a
          promise withdrawn 400ms later is worse than a section that was never there. */}
      {saved === 'ready' && (
        <div style={{ position: 'relative', zIndex: 1, padding: '20px var(--gutter) 0' }}>
          <List
            header="Jump back in"
            items={rows.map((r) => ({ ...r, onPress: () => {} }))}
            rowProps={{ variant: 'nav', trailing: 'chevron' }}
            footer={footer}
            emptyState={{ title: 'Nothing saved yet', body: 'Work you start shows up here so you can pick it up tomorrow.' }}
          />
        </div>
      )}
      {saved === 'error' && (
        <div style={{ position: 'relative', zIndex: 1, padding: '20px var(--gutter) 0' }}>
          <p style={{ margin: 0, fontFamily: 'var(--font-ui)', fontWeight: 'var(--weight-regular)', fontSize: 'var(--text-12)', lineHeight: 'var(--leading-17)', color: 'var(--color-muted)' }}>
            I could not load your saved work just now. Everything above still works, and it will be here when I can reach it.
          </p>
        </div>
      )}

      <div style={{ flex: 1 }} />

      <Dock
        chips={<ChipRow>{CHIPS.map((c) => <Pill key={c} label={c} onClick={() => {}} />)}</ChipRow>}
        composer={<Composer value={value} onChange={setValue} placeholder="Ask Sentinel about a client, a fund, or a plan" onSend={() => {}} />}
      />
      <HomeIndicator />
    </div>
  );
}

const MOTION = [
  ['Screen enter', <code>ds-screen-in</code>, '320ms', 'Fades in place; no 100% slide, nothing stranded off-screen'],
  ['Section rise', 'fade + 8–12px rise, 60ms stagger', '240–320ms', 'Held at the resting position, opacity 1 — the rows are there, they just do not travel'],
  ['Row press', <span>background to <code>--tint-bronze-06</code></span>, '150ms', 'Unchanged — a colour change is not motion'],
  ['Pill press', 'transform: scale(0.98)', '150ms', 'No scale'],
  ['List skeleton', 'shimmer', 'loop', <span>Holds still — <code>List</code> does this itself</span>],
];

const PROVENANCE = [
  ['12 questions · 6 funds · 43 funds · 2 moves', 'The advisor’s own saved work, counted — not a client figure', 'The row’s meta, right-aligned, muted'],
  ['Nothing else on this screen', 'Home carries no client figure at all', '—'],
];

mountScreen(
  <ScreenShell
    journey="Journey B · Sharma’s drift" n="Screen 1 of 7" name="Home"
    job="The way in, and the only screen an advisor sees before they have asked anything. Three capability rows say what Sentinel can do; four doors return them to work in progress; three chips and a composer start something new."
    without="has no way in that shows what Sentinel can do — they would have to already know what to type."
  >
    <Section title="1 · Typical" sub="Mid-afternoon, four pieces of saved work. This is the frame the other five are measured against.">
      <StateRow>
        <State label="typical" note="The composer is the last interactive row and is present on every screen — rule 3. The Dock draws it with the chips above and the standing disclosure below, all from one component.">
          <Home saved="ready" hour={15} />
        </State>
        <State label="edge" tone="under" note="A long saved-work label truncates in the row rather than wrapping the row taller, and a fifth item becomes a footer instead of a fifth row. A capped list with a footer is how this system avoids a scroller inside a scrolling surface.">
          <Home saved="ready" hour={15} rows={SAVED_LONG} footer={<Pill label="See all 5" size="sm" tone="muted" onClick={() => {}} />} />
        </State>
      </StateRow>
    </Section>

    <Section title="2 · First run, loading, and the failure" sub="Three states, and two of them are deliberately the same frame.">
      <StateRow>
        <State label="empty" tone="under" note="A new advisor has no history. The section is omitted entirely rather than shown empty: List requires an emptyState and would render one, but an eyebrow reading “Jump back in” above “nothing saved yet” promises a thing that does not exist yet. The three capability rows carry the first run.">
          <Home saved="empty" hour={9} />
        </State>
        <State label="loading" tone="under" note="Identical to the first run, on purpose. Saved work arrives from a server; a four-row skeleton for a section that may turn out to have zero rows tells a lie that lasts 400ms. The rows appear when they are real.">
          <Home saved="loading" hour={9} />
        </State>
        <State label="error" tone="over" note="The section is omitted and one muted line says so, in the product's voice, under the suggestions. Not a red banner: nothing is broken for the advisor, and the first screen of the day is the wrong place to raise an alarm — rule 2.">
          <Home saved="error" hour={19} />
        </State>
      </StateRow>
      <Note title="Refused — not applicable here">Home never refuses. The composer hands every input to the thread, which routes it through the six buckets and answers there. The nearest thing to a refusal on this screen is the error line above, and it is a failure to load, not a refusal to act.</Note>
    </Section>

    <Section title="3 · The greeting is a band, not a constant" sub="The archive hardcodes “Good afternoon, Ashish”. That is wrong for sixteen hours of the day, and the advisor's name comes from the session.">
      <StateRow>
        <State label="06:00" note="Good morning">   <Home saved="ready" hour={6} /></State>
        <State label="15:00" note="Good afternoon"><Home saved="ready" hour={15} /></State>
        <State label="19:00" note="Good evening">  <Home saved="ready" hour={19} /></State>
      </StateRow>
      <Note title="Found by building this — the clock disagrees with the greeting">
        Read the status bar on the three phones above: all of them say <strong>9:41</strong>, including the one
        greeting the advisor good evening. <code>StatusSpacer</code> hardcodes 9:41 and takes no props, which is
        right for a component specimen and wrong the moment a screen renders a time-of-day state. Left alone
        rather than worked around, because a <code>time</code> prop is a change to a shipped component and that
        is the owner's call — see decision 3 below.
      </Note>
    </Section>

    <Section title="4 · Motion, and what each one does under reduced motion">
      <MotionTable rows={MOTION} />
    </Section>

    <Section title="5 · Provenance" sub="Rule 4 asks for provenance under every figure. Home is the one screen in the journey that carries no client figure at all, so this table is short — and saying that is the point, rather than leaving the reader to infer it.">
      <ProvenanceTable rows={PROVENANCE} />
    </Section>

    <Section title="6 · Two things this screen needs a decision on" sub="Both change what Home looks like, so neither was decided here.">
      <Note title="1 · The height of a “Jump back in” row">
        The archive and the UI kits draw these rows at <strong>46px</strong>, as raw buttons — that is what
        <code> --h-row-lg</code> is named for. The system's own answer for a list of rows is <code>List</code> +
        <code> ListRow</code>, which is <strong>56px</strong> with no subtitle, and which brings the required
        empty state, the loading skeleton, the footer row and the chevron contract with it. This screen uses the
        component, so the rows are 56. Keeping 46 means keeping them as raw rows and losing all four of those.
        Your call: 56 and the component, or 46 and hand-built rows.
      </Note>
      <Note title="2 · The red circle on the quick-action chips">
        <code>docs/screens-source/src/imports/preview-drawing.png</code> is Home in the current visual language
        with your own red circle around “Review a portfolio · Proposal · Fund explorer”, and no note beside it.
        They are drawn here exactly as the archive has them. What did the circle mean?
      </Note>
      <Note title="3 · A time on StatusSpacer">
        <code>StatusSpacer</code> hardcodes 9:41 and takes no props, so every screen that renders a time-of-day
        state contradicts its own status bar — visible in section 3 above. The fix is one optional prop,
        <code>time</code>, defaulting to <code>'9:41'</code> so nothing that renders today changes. That is a
        change to a shipped component and to its contract, so it is not made here. Say the word and it is a
        three-line change with an integrity update in the same commit.
      </Note>
    </Section>
  </ScreenShell>
);
</script></body></html>
