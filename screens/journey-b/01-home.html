<!DOCTYPE html><html><head><meta charset="utf-8"><title>Journey B · 01 Home — Sentinel screens</title><link rel="stylesheet" href="../../design-system/styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../design-system/_ds_bundle.js"></script>
<script>window.__screenRequires = ['ScreenBackdrop','StatusSpacer','TopBar','GreetingDivider','SuggestionRow','Dock','Composer','HomeIndicator','PhoneFrame'];</script>
<script type="text/babel" src="../screen-kit.jsx"></script>
<style>body{margin:0;background:var(--color-desk);font-family:var(--font-ui)}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
const { ScreenBackdrop, StatusSpacer, TopBar, GreetingDivider, SuggestionRow, Dock, Composer,
        HomeIndicator } = window.SentinelDesignSystem_0682a2;

/* The three rows are BUILT FROM THE ADVISOR'S OWN BOOK. Named when it is there, capability-shaped when
   it is not — and the capability-shaped set is the base case, not the exception, which is why this
   screen has no loading state and no error state. Every row routes: checked by hand against the three
   intent patterns in docs/screens-source/src/lib/router.ts, which match on "risk profil", "propos"
   and "drift". Each of the six labels below contains one of them. */
const NAMED = [
  "Start Meera Nair's risk profile",
  'Build a proposal for Mr. Amit Aggrawal',
  "Why did Sharma's portfolio drift this quarter?",
];
const UNNAMED = [
  'Start a risk profile',
  'Build a proposal',
  "Explain a portfolio's drift",
];

function greetingFor(hour) {
  return hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
}

function Home({ hour = 15, time = '3:04', advisor = 'Ashish', rows = NAMED }) {
  const [value, setValue] = React.useState('');
  return (
    <div style={{ position: 'relative', display: 'flex', height: '100%', width: '100%', flexDirection: 'column' }}>
      <ScreenBackdrop />
      <StatusSpacer time={time} />
      <TopBar title="Sentinel" onMenu={() => {}} onNew={() => setValue('')} />

      <div style={{ position: 'relative', zIndex: 1, paddingTop: 'var(--space-4)' }}>
        <GreetingDivider>{greetingFor(hour)}, {advisor}</GreetingDivider>
      </div>

      <div style={{ position: 'relative', zIndex: 1, padding: '24px var(--gutter) 0' }}>
        <div style={{ width: '100%', borderRadius: 'var(--radius-16)', background: 'var(--color-surface)', padding: '0 var(--space-12)', boxShadow: 'var(--shadow-card-soft)' }}>
          {rows.map((s, i) => <SuggestionRow key={s} label={s} last={i === rows.length - 1} onClick={() => {}} />)}
        </div>
      </div>

      <div style={{ flex: 1 }} />

      {/* No chips row. Dock.d.ts calls that slot "Contextual AnswerChips"; on Home nothing has been
          said, so there is no context for it to carry. Composer and the standing disclosure only. */}
      <Dock composer={<Composer value={value} onChange={setValue} placeholder="Ask Sentinel about a client, a fund, or a plan" onSend={() => {}} />} />
      <HomeIndicator />
    </div>
  );
}

const MOTION = [
  ['Screen enter', <code>ds-screen-in</code>, '320ms', 'Fades in place; no slide, nothing stranded off-screen'],
  ['Section rise', 'fade + 8–12px rise, 60ms stagger', '240–320ms', 'Held at the resting position, opacity 1 — the rows are there, they do not travel'],
  ['Row press', <span>background to <code>--tint-bronze-06</code></span>, '150ms', 'Unchanged — a colour change is not motion'],
  ['Send disc press', 'transform: scale(0.94)', '150ms', 'No scale'],
];

const PROVENANCE = [
  ['The three rows', <span>The advisor&rsquo;s own book — the client whose profile is unstarted, the one with an open proposal, the one whose portfolio moved</span>, 'Named in the row itself: “Meera Nair”, “Mr. Amit Aggrawal”, “Sharma”'],
  ['The greeting', 'The device clock and the signed-in advisor', '“Good afternoon, Ashish”, beside a status bar showing the same time'],
  ['Everything else', 'Home carries no client figure at all', '—'],
];

mountScreen(
  <ScreenShell
    journey="Journey B · Sharma’s drift" n="Screen 1 of 7" name="Home"
    job="The way in, and the only screen an advisor sees before they have asked anything. Three rows built from their own book, and a composer. Nothing else."
    without="has no way in that shows what Sentinel can do, and no one-tap route back to the client who needs them most."
  >
    <Section title="1 · The screen" sub="Greeting, three rows, composer. The saved-work widget moved to the menu and the quick-action chips are gone, so what is left is the shortest thing that still answers “what can I do, and for whom”.">
      <StateRow>
        <State label="typical" note="The book is loaded, so every row names a client. The rows are ordered by the client lifecycle — know them, build for them, keep it right — not by recency, because recency is what the menu is for.">
          <Home hour={15} time="3:04" />
        </State>
        <State label="book unavailable" tone="under" note="A first day, or a book that has not arrived, or one that failed to. All three render this, and that is the point: the capability-shaped rows are the BASE CASE and the names are an enhancement that arrives. So this screen has no loading state and no error state to get wrong — it is never blank and it never promises a name it does not have.">
          <Home hour={9} time="8:30" rows={UNNAMED} />
        </State>
      </StateRow>
      <Note title="Why there is no “Jump back in” here any more">
        Saved work is history, and history belongs in the menu with the rest of it — recent threads and the
        client list. Home is what an advisor sees before they have asked anything, so it should answer
        “what can I do, and for whom”, not “what were you doing yesterday”. The empty and loading states that
        section used to carry went with it; they are the drawer&rsquo;s question now.
      </Note>
      <Note title="Why the quick-action chips are gone">
        Two reasons, and neither is that their destinations disappeared — they never opened a canvas at all.
        <code> docs/screens-source/src/App.tsx:58</code> says a quick-action chip is a conversational turn, and
        <code> handleChip</code> posts the label to the thread. They are gone because they said the same three
        capabilities as the card above them, in the abstract, four hundred points below it; and because
        <code> Dock.d.ts</code> calls that slot “Contextual AnswerChips”, and on Home nothing has been said yet.
      </Note>
    </Section>

    <Section title="2 · A name that does not fit" sub="Measured, not assumed, at 375 with a 343 content box.">
      <StateRow>
        <State label="short name" note="“Good afternoon, Ashish” — 233pt of text with 47pt of dashed rule on each side.">
          <Home hour={15} time="3:04" advisor="Ashish" />
        </State>
        <State label="long name" tone="under" note="“Good afternoon, Ramasubramanian” — 349pt on one line against a 343 box, so it wrapped. Two lines, 70pt tall instead of 43, and the 27pt it costs comes out of the empty middle of the screen. Nothing below it moves.">
          <Home hour={15} time="3:04" advisor="Ramasubramanian" />
        </State>
      </StateRow>
      <Note title="What was measured, and what the numbers actually were">
        At 375 the greeting has a 343 content box. As shipped the line was <code>white-space: nowrap</code>:
        “Ashish” 233, “Priya” 216, “Vishwanathan” 304 — all fine — then “Ramasubramanian” 349 and
        “Lakshminarayanan” 351, which sit 3 and 4 points into each gutter. So the break is real, it starts at
        about fifteen characters rather than twelve, and it is a few points rather than tens of them. It wraps
        now instead of truncating: a tool whose whole job is to treat a client as a person does not cut a
        person&rsquo;s name in half. Names that already fitted render identically, which was checked by hashing
        all 75 pages either side of the change.
      </Note>
      <Note title="Open, and not fixed here — the hairlines yield before the text does">
        The two dashed rules are <code>flex: 1</code>, so the name squeezes them: 47pt beside “Ashish”, 12pt
        beside “Vishwanathan”, and nothing at all beyond that, where the component stops looking like a divider.
        Wrapping does not bring them back, because the wrapped line still fills the width. A
        <code> max-width</code> on the text would reserve them, at the cost of wrapping shorter names sooner.
        That is a visible change to a settled component on every screen, so it is yours to call.
      </Note>
    </Section>

    <Section title="3 · The states this screen does not have" sub="Named, because a matrix with a silent gap is a matrix nobody can check.">
      <Note title="No loading, no error, no separate empty">
        All three collapse into “book unavailable” above. The rows always render; the names are the part that
        may not arrive. There is nothing on this screen that can half-load, so there is no skeleton to show and
        no failure to report.
      </Note>
      <Note title="No refusal">
        Home never refuses. The composer hands every input to the thread, which routes it through the six
        buckets and answers there. A refusal is a thing Sentinel says, and Sentinel has not spoken yet.
      </Note>
    </Section>

    <Section title="4 · Motion, and what each one does under reduced motion">
      <MotionTable rows={MOTION} />
    </Section>

    <Section title="5 · Provenance">
      <ProvenanceTable rows={PROVENANCE} />
    </Section>
  </ScreenShell>
);
</script></body></html>
