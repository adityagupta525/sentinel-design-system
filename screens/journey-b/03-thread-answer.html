<!DOCTYPE html><html><head><meta charset="utf-8"><title>Journey B · 03 Thread, the answer — Sentinel screens</title><link rel="stylesheet" href="../../design-system/styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../design-system/_ds_bundle.js"></script>
<script>window.__screenRequires = ['ScreenBackdrop','StatusSpacer','TopBar','Dock','Composer','UserBubble','ProgressTrace','SentinelBlock','SentinelText','AllocationCard','Provenance','ArtifactCard','ChartBar','AttributionChart','AnswerChip','ChipRow','DarkButton','ExplainerSheet','MessageActions','FileUpload','StepTrace','Pill','HomeIndicator','PhoneFrame'];</script>
<script type="text/babel" src="../screen-kit.jsx"></script>
<script type="text/babel" src="./thread.jsx"></script>
<script type="text/babel" src="./answer.jsx"></script>
<style>body{margin:0;background:var(--color-desk);font-family:var(--font-ui)}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
/* thread.jsx and answer.jsx are loaded above and compile into this same scope: Thread, AnswerTurn,
   AnswerChips and the DRIFT_* data are already globals. Only the names this file adds are destructured. */
const { Composer, UserBubble, ProgressTrace, DarkButton, ExplainerSheet, MessageActions, FileUpload, Pill } = window.SentinelDesignSystem_0682a2;

/* Every specimen is FROZEN: the trace is past its last step and collapsed to its one-line resting
   state (initialCollapsed — added to ProgressTrace for this screen, because the product shows the
   answer under a closed trace and a frozen page could not), and nothing animates. */
const Trace = ({ open = false }) => <ProgressTrace steps={DRIFT_STEPS} reasoning={DRIFT_REASONING} autoplay={false} initialActive={4} seconds={4} initialCollapsed={!open} />;
const Ask = () => <Composer value="" onChange={() => {}} placeholder="Ask Sentinel" onSend={() => {}} />;
const CTA = () => <DarkButton label="Rebalance to his mandate" onClick={() => {}} />;

const Scene = ({ artifact = 'peek', traceOpen = false, holdings = true, anchor }) => (
  <Thread anchor={anchor} chips={<AnswerChips holdings={holdings} />} cta={<CTA />} composer={<Ask />}>
    <UserBubble text={DRIFT_ASK} />
    <Trace open={traceOpen} />
    <AnswerTurn artifact={artifact} />
  </Thread>
);

/* The one state that opens the real way. The sheet is MOUNTED CLOSED — rule 3 of screens/README —
   and the chip opens it, which is the false → true transition that moves focus in and arms the Tab
   trap. Rendering it open would have handed this page's keyboard to a specimen (F-25). */
function LiveScene() {
  const [why, setWhy] = React.useState(false);
  return (
    <div style={{ position: 'relative', height: '100%', width: '100%' }}>
      <Thread chips={<AnswerChips onWhy={() => setWhy(true)} />} cta={<CTA />} composer={<Ask />}>
        <UserBubble text={DRIFT_ASK} />
        <Trace />
        <AnswerTurn artifact="peek" onWhy={() => setWhy(true)} />
      </Thread>
      <ExplainerSheet open={why} title={WHY_71.title} body={WHY_71.body} onClose={() => setWhy(false)} />
    </div>
  );
}

/* Live, because an edit you cannot type into is a picture of an edit. Mounted NOT editing: the state is
   reached the way the product reaches it, by tapping Edit. */
function EditScene() {
  const [editing, setEditing] = React.useState(false);
  const [text, setText] = React.useState(DRIFT_ASK);
  return (
    <Thread anchor="bottom" chips={<AnswerChips />} cta={<CTA />} composer={<Ask />}>
      <UserBubble text={text} editing={editing} onChange={setText} onCancel={() => { setText(DRIFT_ASK); setEditing(false); }} onSave={() => setEditing(false)}
        costNote="Sending this replaces the answer below it." />
      {!editing && <MessageActions role="user" onAction={() => setEditing(true)} />}
      <Trace />
      <AnswerTurn artifact="peek" />
    </Thread>
  );
}

/* The parse stages are the ones this product actually performs on a statement, in its own words. */
const PARSE = [
  { label: 'Read the file', state: 'done', meta: '14 pages' },
  { label: 'Found the holdings table', state: 'done', meta: '18 funds' },
  { label: 'Matched them to the mandate', state: 'done', meta: '3 outside it' },
];
function FileScene() {
  const [file, setFile] = React.useState({ name: 'Sharma-Q3-statement.pdf', meta: '14 pages · 1.2 MB · added just now' });
  return (
    <Thread anchor="bottom" composer={<Composer value="" onChange={() => {}} placeholder="Ask Sentinel" onAttach={(f) => setFile({ name: f.name, meta: `${Math.max(1, Math.round(f.size / 1024))} KB · added just now` })} onSend={() => {}} />}>
      <UserBubble text="Here's his Q3 statement." />
      <FileUpload file={file} stages={PARSE} state="done" summary="Read his Q3 statement · 14 pages · 18 holdings"
        actions={<Pill label="What changed since Q2?" size="sm" tone="outline" onClick={() => {}} />} />
    </Thread>
  );
}

const MOTION = [
  ['Trace collapses to “Thought for 4s ›”', 'the steps leave, the one line stays', 'immediate', 'Unchanged — there is no animation to drop'],
  ['Answer arrives', <span><code>ds-rise</code>: fade + 8px rise</span>, '240ms', 'Fades in place, no rise'],
  ['Allocation bar', <span><code>ds-grow</code>: scaleX 0 → 1, 120ms stagger</span>, '480ms', 'Drawn at full width — the keyframe is redefined to scaleX(1)'],
  ['Artifact card arrives', <span><code>ds-artifact</code>: fade + scale 0.96 → 1</span>, '300ms', 'Fade only — the card carries its own reduced-motion redefinition'],
  ['Peek bars grow', 'scaleX from the left, 60ms stagger', '480ms', 'Instant — every transition is cut to 1ms'],
  ['Chips arrive', <span><code>ds-rise</code>, 60ms stagger</span>, '240ms', 'Fade only'],
  ['Explainer sheet in', <span><code>ds-sheet</code>: translateY 100% → 0</span>, '300ms', 'Fade only'],
  ['Explainer scrim', <span>declared 0.4 on <code>--scrim</code></span>, '300ms', <span>Opacity only. <strong>Open, F-27:</strong> it computes to 1, not 0.4 — the fix that exists in <code>ds-scrim</code> waits for the owner because it changes what a shipped sheet looks like</span>],
];

const PROVENANCE = [
  ['62% → 71%, 60% target', 'His Q2 and Q3 statements against the mandate on file', 'The trace’s reasoning, then the card’s title “62% → 71%, mostly the market”, then the expanded chart’s Target row'],
  ['Equity 71 · Debt 24 · Cash 5', 'His Q3 statement', <span>The allocation card, with <code>Provenance</code> under it: “As of 30 Sep · from his Q3 statement”</span>],
  ['+6.1 · +2.0 · +0.9', <span>The archive’s own <em>illustration</em> of the headline — <code>Chat.tsx:42</code> marks the split “[draft] … illustrative demo figures”. The headline (62 → 71, two-thirds is the rally) is the product’s; the split is carried as its illustration, not as data</span>, 'The three peek bars, direct-labelled to one decimal; the card’s provenance line under them'],
  ['“Two-thirds”', '6.1 of 9.0 points — 68%', 'The first sentence of the answer'],
  ['“11% over”', '71 against 60 — 11 points', 'The explainer sheet’s first paragraph'],
];

mountScreen(
  <ScreenShell
    journey="Journey B · Sharma’s drift" n="Screen 3 of 7" name="Thread — the answer"
    job="The answer, and the object it produced. One sentence that says what happened and whose decision it was, the allocation as it stands, and the attribution as a card the advisor can recognise without reading — then open."
    without="gets a number with no reason, or a chart with no sentence — and cannot tell the client what happened in one breath."
  >
    <Section title="1 · The screen" sub="Three things, in the order an advisor needs them: what happened, where he stands, what moved it. The trace is closed above the answer, the way the product leaves it.">
      <StateRow>
        <State label="typical · as the answer lands" note="The trace rests at one line. The answer names the cause and the advisor's part in it; the allocation card is the position today, with its provenance under it; the artifact begins below. The turn is ~500pt in a 462pt thread, so the thread rests with the FIRST line on screen rather than the last — measured, and written into thread.jsx: the newest turn starts on screen, and ends on screen too only if it fits. Sticking to the bottom scrolled the sentence away while it was being read.">
          <Scene />
        </State>
        <State label="typical · scrolled to the artifact" note="The same screen after the advisor scrolls. The artifact at its 96px peek — three ranked bars, one colour, direct-labelled to one decimal — and its title is the finding, not the noun. Two chips and one CTA in the Dock; the composer under them, as on every screen. This is the frame the advisor taps Expand from.">
          <Scene anchor="bottom" />
        </State>
        <State label="live · opens the real way" note="Mounted CLOSED and opened by the chip, the only way the sheet's contract arms: focus moves in, Escape closes, Tab wraps, focus returns to the chip. Tap “Why is 71% a problem?”, or the card's own “Why?”. Two paragraphs, which is the sheet's working limit; a decision is never put in it.">
          <LiveScene />
        </State>
        <State label="filling" tone="under" note="Skeleton-first: the sentence has arrived and the breakdown has not. The card is its own shape, shimmering, so the advisor already knows what is coming; its title says what is being worked out, and it has no provenance line yet because there is nothing to attribute. “Show the 18 holdings” waits with it — the door to an artifact that is not there yet would open onto a skeleton.">
          <Scene artifact="filling" holdings={false} />
        </State>
      </StateRow>
    </Section>

    <Section title="2 · When the breakdown does not arrive, and when the trace is reopened">
      <StateRow>
        <State label="artifact failed" tone="over" note="The answer stands — the drift is known from the allocation — and the card does not pretend. The failure is said in the same block, as text on the same surface (rule 2), it says what survived, and it offers Try again inline on the message that owns it. “Why is 71% a problem?” stays because 71 is still true; “Show the 18 holdings” goes because the holdings did not arrive. The CTA stays for the same reason the first chip does.">
          <Scene artifact="failed" holdings={false} />
        </State>
        <State label="trace reopened" tone="under" note="The advisor tapped “Thought for 4s”. The four steps and the reasoning open in place, where the line was, and everything under them moves down; the Dock does not move at all. That is the rule that replaced the canvas, seen from the other side: the THREAD carries the scroll. Nothing here scrolls inside anything else.">
          <Scene traceOpen anchor={1} />
        </State>
      </StateRow>
    </Section>

    <Section title="3 · Two things the advisor can do to their own turn" sub="Both were in the system and on no screen. MessageActions has offered Edit since v1 with nowhere to go; the composer's paperclip was a <div> and FileUpload has carried its staged parse since v7 with no way in.">
      <StateRow>
        <State label="editing the question" note="Edit under the last user bubble turns the bubble into the field — in place, the way the advisor knows it from every other assistant. Same peach, same edge, same 14/19; the tail corner squares off and the width is released. Cancel and Send are words, not ghost pills. The line underneath says what sending will destroy BEFORE it is destroyed, which MessageActions' contract has required since v1 and had nowhere to render.">
          <EditScene />
        </State>
        <State label="a file in the thread" tone="under" note="The paperclip opens the platform picker; the file lands in the thread as FileUpload and parses in stages. The stages ARE the summary arriving — not “uploaded successfully” but “read his Q3 statement · 14 pages · 18 holdings”. A failed stage keeps its place and carries its own retry, so an advisor retries the stage rather than re-uploading a 14-page statement. The journey that needs this is Meera's review; the control is live now so the two cannot drift apart again.">
          <FileScene />
        </State>
      </StateRow>
      <Note title="What Edit costs here, and why the answer is not thrown away first">
        Nothing is discarded when Edit is tapped &mdash; the answer, the allocation and the artifact all stay on
        screen while the question is being changed. They are replaced only when the edit is SENT, and the line under
        the field says so first. That is the same rule as <code>VersionRow</code>&rsquo;s revert, one level up:
        an advisory tool never destroys something the advisor might still need without saying so.
      </Note>
    </Section>

    <Section title="4 · What fits in 96 points" sub="Measured, and the reason the peek is a bar chart rather than the attribution chart made small.">
      <Note title="Recognition, not reading">
        <code>ArtifactCard</code>&rsquo;s peek is 96px fixed and its own header says why: the thread is 463&ndash;497px
        tall, so one taller card eats half of it. What is allowed there is a sparkline strip, a single stat row, or a
        bar chart of at most four rows &mdash; <code>readme.md:171</code> measured three rows at 62. The peek here is
        <code> ChartBar density=&quot;peek&quot;</code>: three ranked bars, direct-labelled to one decimal, one colour.
        Rule 1 &mdash; the label carries the identity, never the hue.
      </Note>
      <Note title="Why not the attribution chart, made small">
        <code>AttributionChart</code> carries a Target caption, a hairline, a note under every bar and a count-up from 62
        to 71. That is the expanded artifact &mdash; screen 4 &mdash; and at 96px it would be cropped mid-note, which is
        the &ldquo;chart with axes&rdquo; the peek rule forbids. One thing the peek gives up on purpose: the chart marks
        his July top-up as <em>a decision of yours</em> in de-emphasis grey. Three bars in one colour cannot say that,
        and should not try &mdash; the sentence above the card already has.
      </Note>
      <Note title="The trace under the answer">
        The product leaves a finished trace at one line &mdash; &ldquo;Thought for 4s &rsaquo;&rdquo; &mdash; and until
        today a frozen specimen could not show that. <code>ProgressTrace</code> gained <code>initialCollapsed</code>,
        honoured only when the trace is already past its last step; every existing call site renders unchanged.
        Added to the system first, with its contract and a spec-page variant, then used here.
      </Note>
    </Section>

    <Section title="5 · The states this screen does not have">
      <Note title="No empty, no separate loading">
        The screen is only ever reached with a question asked and a trace finished. Loading is screen 2; the one
        part that can still be arriving is the artifact, and that is the <em>filling</em> state above.
      </Note>
      <Note title="No refusal">
        The router decided this was a drift question before the trace ran. A refusal is a reply in the thread, before
        any of this, never an answer that then takes itself back.
      </Note>
    </Section>

    <Section title="6 · Motion, and what each one does under reduced motion" sub="Nothing on this page moves — the phones are frozen. The live prototype plays every row below, and is where to check them.">
      <MotionTable rows={MOTION} />
    </Section>

    <Section title="7 · Provenance">
      <ProvenanceTable rows={PROVENANCE} />
    </Section>
  </ScreenShell>
);
</script></body></html>
