<script type="text/babel" data-presets="react">
/* thread.jsx and answer.jsx compile into this same scope — Thread, AnswerTurn, AnswerActions and the
   DRIFT_* data are already globals here. Only the names this file adds are destructured. */
const { Composer, UserBubble, MessageActions, ProgressTrace, ExplainerSheet, FileUpload, Pill } = window.SentinelDesignSystem_0682a2;

/* Frozen: the trace is past its last step and collapsed to its one-line resting state, which is where the
   product leaves it while the answer is read. */
const Trace = ({ open = false }) => <ProgressTrace steps={DRIFT_STEPS} reasoning={DRIFT_REASONING} autoplay={false} initialActive={4} seconds={4} initialCollapsed={!open} />;
const Ask = ({ about = false }) => <Composer value="" onChange={() => {}} placeholder={about ? 'Ask about this' : 'Ask Sentinel'} onSend={() => {}} onAttach={() => {}} />;

/* THE DOCK CARRIES THE COMPOSER AND NOTHING ELSE. The chips and the CTA are inside the turn, so they
   scroll with the message that offered them. */
function Scene({ artifact = 'peek', view = 'chart', traceOpen = false, holdings = true, anchor, atCard = false }) {
  const card = React.useRef(null);
  return (
    <Thread anchor={atCard ? card : anchor} composer={<Ask about={artifact === 'expanded'} />}>
      <UserBubble text={DRIFT_ASK} />
      <Trace open={traceOpen} />
      <AnswerTurn artifact={artifact} view={view} cardRef={card}
        actions={artifact === 'filling' ? undefined : <AnswerActions holdings={holdings} />} />
    </Thread>
  );
}

/* Mounted with the sheet CLOSED and opened by the chip — the only way the dialog contract arms. */
function LiveScene() {
  const [why, setWhy] = React.useState(false);
  const [state, setState] = React.useState('peek');
  const [view, setView] = React.useState('chart');
  const scroller = React.useRef(null);
  const card = React.useRef(null);
  const saved = React.useRef(null);
  const toggle = () => {
    const el = scroller.current, c = card.current;
    if (state === 'peek') {
      if (el && c) saved.current = el.scrollTop;
      setState('expanded');
      requestAnimationFrame(() => { if (el && c) el.scrollTo({ top: el.scrollTop + (c.getBoundingClientRect().top - el.getBoundingClientRect().top) - 16, behavior: 'smooth' }); });
    } else {
      setState('peek'); setView('chart');
      requestAnimationFrame(() => requestAnimationFrame(() => { if (el && saved.current != null) el.scrollTo({ top: saved.current, behavior: 'smooth' }); }));
    }
  };
  return (
    <div style={{ position: 'relative', height: '100%', width: '100%' }}>
      <Thread scrollRef={scroller} anchor="bottom" composer={<Ask about={state === 'expanded'} />}>
        <UserBubble text={DRIFT_ASK} />
        <Trace />
        <AnswerTurn artifact={state} view={view} run cardRef={card} onToggle={toggle}
          onMenu={() => setView((v) => (v === 'table' ? 'chart' : 'table'))}
          actions={<AnswerActions onWhy={() => setWhy(true)} onHoldings={() => { if (state === 'peek') toggle(); setView('table'); }} />} />
      </Thread>
      <ExplainerSheet open={why} title={WHY_71.title} body={WHY_71.body} onClose={() => setWhy(false)} />
    </div>
  );
}

/* Edit is reached the way the product reaches it: by tapping Edit under the bubble. */
function EditScene() {
  const [editing, setEditing] = React.useState(false);
  const [text, setText] = React.useState(DRIFT_ASK);
  return (
    <Thread anchor="bottom" composer={<Ask />}>
      <UserBubble text={text} editing={editing} onChange={setText} onCancel={() => { setText(DRIFT_ASK); setEditing(false); }} onSave={() => setEditing(false)}
        costNote="Sending this replaces the answer below it." />
      {!editing && <MessageActions role="user" onAction={() => setEditing(true)} />}
      <Trace />
      <AnswerTurn artifact="peek" actions={<AnswerActions />} />
    </Thread>
  );
}

/* The stages are what this product actually does to a statement, in its own words. */
const PARSE = [
  { label: 'Read the file', state: 'done', meta: '14 pages' },
  { label: 'Found the holdings', state: 'done', meta: '18 funds' },
  { label: 'Checked them against his mandate', state: 'done', meta: '3 outside it' },
];
function FileScene() {
  const [file, setFile] = React.useState({ name: 'Sharma-Q3.pdf', meta: '14 pages · 1.2 MB · just now' });
  return (
    <Thread anchor="bottom" composer={<Composer value="" onChange={() => {}} placeholder="Ask Sentinel" onSend={() => {}}
      onAttach={(f) => setFile({ name: f.name, meta: `${Math.max(1, Math.round(f.size / 1024))} KB · just now` })} />}>
      <UserBubble text={DRIFT_ASK} />
      <Trace />
      <AnswerTurn artifact="peek" actions={<AnswerActions />} />
      <UserBubble text="Here is his Q3 statement." />
      <FileUpload file={file} stages={PARSE} state="done" summary="Read his Q3 statement · 14 pages · 18 holdings" onRemove={() => {}} />
      
    </Thread>
  );
}

const MOTION = [
  ['Answer arrives', <span><code>ds-rise</code>: fade + 8px rise</span>, '240ms', 'Fades in place, no rise'],
  ['Allocation bar', <span><code>ds-grow</code>: scaleX 0 → 1, 120ms stagger</span>, '480ms', 'Drawn at full width — the keyframe is redefined to scaleX(1)'],
  ['Artifact card arrives', <span><code>ds-artifact</code>: fade + scale 0.96 → 1</span>, '300ms', 'Fade only — the card carries its own redefinition'],
  ['Peek bars grow', 'scaleX from the left, 60ms stagger', '480ms', 'Instant — every transition is cut to 1ms'],
  ['Chips and the CTA arrive', <span><code>ds-rise</code>, 60ms stagger, with the message</span>, '240ms', 'Fade only'],
  ['Expand', 'natural height; the chevron rotates 180°; 62 → 71 counts up', '320 · 600ms', 'Height changes; the chevron flips; the number lands'],
  ['The two thread scrolls', 'card header under the app bar on expand; back to the card on collapse', 'smooth', <span>Instant — <code>scroll-behavior: auto</code></span>],
  ['Chart ⇄ table', 'the card’s content is replaced in place; the height follows', 'immediate', 'Unchanged — there is no animation to drop'],
  ['Explainer sheet', <span><code>ds-sheet</code>: translateY 100% → 0; scrim <code>ds-scrim</code> to 0.4</span>, '300ms', 'Fade only'],
  ['Edit in place', 'the bubble becomes the field', 'none', 'Unchanged — deliberately: a field that animates in is a field you type into late'],
];

const PROVENANCE = [
  ['62% → 71%, against 60%', 'His Q2 and Q3 statements, against the mandate on file', 'The trace’s reasoning, the card’s title, and the chart’s first and last rows'],
  ['Equity 71 · Debt 24 · Cash 5', 'His Q3 statement', <span>The allocation card, with <code>Provenance</code> under it</span>],
  ['+6.1 · +2.0 · +0.9', <span>The archive’s own <em>illustration</em> of the headline — <code>Chat.tsx:42</code> marks the split “[draft] … illustrative demo figures”. The headline (62 → 71, two-thirds the rally) is the product’s</span>, 'Direct-labelled at each bar, and again as rows in the table view'],
  ['“two of every three points”', '6.1 of 9.0 points — 68%', 'The first sentence of the answer'],
  ['“11 points more”', '71 against 60', 'The explainer sheet’s first paragraph'],
  ['14 pages · 18 funds · 3 outside it', 'The statement the advisor attached, as it is read', 'The parse stages on the file card, right-aligned and tabular'],
];

mountScreen(
  <ScreenShell
    journey="Journey B · Sharma’s drift" n="Thread · the answer" name="The answer, and the artifact"
    job="The answer, the position it describes, and the object it produced — then the same object opened in place. One screen, because the card expands where it is: there is no second surface to draw."
    without="gets a number with no reason, and cannot check what produced it."
  >
    <Section title="1 · The screen" sub="Answer, allocation, artifact at its 96pt peek, then what the advisor is offered. All of it inside the conversation — the Dock carries the composer and nothing else.">
      <StateRow>
        <State label="typical · as the answer lands" note="The trace rests at one line and the turn is signed once — “✦ Sentinel” at the top, not again above the answer. The turn is taller than the thread, so the thread rests with its FIRST line on screen rather than its last: sticking to the bottom scrolled the sentence away while it was being read.">
          <Scene />
        </State>
        <State label="typical · scrolled down" note="The same screen after the advisor scrolls. The artifact at 96pt — three bars, one colour, labelled — then the two chips and the CTA, which sit in the conversation and scroll away with it. Nothing is pinned above the composer.">
          <Scene anchor="bottom" />
        </State>
        <State label="live · tap everything" note="The chip opens the explainer; the card expands in place and the thread brings its header under the app bar; the ⋯ swaps the chart for its table; collapse returns to where the card was. Watch the composer: “Ask about this” while the card is open.">
          <LiveScene />
        </State>
      </StateRow>
      <Note title="Why the chips and the CTA moved out of the Dock">
        A pinned chip outlives the turn that offered it. Scroll back through three answers and the row above the
        composer still shows the last one&rsquo;s options, so the advisor cannot tell which answer they belong to, and
        the screen reads as a toolbar rather than a conversation. In the thread they are part of the message: they
        arrive with it, and they leave with it. <strong>Rule 3 is untouched</strong> &mdash; the composer is still
        docked on every screen and nothing replaces it. <code>Dock.d.ts</code> now marks the two slots deprecated and
        says why the journey rail is migrated deliberately rather than broken.
      </Note>
      <Note title="One door to one thing">
        The card&rsquo;s footer used to carry <em>Why?</em> while the Dock carried <em>Why is 71% a problem?</em> &mdash;
        two controls, one sheet, one screen. The footer&rsquo;s is gone. A question in the advisor&rsquo;s own words is a
        better door than a single word, and it is the one that reads aloud.
      </Note>
    </Section>

    <Section title="2 · Opened, in place" sub="The same card, expanded. It takes its content’s natural height and the THREAD carries the scroll — there is no canvas, so there is nowhere to go back from, and no second screen to draw.">
      <StateRow>
        <State label="expanded" note="Plot 180 and a 14pt axis band. “He agreed to 60%” above the hairline, three things that moved it, “he is at 71%” at display size. The middle bar is grey with a hairline outline because it was his own instruction — de-emphasis, never a second hue (rule 1). The card is 475pt in a 462pt thread, so the thread scrolls and the card never does.">
          <Scene artifact="expanded" atCard />
        </State>
        <State label="the table view" note="From the ⋯. The same three numbers as rows, each keeping the line the chart draws under its bar, so nothing is lost by reading instead of looking. The system’s own rule: no value is ever reachable only by touching a coloured shape.">
          <Scene artifact="expanded" view="table" atCard />
        </State>
        <State label="filling" tone="under" note="The sentence has arrived and the breakdown has not. The card is its own shape, shimmering, so the advisor already knows what is coming; it has no provenance line yet because there is nothing to attribute, and no chips, because a door to something that has not arrived opens onto a skeleton.">
          <Scene artifact="filling" anchor="bottom" />
        </State>
      </StateRow>
    </Section>

    <Section title="3 · When something does not arrive, and when the trace is reopened">
      <StateRow>
        <State label="artifact failed" tone="over" note="The answer stands — the mix is known from the statement — and the card does not pretend. The failure is said as text on the same surface (rule 2), it says what survived, and Try again sits on the message that owns it. “Show the 18 holdings” goes, because the holdings did not arrive; the 71% question stays, because 71 is still true.">
          <Scene artifact="failed" holdings={false} anchor="bottom" />
        </State>
        <State label="trace reopened" tone="under" note="The advisor tapped “Thought for 4s”. The four steps and the reasoning open where the line was, and everything below moves down. The Dock does not move at all. That is the rule that replaced the canvas, from the other side: the thread carries the scroll.">
          <Scene traceOpen anchor={1} />
        </State>
      </StateRow>
    </Section>

    <Section title="4 · Two things the advisor can do to their own turn" sub="Both were in the system and on no screen until today — MessageActions had offered Edit since v1 with nowhere to go, and the composer’s paperclip was a drawing.">
      <StateRow>
        <State label="editing the question" note="Edit turns the bubble into the field, in place. Same peach, same edge, same type; the tail corner squares off and the width is released. Cancel and Send are words, not ghost pills. The line underneath says what sending will destroy before it is destroyed — and nothing is destroyed until it is sent.">
          <EditScene />
        </State>
        <State label="a file the advisor attached" tone="under" note="It arrives at the END of the thread, like any message, and sits on the ADVISOR'S side, capped like their bubble — it is their message, not Sentinel's reply. The stages are what Sentinel did to it, kept inside the card because the advisor is looking at the file while it is read. The summary is the outcome in their world: not “uploaded successfully” but “read his Q3 statement · 14 pages · 18 holdings”.">
          <FileScene />
        </State>
      </StateRow>
    </Section>

    <Section title="5 · What this screen does not have, and what it will not invent">
      <Note title="“Show the 18 holdings” has no data, and inventing it would be the worst thing on this page">
        The chip is the archive&rsquo;s (<code>Chat.tsx:363</code>) and it opened the canvas, which no longer exists.
        Its real destination is a table of Sharma&rsquo;s eighteen funds, and the archive holds no holdings for him:
        the eight rows in <code>journeys.tsx:396</code> are <strong>Meera&rsquo;s</strong>, from the review journey, and
        43 funds rather than 18. Those rows under his name are exactly the figure an advisor would read to a client.
        Today the chip opens the chart&rsquo;s own table. It needs his holdings. Gap G7 in <code>SCREENS-PLAN.md</code>.
      </Note>
      <Note title="No empty, no separate loading, no refusal">
        The screen is only reached with a question asked and a trace finished, so there is nothing to show before it.
        The one part that can still be arriving is the artifact, which is <em>filling</em> above. A refusal happens at
        the router, before the trace runs, and renders as a reply — never as an answer that takes itself back.
      </Note>
      <Note title="Why the waiting phase is a page of its own and this expanded card is not">
        Ruling 5 says a state of a screen is not a screen, and the expanded artifact obeys it: same controls,
        same dock, same turn &mdash; only a card&rsquo;s height changes. <strong>Waiting is different.</strong> It
        changes the CONTROL SET: the send slot becomes Stop, which is the only moment in the product when the
        composer cannot send, and the turn carries Continue and Try again, which no other phase can reach. A
        different control set is a different thing to design and to test; a different height is not. So the pages
        in <code>screens/</code> are named for a <strong>surface and a phase</strong> &mdash; Thread &middot; while
        it works, Thread &middot; the answer &mdash; and the seven numbered steps stay on <code>flow.html</code>,
        where they belong: a step is a moment in Sharma&rsquo;s story, not a screen. <code>docs/APP-PLAN.md</code> &sect;1.
      </Note>
      <Note title="No shared-element transition, and no back arrow">
        The card expands where it is. Nothing flies from a card into a page, because the page it used to fly to was
        deleted in v5 — and for the same reason there is no <em>&lsquo; Back to chat</em>: the thread never left.
        This is also why screens 3 and 4 of the flow are one page: a state of a screen is not a screen.
      </Note>
    </Section>

    <Section title="6 · Motion, and what each one does under reduced motion">
      <MotionTable rows={MOTION} />
    </Section>

    <Section title="7 · Provenance">
      <ProvenanceTable rows={PROVENANCE} />
    </Section>
  </ScreenShell>
);
</script></body></html>
