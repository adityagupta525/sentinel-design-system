name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Barrel is up to date with the components on disk
        run: |
          npm run build:barrel
          git diff --exit-code design-system/index.js design-system/index.d.ts \
            || { echo '::error::index.js/index.d.ts are stale — run npm run build:barrel'; exit 1; }

      - name: Bundle is up to date with the components on disk
        run: |
          npm run build:bundle
          git diff --exit-code design-system/_ds_bundle.js \
            || { echo '::error::_ds_bundle.js is stale — run npm run build:bundle'; exit 1; }

      - name: The component index is current
        # build-index stamps `generated` with today's date. On any day after the commit that line
        # differs and nothing else does, so it is the one line this diff ignores — every row, count
        # and literal is still compared.
        run: |
          npm run build:index
          git diff --exit-code -I '^ *"generated":' design-system/pages/_index.json \
            || { echo '::error::_index.json is stale — run npm run build:index'; exit 1; }

      - name: sentinel-craft's scale still matches the tokens
        run: |
          npm run build:scale
          git diff --exit-code .claude/skills/sentinel-craft/references/scale.md \
            || { echo '::error::scale.md is stale — run npm run build:scale'; exit 1; }

      - name: design-system matches its recorded baseline
        run: npm run check:integrity

      - name: Token and import adherence
        run: npm run lint:adherence

      - name: Screens are held to the same adherence rules as the system
        run: npm run lint:adherence:screens

      - name: A screen may not name what the system does not export
        run: node tools/check-parallel.mjs
      - name: The gutter guard can still fail
        # A guard that has never been seen to fail is not a guard. This runs it against a fixture
        # carrying the exact defect it was written for, and against the same markup fixed.
        run: node tools/check-previews.mjs --self-test

      - name: Every preview page renders without a console error
        run: node tools/check-previews.mjs
