<!-- @dsCard group="Probe" viewport="1400x900" name="Nia probe — FAILING fixture" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Nia probe — broken</title>
<link rel="stylesheet" href="/design-system/styles.css">
<style>
  body { margin: 0; background: var(--color-desk); }
  .phone { width: 375px; height: 812px; overflow: hidden; border-radius: 44px; background: var(--color-canvas); position: relative; margin: 20px; }
  .pad { padding: 24px; }
  .row { display: flex; gap: 4px; align-items: center; margin-bottom: 12px; }
</style></head>
<body>
<div id="root">
<div class="phone"><div class="pad">

  <!-- D1 · an enabled button with NO accessible name. Must be caught. -->
  <button id="unnamed" style="width:42px;height:42px;border-radius:50%;background:#eee;border:none">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9h12" stroke="#251F1B" stroke-width="1.5"/></svg>
  </button>

  <!-- D2 · a control inside a control. Must be caught.
       NOTE: written literally, the HTML PARSER unnests this — the inner button becomes a sibling and
       the defect disappears before the probe can see it. React does not go through the parser, which
       is why `<button> cannot appear as a descendant of <button>` is a React warning and not a parse
       error. So the fixture builds it by appendChild, which is what React does. -->
  <div id="nesthost" style="margin-top:12px"></div>
  <script>
    var outer = document.createElement('button');
    outer.id = 'outer'; outer.setAttribute('aria-label', 'Open the card');
    outer.setAttribute('style', 'display:block;width:300px;padding:12px;text-align:left');
    outer.appendChild(document.createTextNode('Card body '));
    var inner = document.createElement('button');
    inner.id = 'inner'; inner.setAttribute('aria-label', 'Download');
    inner.setAttribute('style', 'height:44px');
    inner.textContent = 'Download';
    outer.appendChild(inner);
    document.getElementById('nesthost').appendChild(outer);
  </script>

  <!-- D3 · a target well under 44 in BOTH axes, with no hit extension. Must be caught. -->
  <div class="row">
    <button id="tiny" aria-label="Tiny target" style="width:20px;height:20px;border:none;background:#ccc">x</button>
  </div>

  <!-- D3 · a 28px box whose ::before floor is eaten by a neighbour painted on top. -->
  <div class="row" style="position:relative">
    <button id="eaten" aria-label="Eaten target" class="ds-pressable" data-hit
            style="position:relative;width:60px;height:28px;--hit-x:0px;--hit-y:8px;border:none;background:#ddd">eat</button>
    <div style="position:absolute;left:0;right:0;top:-9px;height:9px;background:rgba(0,0,0,0.02);z-index:5"></div>
    <div style="position:absolute;left:0;right:0;bottom:-9px;height:9px;background:rgba(0,0,0,0.02);z-index:5"></div>
  </div>

  <!-- contrast · a pair that fails AA badly: light bronze body text on white. -->
  <p id="lowcontrast" style="background:#ffffff;color:#c9b9a8;font:400 14px/20px var(--font-ui);padding:8px">
    This 14px line is well under 4.5:1 and must be reported.
  </p>

  <!-- contrast · a white label on a GRADIENT. backgroundColor is transparent here, so a probe that
       reads backgroundColor scores it against the card and passes it. The worst stop must be used. -->
  <div id="gradbtn" style="background:linear-gradient(180deg, rgb(230,220,210) 0%, rgb(180,150,120) 100%);padding:12px;border-radius:16px">
    <span style="color:#ffffff;font:500 14px/20px var(--font-ui)">White on a gradient — worst stop</span>
  </div>

</div></div>
</div>
</body></html>
