<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing in use" subtitle="A thread slice: 16px gutter, 12px stack, 10px label gap" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--color-canvas);font-family:var(--font-ui);color:var(--color-ink)}.sw{display:flex;gap:10px}.s{flex:1;min-width:0}.s i{display:block;height:56px;border-radius:12px;box-shadow:0 0 0 1px rgba(37,31,27,.08)}.s b{display:block;margin-top:6px;font:700 11px/1.3 var(--font-ui);color:var(--color-ink)}.s small{display:block;font:500 10px/1.3 var(--font-ui);color:var(--color-muted)}.row{display:flex;gap:12px;align-items:center}.k{font:700 10px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--color-muted)}a{color:var(--color-bronze-deep)}a:hover{color:var(--color-bronze)}</style></head><body><div style="width:343px;position:relative;display:flex;flex-direction:column;gap:12px;padding:0 16px;outline:1px dashed var(--color-bronze);outline-offset:0">
<div style="display:flex;justify-content:flex-end"><div style="max-width:280px;border-radius:20px 20px 6px 20px;background:var(--color-bubble);padding:10px 12px;box-shadow:0 0 0 1px var(--color-bubble-edge);font:600 14px/19px var(--font-ui)">What would fixing it cost?</div></div>
<div><div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><span style="width:18px;height:18px;border-radius:50%;background:var(--surface-avatar)"></span><span style="font:700 12px/16px var(--font-ui);color:var(--color-muted)">Sentinel</span></div><p style="margin:0;font:500 14px/20px var(--font-ui);color:var(--color-ink-soft)">Two moves, not seven.</p></div>
<div style="display:flex;gap:8px"><span style="height:36px;padding:0 13px;border-radius:9999px;background:var(--color-selected);box-shadow:0 0 0 1px var(--color-bubble-edge);font:700 12px/36px var(--font-ui)">Fix it</span><span style="height:36px;padding:0 13px;border-radius:9999px;background:var(--color-chip);box-shadow:0 0 0 1px var(--color-bubble-edge);font:700 12px/36px var(--font-ui);color:var(--color-bronze-deep)">Show the five we skipped</span></div></div></body></html>
