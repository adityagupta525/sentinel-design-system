<!-- @dsCard group="Effects" viewport="700x170" name="Shadows & rings" subtitle="Cards barely lift; only the composer and floating disc cast depth" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--color-canvas);font-family:var(--font-ui);color:var(--color-ink)}.sw{display:flex;gap:10px}.s{flex:1;min-width:0}.s i{display:block;height:56px;border-radius:12px;box-shadow:0 0 0 1px rgba(37,31,27,.08)}.s b{display:block;margin-top:6px;font:700 11px/1.3 var(--font-ui);color:var(--color-ink)}.s small{display:block;font:500 10px/1.3 var(--font-ui);color:var(--color-muted)}.row{display:flex;gap:12px;align-items:center}.k{font:700 10px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--color-muted)}a{color:var(--color-bronze-deep)}a:hover{color:var(--color-bronze)}</style></head><body><div class="row" style="gap:20px;align-items:flex-end"><div style="text-align:center"><div style="width:88px;height:56px;background:#fff;border-radius:16px;box-shadow:var(--shadow-card)"></div><b style="display:block;margin-top:10px;font:700 11px var(--font-ui)">card</b><small class="k" style="letter-spacing:0">0 1 2 / 5%</small></div><div style="text-align:center"><div style="width:88px;height:56px;background:#fff;border-radius:16px;box-shadow:var(--shadow-composer)"></div><b style="display:block;margin-top:10px;font:700 11px var(--font-ui)">composer</b><small class="k" style="letter-spacing:0">16 30 -18 / 24% + 2 4 / 5%</small></div><div style="text-align:center"><div style="width:88px;height:56px;background:#fff;border-radius:16px;box-shadow:var(--shadow-float)"></div><b style="display:block;margin-top:10px;font:700 11px var(--font-ui)">float</b><small class="k" style="letter-spacing:0">4 12 -4 / 24%</small></div><div style="text-align:center"><div style="width:88px;height:56px;background:#fff;border-radius:16px;box-shadow:var(--shadow-bar)"></div><b style="display:block;margin-top:10px;font:700 11px var(--font-ui)">bar</b><small class="k" style="letter-spacing:0">2 8 -2 / 12%</small></div><div style="text-align:center"><div style="width:88px;height:56px;background:#fff;border-radius:16px;box-shadow:var(--focus-ring)"></div><b style="display:block;margin-top:10px;font:700 11px var(--font-ui)">focus ring</b><small class="k" style="letter-spacing:0">3px bronze 24%</small></div><div style="text-align:center"><div style="width:88px;height:56px;background:#fff;border-radius:16px;box-shadow:0 0 0 1px var(--color-line)"></div><b style="display:block;margin-top:10px;font:700 11px var(--font-ui)">ring line</b><small class="k" style="letter-spacing:0">1px #e1deda</small></div></div></body></html>
