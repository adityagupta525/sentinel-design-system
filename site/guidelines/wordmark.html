@keyframes sentinel-shimmer{0%{opacity:.35}50%{opacity:1}100%{opacity:.35}}
@keyframes dot-pulse{0%,100%{opacity:.28}50%{opacity:1}}
@keyframes ds-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ds-fade{from{opacity:0}to{opacity:1}}
@keyframes ds-scrim{from{opacity:0}}
@keyframes ds-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ds-screen-in{from{transform:translateX(100%);opacity:.6}to{transform:none;opacity:1}}
@keyframes ds-screen-out{from{transform:translateX(0)}to{transform:translateX(-30%)}}
@keyframes ds-table-nudge{0%{transform:translateX(0)}35%{transform:translateX(-10px)}100%{transform:translateX(0)}}
@keyframes ds-splash-leave{from{opacity:1}to{opacity:0}}
.ds-splash .ds-splash-solid{animation:ds-fade var(--dur-enter) var(--ease) both}
.ds-splash .ds-splash-dots{animation:ds-splash-leave var(--dur-enter) var(--ease) both}
.ds-table-nudge>*{animation:ds-table-nudge 640ms var(--ease) both}
.ds-pressable{outline:none}
.ds-pressable:focus-visible{outline:var(--border-focus-width) solid var(--border-focus);outline-offset:2px;box-shadow:var(--focus-ring)}
.ds-pressable[data-hit]::before{content:"";position:absolute;left:calc(-1 * var(--hit-x));right:calc(-1 * var(--hit-x));top:calc(-1 * var(--hit-y));bottom:calc(-1 * var(--hit-y))}
.ds-pill::before{content:"";position:absolute;left:0;right:0;top:calc(-1 * var(--hit));bottom:calc(-1 * var(--hit))}
.ds-pill:focus-visible,
.ds-listrow:focus-visible{outline:var(--border-focus-width) solid var(--border-focus);outline-offset:2px;box-shadow:var(--focus-ring)}
.ds-composer-input::placeholder{color:var(--color-muted)}
@media (prefers-reduced-motion:reduce){
@keyframes sentinel-shimmer{0%,100%{opacity:1}}
@keyframes dot-pulse{0%,100%{opacity:1}}
@keyframes ds-rise{from{opacity:0}to{opacity:1}}
@keyframes ds-grow{from{transform:scaleX(1)}to{transform:scaleX(1)}}
@keyframes ds-screen-in{from{opacity:0;transform:none}to{opacity:1;transform:none}}
@keyframes ds-screen-out{from{transform:none}to{transform:none}}
*,*::before,*::after{transition-duration:1ms!important;scroll-behavior:auto!important}
@keyframes ds-table-nudge { 0%, 100% { transform: none; } }
@keyframes ds-splash-leave { from { opacity: 1; } to { opacity: 0; } }
}
