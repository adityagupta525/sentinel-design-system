@keyframes sentinel-shimmer{0%{opacity:.35}50%{opacity:1}100%{opacity:.35}}

@keyframes ds-fade{from{opacity:0}to{opacity:1}}
@keyframes ds-scrim{from{opacity:0}}

@keyframes ds-screen-out{from{transform:translateX(0)}to{transform:translateX(-30%)}}

.ds-pill:focus-visible,
.ds-listrow:focus-visible{outline:var(--border-focus-width) solid var(--border-focus);outline-offset:2px;box-shadow:var(--focus-ring)}
.ds-composer-input::placeholder{color:var(--color-muted)}

@keyframes ds-screen-in{from{opacity:0;transform:none}to{opacity:1;transform:none}}

*,*::before,*::after{transition-duration:1ms!important;scroll-behavior:auto!important}
@keyframes ds-table-nudge { 0%, 100% { transform: none; } }
@keyframes ds-splash-leave { from { opacity: 1; } to { opacity: 0; } }
