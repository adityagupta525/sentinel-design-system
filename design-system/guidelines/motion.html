<!-- @dsCard group="Effects" viewport="700x150" name="Motion" subtitle="One ease [0.2, 0.8, 0.2, 1] · durations 150–600ms · bars grow by scaleX" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--color-canvas);font-family:var(--font-ui);color:var(--color-ink)}.sw{display:flex;gap:10px}.s{flex:1;min-width:0}.s i{display:block;height:56px;border-radius:12px;box-shadow:0 0 0 1px rgba(37,31,27,.08)}.s b{display:block;margin-top:6px;font:700 11px/1.3 var(--font-ui);color:var(--color-ink)}.s small{display:block;font:500 10px/1.3 var(--font-ui);color:var(--color-muted)}.row{display:flex;gap:12px;align-items:center}.k{font:700 10px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--color-muted)}a{color:var(--color-bronze-deep)}a:hover{color:var(--color-bronze)}</style></head><body><div class="row" style="gap:24px;align-items:flex-start">
<div><b style="font:700 12px var(--font-ui)">press</b><br><span class="k">150ms · scale .98 (.94 icon)</span></div>
<div><b style="font:700 12px var(--font-ui)">enter</b><br><span class="k">240ms · fade + 8px rise, 60ms stagger</span></div>
<div><b style="font:700 12px var(--font-ui)">screen</b><br><span class="k">320ms · slide 100% / -30%</span></div>
<div><b style="font:700 12px var(--font-ui)">canvas</b><br><span class="k">380ms · scale .96 → 1, origin 40%</span></div>
<div><b style="font:700 12px var(--font-ui)">bars</b><br><span class="k">480–500ms · scaleX from left</span></div>
<div><b style="font:700 12px var(--font-ui)">count-up</b><br><span class="k">600ms · cubic ease-out</span></div></div>
<div style="margin-top:18px;height:6px;width:320px;border-radius:9999px;background:var(--color-alloc-track);overflow:hidden"><div style="height:100%;background:var(--color-bronze);transform-origin:left;animation:ds-grow 480ms var(--ease) infinite alternate"></div></div></body></html>
