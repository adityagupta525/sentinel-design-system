<!-- @dsCard group="Colors" viewport="700x120" name="Lines & rings" subtitle="Hairlines and 1px rings — no drop shadows on rows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--color-canvas);font-family:var(--font-ui);color:var(--color-ink)}.sw{display:flex;gap:10px}.s{flex:1;min-width:0}.s i{display:block;height:56px;border-radius:12px;box-shadow:0 0 0 1px rgba(37,31,27,.08)}.s b{display:block;margin-top:6px;font:700 11px/1.3 var(--font-ui);color:var(--color-ink)}.s small{display:block;font:500 10px/1.3 var(--font-ui);color:var(--color-muted)}.row{display:flex;gap:12px;align-items:center}.k{font:700 10px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--color-muted)}a{color:var(--color-bronze-deep)}a:hover{color:var(--color-bronze)}</style></head><body><div class="sw"><div class="s"><i style="background:var(--color-line)"></i><b>--color-line</b><small>#e1deda · rings, rails</small></div><div class="s"><i style="background:var(--color-line-soft)"></i><b>--color-line-soft</b><small>#e9e6e2 · 0.5px row dividers (warmed)</small></div><div class="s"><i style="background:var(--color-bubble-edge)"></i><b>--color-bubble-edge</b><small>#ebd4c3 · ring on peach/chips</small></div><div class="s"><i style="background:var(--color-track)"></i><b>--color-track</b><small>#edebe7 · every bar track</small></div></div></body></html>
