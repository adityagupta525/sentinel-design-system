<!-- @dsCard group="Colors" viewport="700x120" name="Bronze" subtitle="The one hue that carries magnitude and accent" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--color-canvas);font-family:var(--font-ui);color:var(--color-ink)}.sw{display:flex;gap:10px}.s{flex:1;min-width:0}.s i{display:block;height:56px;border-radius:12px;box-shadow:0 0 0 1px rgba(37,31,27,.08)}.s b{display:block;margin-top:6px;font:700 11px/1.3 var(--font-ui);color:var(--color-ink)}.s small{display:block;font:500 10px/1.3 var(--font-ui);color:var(--color-muted)}.row{display:flex;gap:12px;align-items:center}.k{font:700 10px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--color-muted)}a{color:var(--color-bronze-deep)}a:hover{color:var(--color-bronze)}</style></head><body><div class="sw"><div class="s"><i style="background:var(--color-bronze)"></i><b>--color-bronze</b><small>#b69377 · bars, indicator, chevrons</small></div><div class="s"><i style="background:var(--color-bronze-deep)"></i><b>--color-bronze-deep</b><small>#715035 · chip labels, numerals</small></div><div class="s"><i style="background:var(--color-bronze-edge)"></i><b>--color-bronze-edge</b><small>#a07d5f · return key ring</small></div><div class="s"><i style="background:var(--surface-avatar)"></i><b>--surface-avatar</b><small>client initials disc</small></div><div class="s"><i style="background:var(--tint-bronze-focus)"></i><b>--tint-bronze-focus</b><small>composer focus ring</small></div></div></body></html>
