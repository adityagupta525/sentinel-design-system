<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--color-canvas);font-family:var(--font-ui);color:var(--color-ink)}.sw{display:flex;gap:10px}.s{flex:1;min-width:0}.s i{display:block;height:56px;border-radius:12px;box-shadow:0 0 0 1px rgba(37,31,27,.08)}.s b{display:block;margin-top:6px;font:700 11px/1.3 var(--font-ui);color:var(--color-ink)}.s small{display:block;font:500 10px/1.3 var(--font-ui);color:var(--color-muted)}.row{display:flex;gap:12px;align-items:center}.k{font:700 10px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--color-muted)}a{color:var(--color-bronze-deep)}a:hover{color:var(--color-bronze)}</style></head><body><div class="sw"><div class="s"><i style="background:var(--color-ink)"></i><b>--color-ink</b><small>#251f1b · primary</small></div><div class="s"><i style="background:var(--color-ink-soft)"></i><b>--color-ink-soft</b><small>#3d3630 · body</small></div><div class="s"><i style="background:var(--color-muted)"></i><b>--color-muted</b><small>#605954 · meta, eyebrows</small></div><div class="s"><i style="background:var(--color-data-deemph)"></i><b>--color-data-deemph</b><small>#a39a91 · disclosure</small></div></div></body></html>
