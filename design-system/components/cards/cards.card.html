<!-- @dsCard group="Components" viewport="700x760" name="Cards" subtitle="Allocation, hero number, moves, callouts, tables, sheet" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--color-canvas);padding:16px;font-family:var(--font-ui)}.g{display:grid;gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.lbl{font:700 10px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--color-muted);margin:0 0 6px}.col{width:343px}a{color:var(--color-bronze-deep)}a:hover{color:var(--color-bronze)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Eyebrow, EyebrowDivider, Provenance, DemoFooter, StandingDisclosure, ScreenBackdrop, StatusSpacer, HomeIndicator, TopBar, CanvasHeader, Dock, ScrollToBottomButton, Pressable, AnswerChip, ChipRow, ActionCard, DarkButton, SuggestionRow, DecisionsStrip, Composer, MoneyComposer, UserBubble, SentinelBlock, SentinelText, SentinelThinking, QAPair, ParseNote, DetourBanner, GreetingDivider, ProgressTrace, AllocationCard, HeroNumberCard, MoveCard, ConstraintCallout, RejectCallout, DisclosureBlock, DataTableCard, ExplainerSheet, ProgressRail, ConcentrationBar, Dumbbell, AttributionChart, DrawnCheck, IconPlus, IconMenu, IconChevronRight, IconAttach, IconArrow, IconSparkle, Pill, Badge } = window.SentinelDesignSystem_0682a2;
const L = ({t}) => <p className="lbl">{t}</p>;

const seg=[{label:'Equity',value:71,color:'var(--color-alloc-equity)'},{label:'Debt',value:24,color:'var(--color-alloc-debt)'},{label:'Cash',value:5,color:'var(--color-alloc-cash)'}];
const rows=[['Parag Parikh Flexi Cap','Flexi cap','22%','₹5,50,000'],['HDFC Large Cap','Large cap','18%','₹4,50,000'],['ICICI Corporate Bond','Debt','30%','₹7,50,000']].map(r=>({name:<div style={{minWidth:0}}><p style={{margin:0,font:'600 13px var(--font-ui)',color:'var(--color-ink)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r[0]}</p><div style={{marginTop:3}}><Badge>{r[1]}</Badge></div></div>,share:<span style={{font:'500 13px var(--font-ui)'}}>{r[2]}</span>,amount:<span style={{font:'500 13px var(--font-ui)'}}>{r[3]}</span>}));
const App = () => <div className="g" style={{gridTemplateColumns:'343px 1fr',gap:16,alignItems:'start'}}>
  <div className="g"><AllocationCard segments={seg} /><HeroNumberCard title="Meera's risk number" meta="Locked · 15 Sep 2026" value={54} badge="Moderate" copy="We look at three things and go with the lowest of them." rows={[{label:'What her finances can absorb',value:71},{label:'What she can sit through calmly',value:54,binding:true},{label:'What her ₹2 crore goal needs',value:62}]} /><MoveCard n={1} title="Move ₹1,85,000 out of Quant Small Cap" body="Into ICICI Corporate Bond. Brings equity from 67% to 58%." /></div>
  <div className="g"><ConstraintCallout eyebrow="Cannot build this" body="Four funds will not fit. One of them would have to hold 34% of his money — past the 25% ceiling on any single fund." /><RejectCallout eyebrow="That does not fit" body="₹60,00,000 is above the ₹50 L ceiling on Meera's mandate. I have not applied it." chips={['Use ₹50 L','Raise the mandate first']} /><DisclosureBlock /><DataTableCard title="Where ₹25 lakh would go" meta="6 funds" description="Chosen from 312 funds that pass your compliance shelf." filters={<div className="row"><Pill label="All 6" size="sm" tone="filter" selected /><Pill label="Equity" size="sm" tone="filter" /></div>} columns={[{key:'name',header:'Fund'},{key:'share',header:'Share',align:'right'},{key:'amount',header:'Amount',align:'right'}]} rows={rows} footer="No fund crosses 25%" showAll="Show all 6" /></div>
</div>;
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
