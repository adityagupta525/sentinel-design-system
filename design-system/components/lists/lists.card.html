<!DOCTYPE html><html><head><meta charset="utf-8"><title>Lists</title><link rel="stylesheet" href="../../styles.css">

<style>html,body{margin:0;background:var(--color-canvas);font-family:var(--font-ui)}#root{padding:24px}.g{display:grid;grid-template-columns:343px 343px;gap:24px;align-items:start}.lbl{font:700 10px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--color-muted);margin:0 0 8px}.note{font:400 11px/15px var(--font-ui);color:var(--color-data-deemph);margin:8px 0 0}a{color:var(--color-bronze-deep)}a:hover{color:var(--color-bronze)}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { List, ListRow, ClientChip, Pill, SearchField } = window.SentinelDesignSystem_0682a2;
const L = ({t}) => <p className="lbl">{t}</p>;
const App = () => {
  const [q,setQ] = React.useState('');
  const [sel,setSel] = React.useState(1);
  return <div className="g">
    <div>
      <L t="List · saved work, progress hints" />
      <List header="Saved work" rowProps={{variant:'nav', trailing:'chevron'}}
        items={[{title:"Meera's risk profile", meta:'Step 7 of 16'},{title:'₹25 L proposal', meta:'Draft · 2 funds'},{title:"Sharma's rebalance", meta:'2 moves'}]}

      <p className="note">Capped with a footer row, never independently scrollable — one scroll per surface.</p>
    </div>
    <div>
      <L t="ListRow · relative time and a bound client" />
      <List dividers="inset" emptyState={{title:'No threads yet'}}>
        <ListRow variant="nav" title="Why did Sharma's portfolio drift…" chip={<ClientChip name="R. Sharma" />} meta="2h ago" trailing="meta" onPress={()=>{}} />
        <ListRow variant="nav" title="Diwali offer from HDFC AMC" meta="Yesterday" trailing="meta" onPress={()=>{}} />

    </div>
    <div>
      <L t="ListRow · select, action, static" />

      <p className="note">Chevron belongs to <code>nav</code> alone. An illegal pairing falls back to the variant's default and warns.</p>
    </div>
    <div>
      <L t="Empty state · required, in the product's voice" />
      <List header="Clients" emptyState={{title:"No clients bound yet", body:"Tap a client anywhere and the next thread opens bound to them.", action:<Pill label="Find a client" size="sm" />}} />

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
