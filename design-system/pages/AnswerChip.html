<script type="text/babel">
const { AnswerChip, ChipRow, SentinelTurn } = window.SentinelDesignSystem_0682a2;
const TOK = ['--color-bubble', '--color-bubble-edge', '--color-bronze-deep', '--color-ink', '--color-muted', '--color-surface', '--color-line', '--radius-full', '--space-8', '--dur-fast', '--ease'];

function App(){ const [sel,setSel] = React.useState('Salary plus bonus'); return (
  <PageShell name="AnswerChip" group="Actions" status="shipped" requires={['AnswerChip','ChipRow','SentinelTurn']}
    summary="The fast path through a question. Five variants, and each one is a different KIND of offer rather than a different colour: an ordinary answer, one read from the client's record, a question about the question, an answer that declines, and the one the product expects.">
    <Block n={1} title="Specimen"><Specimen width={343}><ChipRow><AnswerChip label="Use her KYC age — 38" variant="smart" /><AnswerChip label="Type it instead" /></ChipRow></Specimen></Block>
    <Block n={2} title="The five variants" sub="Not five colours for decoration — five different things a chip can be.">
      <Grid cols={1} items={[
        {label:'outline — an ordinary answer', node:<div style={{width:343}}><ChipRow><AnswerChip label="Fixed salary" /><AnswerChip label="Own business" /></ChipRow></div>, note:'The default. Most chips in the product are these.'},
        {label:'smart — read from the record', node:<div style={{width:343}}><ChipRow><AnswerChip label="From her last ITR — ₹1,80,000" variant="smart" /></ChipRow></div>, note:'The product already knows this. It is offered rather than filled in, because the advisor has to agree it is still true.'},
        {label:'tertiary — a question about the question', node:<div style={{width:343}}><ChipRow><AnswerChip label="Why twelve questions?" variant="tertiary" /><AnswerChip label="How is 54 worked out?" variant="tertiary" /></ChipRow></div>, note:'It does not answer; it opens an explainer. Quieter, because taking it does not move the journey.'},
        {label:'muted — an answer that declines', node:<div style={{width:343}}><ChipRow><AnswerChip label="She isn’t sure yet" variant="muted" /></ChipRow></div>, note:'A real answer, and the product records it as one. Not a skip.'},
        {label:'primary — the expected one', node:<div style={{width:343}}><ChipRow><AnswerChip label="Let’s go" variant="primary" /><AnswerChip label="Carry on" variant="primary" /></ChipRow></div>, note:'One per row, at most. Two primaries is a screen that has not decided.'},
      ]} />
    </Block>
    <Block n={3} title="With a subtitle" sub="Full width, and only where the WORDING changes the meaning — a risk question whose five answers differ by a shade of phrasing.">
      <Specimen width={343}>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {[['Protect it','Keep what she has, even if it grows slowly'],['Grow steadily','Accept some falls for a better long run'],['Push for the most','Accept large falls for the highest return']].map(([l,s])=>
            <AnswerChip key={l} label={l} subtitle={s} selected={sel===l} onClick={()=>setSel(l)} />)}
        </div>
      </Specimen>
    </Block>
    <Block n={4} title="Tokens"><Tokens names={TOK} /></Block>
    <Block n={5} title="Props"><Props src="../components/actions/AnswerChip.d.ts" /></Block>
    <Block n={6} title="Do / don't">
      <DoDont doNode={<div style={{width:300}}><ChipRow><AnswerChip label="Show the 18 holdings" /><AnswerChip label="Why is 71% a problem?" variant="tertiary" /></ChipRow></div>}
        doCaption="Inside the turn that offered them. They scroll away with it."
        dontNode={<div style={{width:300}}><ChipRow><AnswerChip label="Yes" variant="primary" /><AnswerChip label="OK" variant="primary" /><AnswerChip label="Continue" variant="primary" /></ChipRow></div>}
        dontCaption="Three primaries, and none of them says what happens. A chip is the sentence the advisor would have typed." />
    </Block>
    <Block n={7} title="Motion"><Motion rows={[
      {name:'Row arrives', property:'fade + rise, 60 ms apart', duration:'240 ms', reduced:'All present at once.'},
      {name:'Press', property:'scale 0.98', duration:'120 ms', reduced:'No scale; the fill still changes.'},
      {name:'Select', property:'fill and ring change in place', duration:'150 ms', reduced:'Immediate.'}]} /></Block>
  </PageShell>); }
mountPage(App);

</script>
