<body><div id="root"></div>

<script type="text/babel">
const { InlineActionRow, SentinelBlock, SentinelText, Pill } = window.SentinelDesignSystem_0682a2;
const TOK = ['--color-bubble', '--color-bubble-edge', '--color-bronze-deep', '--color-ink', '--color-muted', '--color-surface', '--color-line', '--radius-full', '--border-focus', '--focus-ring', '--press-scale'];

function App(){ const [last,setLast] = React.useState('—'); return (
  <PageShell name="InlineActionRow" group="Actions" status="shipped" requires={['InlineActionRow','SentinelBlock','SentinelText','Pill']}
    summary="Pills placed inside a message body. They act on the answer just given. The distinction from every other row of pills in this product is PLACEMENT, not appearance: these sit in the message, so they belong to it and scroll away with it.">
    <Block n={1} title="Specimen"><Specimen width={343}>
      <SentinelBlock><SentinelText text="Two moves queued. Sharma has not been told yet." />
        <div style={{marginTop:12}}><InlineActionRow actions={[{label:'Tell Sharma now',onClick:()=>setLast('Tell Sharma now')},{label:'Start a review',onClick:()=>setLast('Start a review')}]} /></div>
      </SentinelBlock></Specimen></Block>
    <Block n={2} title="Tones" sub="Inherited from Pill. Tertiary for the one that opens an explainer rather than doing something.">
      <Grid cols={1} items={[
        {label:'two actions', node:<div style={{width:343}}><InlineActionRow actions={[{label:'Show the five we skipped'},{label:'Why 20% STCG?',tone:'tertiary'}]} /></div>},
        {label:'one', node:<div style={{width:343}}><InlineActionRow actions={[{label:'Read the note to Sharma'}]} /></div>, note:'One is common and correct. A row of one is still the row, because the next turn may add to it.'},
      ]} />
    </Block>
    <Block n={3} title="Live"><Specimen width={343}><InlineActionRow animate actions={[{label:'Look up a client',onClick:()=>setLast('Look up a client')},{label:'Explain a drift',onClick:()=>setLast('Explain a drift')}]} /></Specimen>
      <p style={{fontFamily:'var(--font-ui)',fontSize:12.5,color:'var(--color-muted)',marginTop:10}}>Last: {last}</p></Block>

    <Block n={5} title="Props"><Props src="../components/actions/InlineActionRow.d.ts" /></Block>
    <Block n={6} title="Motion"><Motion rows={[{name:'Arrive', property:'fade + rise, 60 ms apart — matching ChipRow', duration:'240 ms', reduced:'All present at once.'}]} /></Block>
  </PageShell>); }
mountPage(App);
