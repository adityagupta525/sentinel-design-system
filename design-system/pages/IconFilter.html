<script type="text/babel">
const { IconFilter, IconChevronRight, IconPlus, Surface, Pressable } = window.SentinelDesignSystem_0682a2;
const TOK = ['--color-bronze','--color-bronze-deep','--color-surface','--h-filter-chip','--radius-full'];

function App() {
  return (
    <PageShell name="IconFilter" group="Foundations" status="shipped" requires={['IconFilter']}
      summary="Three sliders, not a funnel. A funnel glyph is the common choice and it is wrong here: this product HAS a funnel — four questions down the screen — and using its picture for the thing that NARROWS the result would name two different mechanics with one shape. Sliders say “adjust”, which is what the sheet does. Added 23 Sep 2026 because the fund explorer's filter control was the word “Filters”, which on a 343pt bar costs a third of the crumbs' room and says nothing the glyph does not.">

      <Block n={1} title="Specimen" sub="15 viewBox, 1.5 stroke, round caps, --color-bronze — the set's own idiom, so it sits with the others rather than beside them.">
        <Surface>
          <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-20)' }}>
            <IconFilter /><IconChevronRight /><IconPlus />
          </div>
        </Surface>
      </Block>

      <Block n={2} title="Two rails, not three" sub="Drawn first with three rails and three knobs, then looked at: at 15px with a 1.5 stroke it read as a dense smudge rather than as sliders. Two rails with larger knobs keeps the idea at the size it is actually used.">
        <Grid cols={2} items={[
          { label: 'At 15 — where it lives', node: <Surface><IconFilter /></Surface>, note: 'Two rails, two knobs, off-centre.' },
          { label: 'At 48 — where it does not', node: <Surface><IconFilter size={48} /></Surface>, note: 'The same drawing, enlarged. Nothing here is tuned for this size.' },
        ]} />
      </Block>

      <Block n={3} title="Where it is used" sub="In the fund explorer's path bar, as a glyph and a COUNT. The count stays because “how many are on” is the one thing an icon cannot say, and it is exactly what an advisor needs before they open the sheet.">
        <Surface>
          <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-12)' }}>
            <Pressable label="Filters" style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-4)', height: 'var(--h-filter-chip)', padding: `0 var(--space-8)`, borderRadius: 'var(--radius-full)', background: 'var(--color-chip)', boxShadow: '0 0 0 var(--border-1) var(--color-bubble-edge)' }}>
              <IconFilter />
            </Pressable>
            <Pressable label="Filters, 3 on" pressed style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-4)', height: 'var(--h-filter-chip)', padding: `0 var(--space-8)`, borderRadius: 'var(--radius-full)', background: 'var(--color-selected)', boxShadow: '0 0 0 var(--border-1) var(--color-bronze)' }}>
              <IconFilter stroke="var(--color-bronze-deep)" />
              <span style={{ font: 'var(--type-caption-font)', color: 'var(--color-bronze-deep)', fontVariantNumeric: 'tabular-nums' }}>3</span>
            </Pressable>
          </div>
        </Surface>
      </Block>

      <Block n={4} title="Tokens"><Tokens names={TOK} /></Block>
      <Block n={5} title="Props"><Props src="../components/icons/IconFilter.d.ts" /></Block>

      <Block n={6} title="Do / Don't">
        <DoDont
          doNode={<Surface><Pressable label="Filters, 3 on" pressed style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-4)', height: 'var(--h-filter-chip)', padding: `0 var(--space-8)`, borderRadius: 'var(--radius-full)', background: 'var(--color-selected)', boxShadow: '0 0 0 var(--border-1) var(--color-bronze)' }}><IconFilter stroke="var(--color-bronze-deep)" /><span style={{ font: 'var(--type-caption-font)', color: 'var(--color-bronze-deep)' }}>3</span></Pressable></Surface>}
          doCaption="The glyph carries the door and the figure carries the state. An accessible name says both, because a screen reader cannot see either."
          dontNode={<Surface><Pressable label="Filters" style={{ display: 'flex', alignItems: 'center', height: 'var(--h-filter-chip)', padding: `0 var(--space-8)`, borderRadius: 'var(--radius-full)', background: 'var(--color-selected)', boxShadow: '0 0 0 var(--border-1) var(--color-bronze)' }}><IconFilter stroke="var(--color-bronze-deep)" /></Pressable></Surface>}
          dontCaption="Selected, with no count. The ring says something is on and refuses to say what or how much — which is the tap the count exists to save." />
      </Block>

      <Block n={7} title="Motion">
        <Motion rows={[
          { name: 'None', property: 'The glyph does not animate. A filter icon that spins or tilts on open is motion spent on the door rather than on what is behind it', duration: 'none', reduced: 'Unchanged.' },
        ]} />
      </Block>
    </PageShell>
  );
}
mountPage(App);
</script></body></html>
