<script type="text/babel">

const { Mascot, IconSparkle, SentinelBlock, SentinelText } = window.SentinelDesignSystem_0682a2;

function Sig({ mark }) {

}
function App() {
  return (
  <PageShell name="Mascot" group="Brand" status="shipped" requires={['Mascot','IconSparkle','SentinelBlock','SentinelText']}
    summary="The character that exists as a 3D model in Blender exists here as one SVG built from tokens, so the drawing and the model are the same creature at two resolutions. Head only — the body is noise at every size this is used at. Two neutrals from the surface set and the one bronze: rule 1 holds, and no colour enters the system for it. Three states, because a state is a claim about what the product is doing.">
    <Block n={1} title="Specimen" sub="At the splash's size, on the ground the splash uses.">
      <Specimen width={343}><div style={{ display:'flex', justifyContent:'center', alignItems:'center', padding:'var(--space-24)', background:'var(--color-ink)', borderRadius:'var(--radius-16)' }}><Mascot size={168} /></div></Specimen>
    </Block>
    <Block n={2} title="Anatomy" sub="Proportions read off the model's orthographic front view, not designed here.">
      <Anatomy width={311} top="head 100 × 74, rx 18 — wider than tall" bottom="body omitted on purpose" left="tab 6 × 14, bronze-deep" right="eyes 8 × 8, LOW and RIGHT of the plate's centre">
        <div style={{ display:'flex', justifyContent:'center', alignItems:'center', padding:'var(--space-24)', background:'var(--color-ink)', borderRadius:'var(--radius-16)' }}><Mascot size={200} /></div>
      </Anatomy>
    </Block>
    <Block n={3} title="Variants" sub="Which neutral is the shell and which is the plate. The eyes are bronze in both.">
      <Grid cols={2} itemWidth={311} items={[
        {label:'tone="light" — for ink grounds', node:<div style={{ display:'flex', justifyContent:'center', alignItems:'center', padding:'var(--space-24)', background:'var(--color-ink)', borderRadius:'var(--radius-16)' }}><Mascot size={120} tone="light" /></div>, note:'The splash.'},
        {label:'tone="dark" — for the canvas', node:<div style={{ display:'flex', justifyContent:'center', alignItems:'center', padding:'var(--space-24)', background:'var(--color-canvas)', borderRadius:'var(--radius-16)', boxShadow:'0 0 0 1px var(--color-line)' }}><Mascot size={120} tone="dark" /></div>, note:'Inverted, same four tokens.'},
      ]} />
    </Block>
    <Block n={4} title="States" sub="Three, and deliberately no more. There is no happy, confused or empathetic — a wealth-management tool should not claim a mood about a figure it is about to show.">
      <Grid cols={3} itemWidth={311} items={[
        {label:'waking', node:<div style={{ display:'flex', justifyContent:'center', alignItems:'center', padding:'var(--space-24)', background:'var(--color-ink)', borderRadius:'var(--radius-16)' }}><Mascot size={120} state="waking" /></div>, note:'Eyes off. Cold start only.'},
        {label:'attentive', node:<div style={{ display:'flex', justifyContent:'center', alignItems:'center', padding:'var(--space-24)', background:'var(--color-ink)', borderRadius:'var(--radius-16)' }}><Mascot size={120} state="attentive" /></div>, note:'The resting face, and the default.'},
        {label:'working', node:<div style={{ display:'flex', justifyContent:'center', alignItems:'center', padding:'var(--space-24)', background:'var(--color-ink)', borderRadius:'var(--radius-16)' }}><Mascot size={120} state="working" /></div>, note:'Eyes on dot-pulse — 1.2s, the second trailing 150ms. SentinelThinking\'s own rhythm.'},
