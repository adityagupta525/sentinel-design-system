<script type="text/babel">
const { AttachmentTurn, UserBubble, FileUpload, ParseNote } = window.SentinelDesignSystem_0682a2;
const TOK = ['--color-bubble', '--color-bubble-edge', '--color-ink', '--color-muted', '--radius-16', '--type-body-font', '--type-caption-font', '--space-8', '--space-10'];

const SUPPLIED = { name: 'Sharma-Q3-2026.pdf', size: 486000 };
const PICKED = { name: 'whatever-the-viewer-picked.pdf', size: 128400, picked: true };
const DONE = [{label:'Read 14 pages', state:'done'},{label:'Found 18 holdings', state:'done'},{label:'Matched to the mandate', state:'done'}];
const PENDING = [{label:'Read the pages', state:'pending'},{label:'Find the holdings', state:'pending'},{label:'Match to the mandate', state:'pending'}];
function App(){
  const [file,setFile] = React.useState(SUPPLIED);
  return (
  <PageShell name="AttachmentTurn" group="Chat" status="shipped" requires={['AttachmentTurn','UserBubble','FileUpload','ParseNote']}
    summary="What the paperclip produces. The caption sits on the advisor's side because attaching is something they said; the file sits under it. Promoted out of screens/journey-b/thread.jsx on 20 Sep 2026, where every screen used the same ten lines.">
    <Block n={1} title="Specimen" sub="The designed file: stages that completed, and a summary naming what was found.">
      <Specimen width={343}><AttachmentTurn file={SUPPLIED} caption="Here is his Q3 statement." stages={DONE} summary="Read his Q3 statement · 14 pages · 18 holdings" /></Specimen>
    </Block>
    <Block n={2} title="The rule this component exists to hold" sub="A picked file never gets a summary. A designed specimen has a designed output; somebody's own PDF has none, and printing a holdings count over it would be a figure nothing produced.">
      <Grid cols={1} items={[
        {label:'supplied by the specimen', node:<div style={{width:343}}><AttachmentTurn file={SUPPLIED} caption="Here is his Q3 statement." stages={DONE} summary="Read his Q3 statement · 14 pages · 18 holdings" /></div>, note:'Completed stages and a summary, because both are real for this file.'},
        {label:'picked by the viewer', node:<div style={{width:343}}><AttachmentTurn file={PICKED} caption="Here is the statement." stages={DONE} pendingStages={PENDING} summary="Read his Q3 statement · 14 pages · 18 holdings" /></div>, note:'The real name and size, the stages pending, no summary, and a ParseNote saying the specimen does not read it. The control is real; the claim is not made.'},
        {label:'nothing attached', node:<div style={{width:343,font:'var(--type-caption-font)',color:'var(--color-muted)'}}>{String(<AttachmentTurn file={null} />) && 'renders nothing'}</div>, note:'A null file renders nothing, so a caller can pass its attachment state straight through.'},
      ]} />
    </Block>
    <Block n={3} title="Live" sub="Switch between the two and watch what is claimed change.">
      <Specimen width={343}><AttachmentTurn file={file} caption="Here is his Q3 statement." stages={DONE} pendingStages={PENDING} summary="Read his Q3 statement · 14 pages · 18 holdings" onRemove={()=>setFile(file===SUPPLIED?PICKED:SUPPLIED)} /></Specimen>
    </Block>
    <Block n={4} title="Tokens"><Tokens names={TOK} /></Block>
    <Block n={5} title="Props"><Props src="../components/chat/AttachmentTurn.d.ts" /></Block>
    <Block n={6} title="Motion">
      <Motion rows={[
        {name:'The turn arrives', property:'ds-rise on the turn', duration:'240 ms', reduced:'Fades in place.'},
        {name:'Stages fill', property:"FileUpload's own progression, one row at a time", duration:'\u2014', reduced:'The rows appear complete.'},
      ]} />
    </Block>
  </PageShell>);
}
mountPage(App);

</script>
