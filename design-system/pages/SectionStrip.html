<script type="text/babel" src="./page-kit.jsx"></script>
<script type="text/babel">
const { SectionStrip, Surface, FigureRow } = window.SentinelDesignSystem_0682a2;
const TOK = ['--h-filter-chip','--color-chip','--color-selected','--color-bronze','--radius-full','--type-label-font','--tracking-pill'];

const SECTIONS = [
  { id: 'perf', label: 'Performance' }, { id: 'stats', label: 'Key stats' },
  { id: 'hold', label: 'Holdings' }, { id: 'sector', label: 'Sectors' },
  { id: 'clients', label: 'Your clients' }, { id: 'risk', label: 'Risk' }, { id: 'about', label: 'About' },
];

function Live() {
  const [active, setActive] = React.useState('perf');
  return (
    <div style={{ width: 375, borderRadius: 24, overflow: 'hidden', background: 'var(--color-canvas)', boxShadow: '0 0 0 1px var(--ring-frame)' }}>
      <div style={{ padding: '16px 16px 8px' }}>
        <p style={{ margin: 0, font: 'var(--type-sheet-title-font)', color: 'var(--color-ink)' }}>Parag Parikh Flexi Cap</p>
      </div>
      <SectionStrip sections={SECTIONS} active={active} onJump={setActive} />
      <div style={{ padding: '16px' }}>
        <Surface>
          <FigureRow label={SECTIONS.find((s) => s.id === active).label} value="the section below the strip" />
        </Surface>
      </div>
    </div>
  );
}

function App() {
  return (
    <PageShell name="SectionStrip" group="Shell" status="shipped" requires={['SectionStrip']}
      summary="A fund page is a CROSS-REFERENCE task — the expense ratio read against the three-year return, the riskometer against what the client already holds — and NN/g is explicit that tabs are wrong for exactly that: switching back and forth to compare taxes short-term memory and interaction cost. Groww's four-tab fund page is the Indian convention that makes an advisor remember the number they left behind. So the page is ONE SCROLL, and this is how it stays navigable: a mini table of contents that stays in place and shows where the reader currently is.">

      <Block n={1} title="Specimen" sub="Live. Tap a section; the active pill scrolls itself into view, because a current-location indicator the advisor cannot see is not an indicator.">
        <Specimen width={375}><Live /></Specimen>
      </Block>

      <Block n={2} title="It is NOT tabs, and must not read as them" sub="Tabs change WHAT you are looking at; this changes WHERE you are in one thing. So it borrows the filter-pill vocabulary at 32px — the same shape RangePills uses for a window over one series — and takes button roles, not tablist/tab, which would promise arrow-key movement between panels that do not exist.">
        <Grid cols={2} itemWidth={343} items={[
          {label:'section strip', node:<div style={{background:'var(--color-canvas)'}}><SectionStrip sections={SECTIONS.slice(0,4)} active="stats" onJump={() => {}} /></div>,
           note:'One page, seven places in it. Selection is the sand fill and the bronze ring.'},
          {label:'why not tabs', node:<div style={{padding:'var(--space-12)'}}><p style={{margin:0, font:'var(--type-caption-font)', color:'var(--color-muted)'}}>Four tabs would hide the expense ratio while the advisor reads the return, and hide the return while they read the risk — then ask them to remember both.</p></div>,
           note:'The usability evidence against tabs is about cross-reference specifically, which is what a fund page is.'},
        ]} />
      </Block>

      <Block n={3} title="Tokens"><Tokens names={TOK} /></Block>
      <Block n={4} title="Props"><Props src="../components/shell/SectionStrip.d.ts" /></Block>

      <Block n={5} title="Do / Don't">
        <DoDont
          doNode={<div style={{background:'var(--color-canvas)'}}><SectionStrip sections={SECTIONS} active="hold" onJump={() => {}} /></div>}
          doCaption="One or two words per pill. The row scrolls, and the active pill brings itself into view."
          dontNode={<div style={{background:'var(--color-canvas)'}}><SectionStrip sections={[{id:'a',label:'Performance and returns'},{id:'b',label:'Portfolio holdings and sectors'},{id:'c',label:'How your clients hold it'}]} active="a" onJump={() => {}} /></div>}
          dontCaption="Sentences in pills. The strip now scrolls twice as far to show half as many places, and no pill can be scanned at a glance." />
      </Block>

      <Block n={6} title="Motion">
        <Motion rows={[
          { name: 'Active pill into view', property: 'scrollIntoView, inline nearest', duration: 'browser smooth', reduced: 'The browser honours prefers-reduced-motion for smooth scrolling; the pill still ends up in view.' },
          { name: 'Press', property: 'transform: scale(--press-scale)', duration: '--dur-press 150ms', reduced: 'Pressable drops the scale.' },
        ]} />
      </Block>
    </PageShell>
  );
}
mountPage(App);
</script></body></html>
