<script type="text/babel">

function App(){ return (

    summary="Four layers and no props: the cream canvas, a 3px dotted paper texture, a bronze aura top-left and a shadow aura top-right. It is the first child of every screen, it takes no configuration, and that is deliberate — a backdrop a screen can tune is a backdrop that differs from screen to screen.">
    <Block n={1} title="Specimen"><Specimen width={423}><PhoneFrame><ScreenBackdrop /></PhoneFrame></Specimen></Block>
    <Block n={2} title="Why the texture" sub="Flat cream at 375 reads as unfinished. Three pixels of dotted paper at very low contrast gives the surface something to be, without becoming anything a reader notices.">
      <Grid cols={1} items={[
        {label:'with it', node:<div style={{width:200,height:120,position:'relative',borderRadius:16,overflow:'hidden'}}><ScreenBackdrop /></div>},

      ]} />
    </Block>
    <Block n={3} title="Under content" sub="Everything sits above it at z-index 1. The auras never reach the content because they are top-left and top-right of a screen whose content starts below the app bar.">

          <div style={{position:'relative',height:'100%',padding:16,boxSizing:'border-box'}}>
            <ScreenBackdrop />
            <div style={{position:'relative',zIndex:1,marginTop:120}}>
