function App(){ return (

    summary="Rule 4 says every figure says where it came from. This is that line. Eleven pixels, regular, muted, sentence case — quiet on purpose, because it is under every card in the product and a loud version of it would drown the figures it qualifies.">
    <Block n={1} title="Specimen"><Specimen width={343}><Provenance text="As of 30 Sep · from his Q3 statement and the mandate on file" /></Specimen></Block>
    <Block n={2} title="What a good one says" sub="Three things, in this order: as of WHEN, from WHERE, and — when it is not all of it — how much.">
      <Grid cols={1} items={[
        {label:'date and source', node:<div style={{width:343}}><Provenance text="As of 30 Sep · from the scheme record and your own book" /></div>, note:'The minimum. An advisor asked "how do you know?" can answer from this line alone.'},
        {label:'and completeness', node:<div style={{width:343}}><Provenance text="As of 30 Sep · from his Q3 statement · all 18 funds reported" /></div>, note:'The research’s top theme was a total that was quietly short because one AMC had not reported. Saying where a figure came from does not say whether it is all of it.'},

      ]} />
    </Block>
    <Block n={3} title="Where it sits" sub="Directly under the thing it qualifies, at --space-10. Never in a page footer: a figure and its provenance separated by a scroll is a figure with none.">

          <div style={{display:'flex',gap:8,marginTop:10}}>

          <div style={{marginTop:'var(--space-10)'}}><Provenance text="As of 30 Sep · exit load from scheme documents, STCG at 20%" /></div>
