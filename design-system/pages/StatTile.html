<!DOCTYPE html><html><head><meta charset="utf-8"><title>StatTile — Sentinel</title><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script type="module">import * as s from 'https://cdn.jsdelivr.net/npm/d3-scale@4/+esm';import * as h from 'https://cdn.jsdelivr.net/npm/d3-shape@3/+esm';window.d3=Object.assign({},window.d3||{},s,h);window.dispatchEvent(new Event('d3ready'));</script>
<style>html,body{margin:0;background:var(--color-desk);font-family:var(--font-ui)}#root{background:var(--color-canvas);min-height:100vh}a{color:var(--color-bronze-deep)}a:hover{color:var(--color-bronze)}.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="./page-kit.jsx"></script>
<script type="text/babel">
const { StatTile, Sparkline, Surface } = window.SentinelDesignSystem_0682a2;
const TOK = ['--color-bronze', '--color-bronze-deep', '--color-track', '--color-line', '--color-surface', '--color-muted', '--color-ink', '--color-data-deemph', '--color-status-over-fg', '--type-figure-font', '--type-caption-font', '--radius-full'];

function App(){ const [sheet,setSheet] = React.useState('—'); return (
  <PageShell name="StatTile" group="Data" status="shipped" requires={['StatTile','Sparkline','Surface']}
    summary="Surface ground, outset ring, 24px display bronze. Use it when the figure IS the point of the turn. Its quiet counterpart is InfoCard’s stat box — canvas ground, inset ring, 13px ink — for a fact ABOUT the thing the card is already about. The test: if the reader came for this number it is a figure tile; if they came for the thing and this number qualifies it, it is a footnote stat.">
    <Block n={1} title="Specimen"><Specimen width={343}>
      <div style={{display:'flex',gap:8}}>
        <StatTile label="Cost of doing nothing" value="₹4,40,000" note="in a 20% fall" />
        <StatTile label="Cost of fixing it now" value="₹11,200" note="exit load + STCG" />
      </div></Specimen></Block>
    <Block n={2} title="Its four states">
      <Grid cols={1} items={[
        {label:'a figure', node:<div style={{width:170}}><StatTile label="Her book" value="₹18,40,000" note="43 funds · as of 30 Sep 2026" /></div>},
        {label:'with an ⓘ', node:<div style={{width:170}}><StatTile label="Her risk number" value="54" note="Moderate · locked 15 Sep" onExplain={()=>setSheet('Her risk number')} /></div>, note:'Pass onExplain wherever the figure is one an advisor will be asked about. It went undocumented for four versions, which is how the review’s four figures ended up with no door.'},
        {label:'with a caveat', node:<div style={{width:170}}><StatTile label="Three-year return" value="21.4%" note="against Nifty 500 TRI" caveat="Annualised, before tax" /></div>, note:'The caveat qualifies the ARITHMETIC; the note qualifies the figure. Two different jobs, two different lines.'},
        {label:'locked', node:<div style={{width:190}}><StatTile locked label="What she actually holds" value="—" note="[PLACEHOLDER — her split, to supply]" onExplain={()=>setSheet('The absence')} /></div>, note:'A figure supplied elsewhere: chip ground, de-emphasised value. It takes an ⓘ too — the absence is the thing that most needs explaining.'},
      ]} />
      <p style={{fontFamily:'var(--font-ui)',fontSize:12.5,color:'var(--color-muted)',marginTop:10}}>Last ⓘ: {sheet}</p>
    </Block>
    <Block n={3} title="With a sparkline" sub="The one place a second mark is allowed inside a tile — and it is a shape, never a second figure.">
      <Specimen width={343}><StatTile label="Drift added since 30 Jun" value="+9 points" note="62% to 71% against a 60% target" sparkline={<Sparkline points={[62,64,67,69,71]} width={120} />} /></Specimen></Block>
    <Block n={4} title="Tokens"><Tokens names={TOK} /></Block>
    <Block n={5} title="Props"><Props src="../components/data/StatTile.d.ts" /></Block>
    <Block n={6} title="Do / don't">
      <DoDont doNode={<div style={{width:300,display:'flex',gap:8}}><StatTile label="Cost of doing nothing" value="₹4,40,000" note="in a 20% fall" /><StatTile label="Cost of fixing it now" value="₹11,200" note="exit load + STCG" /></div>}
        doCaption="Two figures that are the point, side by side, each with the line that qualifies it."
        dontNode={<div style={{width:300,display:'flex',gap:6}}><StatTile label="TER" value="0.63%" /><StatTile label="AUM" value="₹89,400 cr" /><StatTile label="Exit" value="2%" /></div>}
        dontCaption="Three facts ABOUT a fund, in the loud tile. These are footnote stats — they belong under the fund’s name at 13px, not shouting at 24." />
    </Block>
    <Block n={7} title="Motion"><Motion rows={[{name:'None of its own', property:'the card it sits in animates; the figure does not count up', duration:'—', reduced:'Unchanged.'}]} /></Block>
  </PageShell>); }
mountPage(App);

</script>
</body></html>
