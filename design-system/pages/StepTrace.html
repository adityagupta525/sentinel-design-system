const FULL = [

  {label:'Checked the compliance shelf', state:'done', meta:'4 approved'},
  {label:'Priced the switch', state:'done', meta:'₹11,200'},

const MID = [

  {label:'Matched to the mandate', state:'running'},
  {label:'Checked the compliance shelf', state:'pending'},
  {label:'Priced the switch', state:'pending'},
];
const FAIL = [
  {label:'Read her holdings', state:'done', meta:'12 holdings'},
  {label:'Matched to the mandate', state:'failed', detail:'Her mandate on file is from 2024 and has no equity ceiling.', retry:<Pill label="Use the 2026 draft" size="sm" tone="tertiary" />},
  {label:'Priced the switch', state:'pending'},
];

  return (
  <PageShell name="StepTrace" group="Chat" status="shipped" requires={['StepTrace','SentinelBlock','SentinelText','Pill','ArtifactCard']}
    summary="What the assistant did, as collapsible one-line rows with per-step state. Four AI products have converged on this mechanism — Manus indents a step's reasoning beneath it, Linktree's Analysis ⌄ opens a ruled list of ticked steps, ChatGPT collapses a tool call to Ran 3 commands ›, DeepSeek heads its trace Thought for 5 seconds ⌄. For an advisor it is provenance, not decoration: read her holdings · matched to the mandate · checked the compliance shelf is what they repeat to the client.">

    </Block>
    <Block n={2} title="Anatomy" sub="Dimensions outside the frame. Spine and node are ProgressTrace's, unchanged.">
