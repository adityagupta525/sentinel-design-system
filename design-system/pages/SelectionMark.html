<script type="text/babel">
const { SelectionMark, List, ListRow } = window.SentinelDesignSystem_0682a2;
const TOK = ['--color-surface', '--color-canvas', '--color-chip', '--color-line', '--color-muted', '--color-ink', '--color-bronze', '--color-bronze-deep', '--radius-12', '--radius-16', '--border-focus', '--focus-ring'];

function App(){ const [one,setOne] = React.useState('meeting'); const [many,setMany] = React.useState(['cost']);
  const tog = (k)=>setMany(m=>m.includes(k)?m.filter(x=>x!==k):[...m,k]);
  return (
  <PageShell name="SelectionMark" group="Forms" status="shipped" requires={['SelectionMark','List','ListRow']}
    summary="Not an icon. It is drawn inside the component that owns it and is never rendered on its own — a mark with no row is a control with no label, and this product has none of those. Radio is one of a set; checkbox is several. The pairing is enforced by the ROW, not chosen here.">
    <Block n={1} title="Specimen"><Specimen width={343}>
      <div style={{display:'flex',gap:24,alignItems:'center'}}>
        <span style={{display:'flex',gap:10,alignItems:'center'}}><SelectionMark kind="radio" /><SelectionMark kind="radio" selected /><span style={{font:'var(--type-caption-font)',color:'var(--color-muted)'}}>radio</span></span>
        <span style={{display:'flex',gap:10,alignItems:'center'}}><SelectionMark kind="checkbox" /><SelectionMark kind="checkbox" selected /><span style={{font:'var(--type-caption-font)',color:'var(--color-muted)'}}>checkbox</span></span>
        <span style={{display:'flex',gap:10,alignItems:'center'}}><SelectionMark kind="radio" disabled /><SelectionMark kind="checkbox" selected disabled /><span style={{font:'var(--type-caption-font)',color:'var(--color-muted)'}}>disabled</span></span>
      </div></Specimen></Block>
    <Block n={2} title="One of a set" sub="Radio. The row is `select`, and choosing one unchooses the rest — which is the row’s job, not the mark’s.">
      <Specimen width={343}>
        <List dividers="inset" emptyState={{title:'Nothing to pick.'}} items={[
          {title:'Her annual record', subtitle:'Filed, and it proposes nothing', variant:'select', trailing:'radio', selected:one==='record', onPress:()=>setOne('record')},
          {title:'A meeting with her', subtitle:'What to raise, and what to ask', variant:'select', trailing:'radio', selected:one==='meeting', onPress:()=>setOne('meeting')},
          {title:'Before she invests more', subtitle:'What would have to change first', variant:'select', trailing:'radio', selected:one==='invest', onPress:()=>setOne('invest')},
        ]} />
      </Specimen>
    </Block>
    <Block n={3} title="Several of a set" sub="Checkbox. Same rows, different rule, and the mark is the only thing that tells an advisor which.">
      <Specimen width={343}>
        <List dividers="inset" emptyState={{title:'Nothing to pick.'}} items={[
          {title:'Exit load', variant:'multi', trailing:'checkbox', selected:many.includes('load'), onPress:()=>tog('load')},
          {title:'Cost of the switch', variant:'multi', trailing:'checkbox', selected:many.includes('cost'), onPress:()=>tog('cost')},
          {title:'Tax', variant:'multi', trailing:'checkbox', selected:many.includes('tax'), onPress:()=>tog('tax')},
        ]} />
      </Specimen>
    </Block>

    <Block n={5} title="Props"><Props src="../components/forms/SelectionMark.d.ts" /></Block>

mountPage(App);
